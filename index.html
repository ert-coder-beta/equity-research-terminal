function rf(){return last(by('cashflow.ocf')[2])-last(by('cashflow.capex')[2])}function sf(){return rf()-last(by('cashflow.sbc')[2])}function oe(){return last(by('cashflow.ocf')[2])-last(by('cashflow.capex')[2])*.28-last(by('cashflow.sbc')[2])}function fm(){return D.years.map((_,i)=>(by('cashflow.ocf')[2][i]-by('cashflow.capex')[2][i])/by('income.revenue')[2][i]*100)}function bf(){return S.basis==='reported'?rf():S.basis==='sbc'?sf():S.basis==='owner'?oe():last(by('income.revenue')[2])*avg(fm())/100}function dcf(w=S.w,t=S.t,g=S.g){let f=bf(),pv=0,rows=[];g.forEach((x,i)=>{f*=1+x/100;let df=1/Math.pow(1+w/100,i+1);pv+=f*df;rows.push([i+1,x,f,df,f*df])});let tv=f*(1+t/100)/(w/100-t/100),pvt=tv/Math.pow(1+w/100,5),eq=pv+pvt+D.market.netcash;return{ps:eq/D.market.shares,eq,rows}}function rev(){let lo=-30,hi=40;for(let i=0;i<90;i++){let m=(lo+hi)/2;if(dcf(S.w,S.t,[m,m,m,m,m]).ps<D.market.price)lo=m;else hi=m}return(lo+hi)/2}function opm(){return last(by('income.op')[2])/last(by('income.revenue')[2])*100}function roic(){let n=last(by('income.op')[2])*.84,ic=last(by('balance.equity')[2])+last(by('balance.long_debt')[2])-last(by('balance.cash')[2])-last(by('balance.market')[2]);return n/ic*100}function mc(){return D.market.price*D.market.shares}function ev(){return mc()+last(by('balance.long_debt')[2])-last(by('balance.cash')[2])-last(by('balance.market')[2])}function pe(){return D.market.price/last(by('income.eps')[2])}function peg(){return pe()/cagr(by('income.net')[2])}function evs(){return ev()/last(by('income.revenue')[2])}function eve(){return ev()/last(by('income.op')[2])}function evf(){return ev()/rf()}function rsi(a,n=14){let g=0,l=0;for(let i=a.length-n;i<a.length;i++){let d=a[i]-a[i-1];if(d>=0)g+=d;else l-=d}let rs=(g/n)/(l/n||1e-9);return 100-100/(1+rs)}function sma(a,n){return a.slice(-n).reduce((x,y)=>x+y,0)/n}

function valuation(){let r=dcf(),mos=(r.ps/D.market.price-1)*100;return `<h1>Professional Valuation Workbench</h1><div class="lead">Explicit units, year-by-year assumptions and multiple FCF bases.</div><div class="grid two"><div class="card"><h3>Assumptions</h3><div class="formgrid"><label>FCF basis<select id="basis"><option value="reported" ${S.basis==='reported'?'selected':''}>Reported FCF</option><option value="sbc" ${S.basis==='sbc'?'selected':''}>SBC-adjusted FCF</option><option value="owner" ${S.basis==='owner'?'selected':''}>Owner Earnings</option><option value="margin" ${S.basis==='margin'?'selected':''}>5Y average FCF margin</option></select></label><label>WACC (%)<input id="wacc" value="${S.w}"></label><label>Terminal growth (%)<input id="terminal" value="${S.t}"></label><label>Current price (USD/share)<input disabled value="${D.market.price}"></label></div><h3>Year-by-year FCF growth</h3><div class="formgrid">${S.g.map((x,i)=>`<label>Year ${i+1} (%)<input data-g="${i}" value="${x}"></label>`).join('')}</div><div class="formula">Starting FCF: ${fmt(bf())} USD million<br>WACC: ${pct(S.w)}<br>Terminal growth: ${pct(S.t)}</div></div><div class="card"><h3>Result</h3>${lis([['Equity value',fmt(r.eq)+' USD million'],['Shares outstanding',fmt(D.market.shares)+' million shares'],['Intrinsic value',money(r.ps)+' / share'],['Current price',money(D.market.price)+' / share'],['Margin of safety',pct(mos)]])}<div class="finding"><h4>WACC explanation</h4><p>${pct(S.w)} is a user assumption in this build. Production must document risk-free rate, beta, equity-risk premium, cost of debt and capital weights.</p></div></div></div><div class="card" style="margin-top:12px"><h3>Projection table</h3><div class="tw" style="max-height:none"><table style="min-width:800px"><thead><tr><th>Projection</th>${r.rows.map(x=>`<th>Year ${x[0]}</th>`).join('')}</tr></thead><tbody><tr><td>Growth</td>${r.rows.map(x=>`<td>${pct(x[1])}</td>`).join('')}</tr><tr><td>FCF (USD million)</td>${r.rows.map(x=>`<td>${fmt(x[2])}</td>`).join('')}</tr><tr><td>Discount factor</td>${r.rows.map(x=>`<td>${x[3].toFixed(4)}</td>`).join('')}</tr><tr><td>PV (USD million)</td>${r.rows.map(x=>`<td>${fmt(x[4])}</td>`).join('')}</tr></tbody></table></div></div><div class="card" style="margin-top:12px"><h3>Sensitivity — USD/share</h3>${sens()}</div>`}
function sens(){let ws=[7.5,8,8.5,9,9.5],ts=[1.5,2,2.5,3,3.5],best=[0,0,1e9];ws.forEach(w=>ts.forEach(t=>{let v=dcf(w,t).ps,d=Math.abs(v-D.market.price);if(d<best[2])best=[w,t,d]}));return `<div class="tw" style="max-height:none"><table style="min-width:650px"><thead><tr><th>WACC \\ Terminal</th>${ts.map(t=>`<th>${pct(t)}</th>`).join('')}</tr></thead><tbody>${ws.map(w=>`<tr><td>${pct(w)}</td>${ts.map(t=>{let v=dcf(w,t).ps,n=w===best[0]&&t===best[1];return `<td style="${n?'outline:2px solid var(--y);background:#2a2513':''}">${money(v)}${n?'<br><span class="small">Closest to current price</span>':''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function market(){let h=D.history,s20=sma(h,20),s50=sma(h,50),s200=sma(h,200),rv=dcf().ps,rs=rsi(h);return `<h1>Market & Price Context</h1><div class="lead">Price, moving averages, RSI and fair-value comparison.</div><div class="grid k4">${k('Current price',money(D.market.price),'USD/share')}${k('Fair value',money(rv),'USD/share · DCF',rv>=D.market.price?'pos':'neg')}${k('RSI (14)',rs.toFixed(1),rs>70?'Near overbought':rs<30?'Near oversold':'Neutral')}${k('SMA200',money(s200),'Long-term average')}</div><div class="card" style="margin-top:12px"><h3>Price, SMA references and fair value</h3>${pchart(h,rv,s20,s50,s200)}<div class="small">X-axis: latest 260 test trading days. Y-axis: USD/share. Moving averages are references, not buy/sell signals.</div></div>`}
function pchart(a,f,s20,s50,s200){let W=760,H=280,p=40,all=[...a,f,s20,s50,s200],mn=Math.min(...all),mx=Math.max(...all),x=i=>p+i*(W-2*p)/(a.length-1),y=v=>H-p-(v-mn)/(mx-mn)*(H-2*p),path=a.map((v,i)=>(i?'L':'M')+x(i)+','+y(v)).join(' '),cl=(v,c)=>`<path class="${c}" d="M${p},${y(v)} L${W-p},${y(v)}"/>`;return `<div class="chart"><svg viewBox="0 0 ${W} ${H}"><line class="axis" x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}"/><line class="axis" x1="${p}" y1="${p}" x2="${p}" y2="${H-p}"/><path class="line" d="${path}"/>${cl(f,'line2')}${cl(s20,'line3')}${cl(s50,'line2')}${cl(s200,'line3')}<text x="7" y="16" fill="#98a9bb" font-size="11">USD/share</text><text x="${W/2}" y="${H-5}" fill="#98a9bb" font-size="11" text-anchor="middle">time</text></svg></div>`}
function research(){let n=localStorage.getItem('ert-notes')||'';return `<h1>Research Notes</h1><div class="lead">Save your thesis, assumptions and reasons.</div><div class="card"><textarea id="notes" style="width:100%;min-height:220px;background:#0c131c;color:white;border:1px solid var(--l);border-radius:8px;padding:10px">${n}</textarea><div style="margin-top:8px"><button class="btn primary" id="save">Save notes</button></div></div>`}
function report(){let v=dcf().ps,mos=(v/D.market.price-1)*100;return `<div class="actions"><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div><div class="report"><h1>Alphabet Inc. (GOOG)</h1><p><strong>Plain-language equity research summary</strong></p><h2>Three-minute summary</h2><p>Alphabet remains a high-quality, cash-generative business. Revenue growth accelerated in 2024, operating margin expanded, and returns on capital remained strong. The main trade-off is sharply higher capital expenditure, which may support AI and data-centre growth but reduces near-term free cash flow.</p><h2>Valuation view</h2><p>The current test price is <strong>${money(D.market.price)}</strong>. The base DCF is <strong>${money(v)}</strong>, implying <strong>${pct(mos)}</strong> upside/downside. The result depends heavily on WACC, terminal growth and the chosen FCF definition.</p><h2>Why it may improve</h2><ul><li>Revenue growth reaccelerated.</li><li>Operating margin reached a five-year high in the test dataset.</li><li>Strong cash generation supports reinvestment and shareholder returns.</li></ul><h2>Why the thesis may be wrong</h2><ul><li>AI infrastructure spending may remain high for longer.</li><li>Regulation may affect Search economics.</li><li>Competition may weaken growth or margins.</li></ul><h2>Conclusion</h2><p>GOOG appears worthy of deeper research, but the valuation should not be accepted without checking the assumptions and source data.</p><h2>Disclaimer</h2><p>For research and educational reference only. Not investment advice.</p></div>`}
function disclaimer(){return `<h1>Disclaimer</h1><div class="card"><p>This terminal supports research and education only.</p><p>All outputs are for reference. Users should independently verify all data and conduct their own due diligence.</p><p>This software helps users verify information; it does not replace independent judgement.</p></div>`}
function spark(a){let W=320,H=145,p=23,mn=Math.min(...a),mx=Math.max(...a),x=i=>p+i*(W-2*p)/4,y=v=>H-p-(v-mn)/(mx-mn||1)*(H-2*p),path=a.map((v,i)=>(i?'L':'M')+x(i)+','+y(v)).join(' ');return `<div class="chart" style="height:160px"><svg viewBox="0 0 ${W} ${H}"><line class="axis" x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}"/><path class="line" d="${path}"/>${a.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--b)"/><text x="${x(i)}" y="${H-6}" fill="#98a9bb" font-size="10" text-anchor="middle">${D.years[i]}</text>`).join('')}</svg></div>`}
function inspector(){if(!S.show)return `<button id="show" class="restore">Show Evidence</button>`;let r=by(S.sel)||by('income.revenue'),pg=page(r[0]),u=D.source.pdf+'#page='+pg;return `<aside class="ins"><div class="ih"><strong>Evidence Inspector</strong><div class="sp"></div><button id="hide" class="btn">Hide</button></div><div style="padding:12px"><h3>${r[1]}</h3><div class="small">${r[0].includes('eps')?'USD/share':r[0].includes('shares')?'million shares':'USD million'}</div>${spark(r[2])}</div><div class="meta"><div><span>Cell ID</span><strong>${r[0]}.FY2024</strong></div><div><span>Latest value</span><strong>${fmt(last(r[2]),2)}</strong></div><div><span>Form</span><strong>10-K FY2024</strong></div><div><span>Report page</span><strong>${pg}</strong></div><div><span>5Y CAGR</span><strong>${isFinite(cagr(r[2]))?pct(cagr(r[2])):'—'}</strong></div><div><span>2024 YoY</span><strong>${yy(r[2],4)==null?'—':pct(yy(r[2],4))}</strong></div></div><div class="actions"><a class="btn primary" target="_blank" href="${D.source.filing}">Open filing</a><a class="btn" target="_blank" href="${u}">Open page</a></div></aside>`}
function layout(c){return `<div class="app"><header class="top"><div><div class="brand">Equity Research Terminal</div><div class="tag">Every number traceable. Every valuation explainable.</div></div><div class="sp"></div><div class="status">GOOG · Alpha 0.5</div></header><div class="shell"><aside class="side"><nav class="nav">${[['overview','Overview'],['financials','Financials'],['analysis','Analysis'],['valuation','Valuation'],['market','Market'],['research','Research'],['report','Report'],['disclaimer','Disclaimer']].map(x=>`<button data-page="${x[0]}" class="${S.page===x[0]?'active':''}">${x[1]}</button>`).join('')}</nav></aside><main class="main"><div id="work" class="work"><section class="content">${c}</section><div id="res" class="res"></div>${inspector()}</div><div class="footer">Reference only. Not investment advice.</div></main></div></div>`}
function render(){let p={overview,financials,analysis,valuation,market,research,report,disclaimer};app.innerHTML=layout(p[S.page]());bind()}function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{S.page=b.dataset.page;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.st=b.dataset.tab;S.sel=D[S.st][0][0];render()});document.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.row;S.show=true;render()});document.getElementById('hide')?.addEventListener('click',()=>{S.show=false;render()});document.getElementById('show')?.addEventListener('click',()=>{S.show=true;render()});document.getElementById('basis')?.addEventListener('change',e=>{S.basis=e.target.value;render()});document.getElementById('wacc')?.addEventListener('change',e=>{S.w=+e.target.value;render()});document.getElementById('terminal')?.addEventListener('change',e=>{S.t=+e.target.value;render()});document.querySelectorAll('[data-g]').forEach(i=>i.onchange=e=>{S.g[+e.target.dataset.g]=+e.target.value;render()});document.getElementById('save')?.addEventListener('click',()=>{localStorage.setItem('ert-notes',document.getElementById('notes').value);document.getElementById('save').textContent='Saved'});let r=document.getElementById('res'),w=document.getElementById('work');if(r&&w&&S.show){let d=false;r.onmousedown=()=>d=true;window.onmouseup=()=>d=false;window.onmousemove=e=>{if(!d)return;let b=w.getBoundingClientRect(),right=Math.max(280,Math.min(600,b.right-e.clientX));w.style.gridTemplateColumns=`minmax(540px,1fr) 6px ${right}px`};r.ondblclick=()=>w.style.gridTemplateColumns='minmax(540px,1fr) 6px 350px'}}render();
</script></body></html>
