function valuationRange(){const v=valuationSummary(),p=Number(D.market.price),vals=[v.bear,v.base,v.bull,p].filter(Number.isFinite),mn=Math.min(...vals),mx=Math.max(...vals),pad=(mx-mn||1)*.12,a=Math.max(0,mn-pad),b=mx+pad,pos=x=>clamp((x-a)/(b-a)*100,0,100);return `<div class="summarybar"><div class="track"></div><div class="mark bear" style="left:${pos(v.bear)}%">BEAR<br>${money(v.bear)}</div><div class="mark base clickable" data-inspect="valuation:Base" style="left:${pos(v.base)}%">BASE<br>${money(v.base)}</div><div class="mark bull" style="left:${pos(v.bull)}%">BULL<br>${money(v.bull)}</div><div class="mark market" style="left:${pos(p)}%">MARKET<br>${money(p)}</div></div>`}

function overview(){const v=valuationSummary(),z=week52(),px=Number(D.market.price),prem=(px/v.base-1)*100;return `<h1>Alphabet Inc. (GOOG)</h1><div class="lead">Research summary using live-labelled facts, Street consensus and ERT assumptions.</div><div class="grid k5"><div class="card clickable" data-inspect="market:price"><div class="sub">Current price</div><div class="value">${money(px)}</div><div class="small">${D.market.asof||'—'}</div></div><div class="card clickable" data-inspect="valuation:Base"><div class="sub">ERT Base Fair Value</div><div class="value">${money(v.base)}</div><div class="${v.base>=px?'pos':'neg'}">${((v.base/px-1)*100).toFixed(1)}% vs current</div></div><div class="card"><div class="sub">Bear–Bull range</div><div class="value">${money(v.bear)}–${money(v.bull)}</div><div class="small">Same 10Y DCF engine</div></div><div class="card"><div class="sub">52W Low / High</div><div class="value">${z?money(z.low)+' / '+money(z.high):'—'}</div><div class="small">Market range</div></div><div class="card"><div class="sub">Market vs ERT Base</div><div class="value ${prem>0?'neg':'pos'}">${prem>=0?'+':''}${prem.toFixed(1)}%</div><div class="small">${px>v.bull?'Market outside ERT Bull range':'Within ERT range'}</div></div></div><div class="card" style="margin-top:11px"><h3>Price & Fair Value Context</h3>${priceRangeBar()}</div>${earningsFlowHtml()}`}
function financials(){const R=D[S.statement]||D.income,y=D.years;const cy=Number(D.consensus?.nextAnnual?.year)||fiscal0()+1;return `<h1>Financial Statements</h1><div class="lead">SEC annual facts remain separate from Street estimates and ERT forecasts.</div><div class="actions" style="margin-bottom:8px">${[['income','Income Statement'],['balance','Balance Sheet'],['cashflow','Cash Flow']].map(([id,t])=>`<button class="btn ${S.statement===id?'active':''}" data-statement="${id}">${t}</button>`).join('')}</div><div class="tw"><table class="financial-table"><thead><tr><th>Line item</th>${y.map((yr,i)=>`<th>FY${yr}</th>${i?'<th>YoY</th>':''}`).join('')}<th>FY${cy} Street</th><th>FY${cy} ERT</th></tr></thead><tbody>${R.map(r=>{const st=r[0]==='income.revenue'?streetRevenueM(cy):r[0]==='income.eps'?streetEps(cy):null;const d=dcf10('Base').detail[0];const ert=r[0]==='income.revenue'?d.revenue:r[0]==='cashflow.ocf'?d.ocf:r[0]==='cashflow.capex'?d.capex:r[0]==='cashflow.sbc'?d.sbc:null;return `<tr class="row" data-row="${r[0]}"><td>${r[1]}</td>${r[2].map((x,i)=>`<td>${fmt(x,2)}</td>${i?`<td class="${yy(r[2],i)>=0?'pos':'neg'}">${pct(yy(r[2],i))}</td>`:''}`).join('')}<td class="purple">${Number.isFinite(st)?(r[0]==='income.revenue'?fmt(st,1):fmt(st,2)):'—'}</td><td class="blue">${Number.isFinite(ert)?fmt(ert,1):'—'}</td></tr>`}).join('')}</tbody></table></div>`}
function analysis(){const y=fiscal0()+1,rev=by('income.revenue')[2],epsa=by('income.eps')[2],cap=by('cashflow.capex')[2],b=dcf10('Base'),r0=Number(last(rev)),stR=streetRevenueM(y),ertR=b.detail[0].revenue,actF=reportedFcf(),actEF=economicFcf(),ertF=b.detail[0].fcf,stE=streetEps(y),actE=Number(last(epsa));const comb=reverseCombined();let marketR='—',marketRg=NaN,marketF='—',marketFg=NaN,marketCap='—';if(comb.solved){marketR=bn(comb.dcf.detail[0].revenue);marketRg=comb.dcf.detail[0].revGrowth;marketF=bn(comb.dcf.detail[0].fcf);marketFg=actEF?((comb.dcf.detail[0].fcf/actEF)-1)*100:NaN;marketCap=bn(comb.dcf.detail[0].capex)}return `<h1>Analysis</h1><div class="lead">Actual vs ERT vs Street vs Market-implied expectations — amount and percentage shown together.</div><div class="card"><h3>Expectations — Actual vs ERT vs Street vs Market</h3><div class="expect-grid"><div class="head">Metric</div><div class="head">Latest Actual</div><div class="head">ERT Base</div><div class="head">Street</div><div class="head">Market-implied</div><div><strong>Revenue</strong></div>${valCellI(bn(r0),yy(rev,rev.length-1),'analysis:actual:revenue')}${valCellI(bn(ertR),(ertR/r0-1)*100,'analysis:ert:revenue')}${valCellI(Number.isFinite(stR)?bn(stR):'Unavailable',Number.isFinite(stR)?(stR/r0-1)*100:NaN,'analysis:street:revenue')}${valCellI(marketR,marketRg,'analysis:market:revenue')}<div><strong>EPS</strong></div>${valCellI(money(actE),yy(epsa,epsa.length-1),'analysis:actual:eps')}${valCellI('Not explicit','—','analysis:ert:eps')}${valCellI(Number.isFinite(stE)?money(stE):'Unavailable',Number.isFinite(stE)?(stE/actE-1)*100:NaN,'analysis:street:eps')}${valCell('—','—')}<div><strong>Economic FCF after SBC</strong></div>${valCellI(bn(actEF),yy(D.years.map((_,i)=>economicFcf(i)),D.years.length-1),'analysis:actual:fcf')}${valCellI(bn(ertF),actEF?((ertF/actEF)-1)*100:NaN,'analysis:ert:fcf')}${valCell('Not provided','—')}${valCellI(marketF,marketFg,'analysis:market:fcf')}<div><strong>CapEx</strong></div>${valCellRatio(bn(Number(last(cap))),Number(last(cap))/r0*100,'analysis:actual:capex')}${valCellRatio(bn(b.detail[0].capex),b.detail[0].capMargin,'analysis:ert:capex')}${valCell('Not provided','—')}${valCellRatio(marketCap,comb.solved?comb.dcf.detail[0].capMargin:NaN,'analysis:market:capex')}</div><div class="actions" style="margin-top:9px"><button class="btn smallbtn" id="quarterToggle">${S.quarterOpen?'Hide':'Show'} quarterly Street estimates</button></div><div class="quarter-body ${S.quarterOpen?'open':''}" id="quarterBody">${quarterConsensusHtml()}</div><div class="sourcebox">Business Quant provides Revenue/EPS consensus in this integration. ERT does not invent Street FCF or CapEx estimates. Market-implied values are solver outputs under fixed WACC and terminal growth.</div></div><div class="grid two" style="margin-top:11px"><div class="card"><h3>Positive findings</h3>${row('Latest revenue growth',pct(yy(rev,rev.length-1)))}${row('ROIC proxy',pct(roic()))}${row('WACC',pct(wacc().w))}</div><div class="card"><h3>Risks & questions</h3>${row('Latest CapEx / Revenue',pct(Number(last(cap))/r0*100))}${row('FY2026 Base CapEx',bn(b.detail[0].capex),'Management-guidance anchored')}${row('Market outside ERT Bull?',Number(D.market.price)>valuationSummary().bull?'YES':'NO')}</div></div>`}
function roic(){const op=Number(last(by('income.op')[2])),equity=Number(last(by('balance.equity')[2])),debt=Number(last(by('balance.long_debt')[2])),cash=Number(last(by('balance.cash')[2])),mkt=Number(last(by('balance.market')[2])),ic=equity+debt-cash-mkt;return ic?op*(1-S.tax/100)/ic*100:NaN}

function dcfBridge(){const d=dcf10(S.scenario);return `<div class="card"><div class="forecast-head"><div><h3>10-Year DCF Calculation — ${S.scenario}</h3><div class="small">Single valuation source of truth. FY2026–30 detailed forecast + FY2031–35 normalisation + terminal value after FY2035.</div></div><div class="big clickable" data-fairvalue="${S.scenario}" data-inspect="valuation:${S.scenario}">${money(d.ps)}</div></div><div class="grid k3" style="margin-bottom:9px"><label class="sub">Risk-free %<input class="input" data-wa="rf" value="${S.rf.toFixed(2)}"></label><label class="sub">Beta<input class="input" data-wa="beta" value="${S.beta.toFixed(2)}"></label><label class="sub">ERP %<input class="input" data-wa="erp" value="${S.erp.toFixed(2)}"></label><label class="sub">Cost of debt %<input class="input" data-wa="cod" value="${S.cod.toFixed(2)}"></label><label class="sub">Tax %<input class="input" data-wa="tax" value="${S.tax.toFixed(1)}"></label><label class="sub">Terminal growth %<input class="input" data-wa="terminal" value="${S.terminal.toFixed(2)}"></label></div><div class="compact"><div><span class="sub">PV FY${d.detail[0].year}–FY${d.detail.at(-1).year} FCF</span><div class="v">${bn(d.pv)}</div></div><div><span class="sub">PV Terminal Value</span><div class="v">${bn(d.pvt)}</div></div><div><span class="sub">Enterprise Value</span><div class="v">${bn(d.ev)}</div></div><div><span class="sub">Net Cash</span><div class="v">${bn(D.market.net_cash_m)}</div></div><div><span class="sub">Equity Value</span><div class="v">${bn(d.equity)}</div></div><div><span class="sub">Diluted shares</span><div class="v">${fmt(D.market.shares_m,0)}m</div></div><div class="clickable" data-inspect="wacc"><span class="sub">WACC / Terminal g</span><div class="v">${pct(d.wacc)} / ${pct(d.terminal)}</div></div><div><span class="sub">Terminal value share</span><div class="v ${d.tvshare>75?'warn':''}">${pct(d.tvshare)}</div></div></div><div class="formula">PV Explicit FCF ${bn(d.pv)} + PV Te ta-inspect="capex:actual" class="clickable"><span class="sub">FY2025 actual CapEx</span><div class="v">${bn(Number(last(by('cashflow.capex')[2])))}</div></div><div data-inspect="capex:guide" class="clickable"><span class="sub">FY2026 guidance midpoint</span><div class="v">$180.0bn</div></div><div data-inspect="capex:incremental" class="clickable"><span class="sub">Incremental CapEx</span><div class="v">${bn(180000-Number(last(by('cashflow.capex')[2])))}</div></div><div><span class="sub">ROI / payback</span><div class="v">Not directly attributable</div></div></div><div class="sourcebox">FACT: FY2026 CapEx guidance range $175–185bn. CALCULATED: incremental CapEx vs FY2025. UNKNOWN: management has not promised a specific ROI or payback period for this incremental investment.</div></div></div>`}

m</button><button class="btn smallbtn" id="resetCustom">Reset Custom</button></div>`:''}${forecastTable()}${normalisationHtml()}<div class="sourcebox clickable" data-inspect="history:fcf">Historical FCF margin: 5Y average ${pct(avg(D.years.map((_,i)=>reportedFcf(i)/Number(by('income.revenue')[2][i])*100)))} · latest ${pct(reportedFcf()/Number(last(by('income.revenue')[2]))*100)}. Click for history.</div></div><div style="margin-top:11px">${dcfBridge()}</div><div style="margin-top:11px">${reverseHtml()}</div><div style="margin-top:11px">${crossChecksHtml()}</div>`}

function market(){const z=week52(),v=valuationSummary(),p=Number(D.market.price),s20=sma(D.prices,20),s50=sma(D.prices,50),s200=sma(D.prices,200),rr=rsi(D.prices,14);return `<h1>Market & Price Context</h1><div class="lead">Market price, 52-week range and technical context are separate from intrinsic value.</div><div class="grid k5"><div class="card clickable" data-inspect="market:price"><div class="sub">Current price</div><div class="value">${money(p)}</div><div class="small">${D.market.asof||'—'}</div></div><div class="card clickable" data-inspect="valuation:Base"><div class="sub">ERT Base FV</div><div class="value">${money(v.base)}</div><div class="${v.base>=p?'pos':'neg'}">${((v.base/p-1)*100).toFixed(1)}% vs current</div></div><div class="card clickable" data-inspect="market:52w"><div class="sub">52W Low / High</div><div class="value">${z?money(z.low)+' / '+money(z.high):'—'}</div><div class="small">Current range position</div></div><div class="card clickable" data-inspect="market:sma"><div class="sub">SMA20 / 50 / 200</div><div class="value" style="font-size:18px">${money(s20)} / ${money(s50)} / ${money(s200)}</div><div class="small">Trend context</div></div><div class="card clickable" data-inspect="market:rsi"><div class="sub">RSI (14)</div><div class="value">${Number.isFinite(rr)?rr.toFixed(1):'—'}</div><div class="small">Momentum, not valuation</div></div></div><div class="card" style="margin-top:11px"><h3>52-Week Range & ERT Fair Value</h3>${priceRangeBar()}</div><div class="card" style="margin-top:11px"><h3>1-Year Price History</h3>${priceChart()}</div>`}
function priceChart(){const p=(D.prices||[]).map(Number).filter(Number.isFinite);if(p.length<2)return '<div class="small">Price history unavailable.</div>';const W=1000,H=310,pad=45,mn=Math.min(...p),mx=Math.max(...p),x=i=>pad+i*(W-2*pad)/(p.length-1),y=v=>H-pad-(v-mn)/(mx-mn||1)*(H-2*pad),path=p.map((v,i)=>(i?'L':'M')+x(i)+','+y(v)).join(' '),fv=valuationSummary().base;return `<div class="pricechart"><svg viewBox="0 0 ${W} ${H}"><line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/><path class="priceLine" d="${path}"/><line class="fairLine" x1="${pad}" y1="${y(fv)}" x2="${W-pad}" y2="${y(fv)}"/><text x="${W-pad}" y="${y(fv)-6}" fill="#60d598" text-anchor="end" font-size="11">ERT Base ${money(fv)}</text></svg></div>`}

function report(){const v=valuationSummary();return `<div class="report"><h1>Alphabet Inc. (GOOG) — ERT Research Summary</h1><p><strong>ERT Base Fair Value:</strong> ${money(v.base)} · Bear ${money(v.bear)} · Bull ${money(v.bull)} · Current ${money(D.market.price)}</p><h2>Valuation method</h2><p>Primary method is a 10-Year Explicit DCF using FY2026–30 detailed drivers, FY2031–35 explicit normalisation and a terminal value after FY2035. Stock-based compensation is deducted from economic FCF.</p><h2>Main valuation uncertainty</h2><p>AI / infrastructure CapEx normalisation and the future cash return on that investment.</p><h2>Cross-checks</h2><p>Normalised FCF DCF, Forward Earnings and a discounted FY2030 EV/FCF check challenge the DCF but are not averaged into it.</p><h2>Disclaimer</h2><p>Research and education only. Not investment advice.</p></div>`}

function inspectorHtml(key=S.selected){const dcfScenario=k=>{const name=k.split(':')[1]||'Base',d=dcf10(name);return `<h3>${name} 10-Year DCF — ${money(d.ps)}</h3><div class="trace fact"><b>MODEL STRUCTURE</b><br>FY${d.detail[0].year}–FY${d.detail[4].year}: detailed forecast<br>FY${d.detail[5].year}–FY${d.detail[9].year}: explicit normalisation<br>Terminal value begins after FY${d.detail[9].year}</div><div class="trace calc"><b>CALCULATED</b><br>PV explicit FCF ${bn(d.pv)}<br>PV terminal ${bn(d.pvt)}<br>Enterprise value ${bn(d.ev)}<br>+ Net cash ${bn(D.market.net_cash_m)}<br>= Equity value ${bn(d.equity)}<br>÷ ${fmt(D.market.shares_m,0)}m shares<br>= <strong>${money(d.ps)}/share</strong></div><div class="trace assumption"><b>ASSUMPTIONS</b><br>WACC ${pct(d.wacc)} · Terminal growth ${pct(d.terminal)} · SBC deducted from economic FCF.</div>`};if(String(key).startsWith('valuation:'))return dcfScenario(String(key));if(String(key).startsWith('dcfyear:')){const y=Number(String(key).split(':')[1]),x=dcf10(S.scenario).detail.find(z=>z.year===y)||dcf10('Base').detail.find(z=>z.year===y);return `<h3>FY${y} Economic FCF</h3><div class="trace calc"><b>CALCULATED</b><br>Revenue ${bn(x.revenue)} × OCF margin ${pct(x.ocfMargin)} = OCF ${bn(x.ocf)}<br>− CapEx ${bn(x.capex)} (${pct(x.capMargin)} of Revenue)<br>− SBC ${bn(x.sbc)} (${pct(x.sbcMargin)} of Revenue)<br>= Economic FCF ${bn(x.fcf)}</div><div class="formula">PV = ${fmt(x.fcf,0)} × ${x.df.toFixed(4)} = ${fmt(x.pvFcf,0)} USD m</div>`}if(key==='wacc')return `<h3>WACC — ${pct(wacc().w)}</h3><div class="trace assumption"><b>ASSUMPTION INPUTS</b><br>Risk-free ${pct(S.rf)} · Beta ${S.beta.toFixed(2)} · ERP ${pct(S.erp)} · Pre-tax debt cost ${pct(S.cod)} · Tax ${pct(S.tax)}</div><div class="formula">Cost of equity = Rf + Beta × ERP = ${pct(wacc().coe)}<br>WACC = Equity weight × CoE + Debt weight × after-tax CoD</div>`;if(String(key).startsWith('driver:')){const k=String(key).split(':')[1],map={revenue:['Revenue growth','Forecast Revenueₜ = Revenueₜ₋₁ × (1 + growthₜ)','STREET-ANCHORED / ERT ASSUMPTION'],ocf:['OCF margin','OCF = Revenue × OCF margin','ERT ASSUMPTION'],capex:['CapEx / Revenue','CapEx = Revenue × CapEx intensity','FY2026 MANAGEMENT GUIDANCE; later years ERT ASSUMPTION'],sbc:['SBC / Revenue','SBC = Revenue × SBC intensity','SEC historical anchor + ERT ASSUMPTION']};const m=map[k];return `<h3>${m[0]}</h3><div class="trace assumption"><b>${m[2]}</b></div><div class="formula">${m[1]}</div>`}if(String(key).startsWith('market:price'))return `<h3>Current Market Price</h3><div class="trace fact"><b>MARKET FACT</b><br>${money(D.market.price)} as of ${D.market.asof||'—'}</div>`;if(String(key).startsWith('flow:'))return `<h3>${String(key).slice(5)}</h3><div class="trace fact"><b>LIVE EARNINGS FLOW</b><br>Source-labelled in the Overview flow section. Segment values may come from Business Quant; consolidated values come from SEC.</div>`;if(String(key).startsWith('reverse:')){const c=reverseCombined(),rg=reverseSolve('revenue'),om=reverseSolve('ocf'),cx=reverseSolve('capex');return `<h3>Reverse DCF / Market-implied expectations</h3><div class="trace implied"><b>MARKET-IMPLIED — NOT MANAGEMENT GUIDANCE</b><br>ERT holds WACC ${pct(wacc().w)} and terminal growth ${pct(S.terminal)} fixed, then asks what operating assumptions would be required to reconcile the current market price.</div><div class="trace calc"><b>ONE-DRIVER STRESS TESTS</b><br>Revenue-only: ${rg.solved?'+'+rg.required.toFixed(1)+'ppt growth':'not solved'}<br>OCF-margin-only: ${om.solved?'+'+om.required.toFixed(1)+'ppt':'not solved'}<br>CapEx-only: ${cx.solved?'-'+cx.required.toFixed(1)+'ppt':'not solved'}<br>Balanced Base→Bull solver: ${c.solved?c.q.toFixed(2)+'× the Base→Bull improvement':'not solved within test range'}.</div><div class="sourcebox">The balanced solver is an ERT diagnostic assumption. It answers “what would have to be true?” rather than forecasting what will happen.</div>`}if(String(key).startsWith('cross:')){const k=String(key).split(':')[1],z=k==='norm'?normalizedCheck():k==='pe'?forwardEarningsCheck():evFcfCheck();return `<h3>Independent valuation cross-check</h3><div class="trace calc"><b>CALCULATED</b><br>${Number.isFinite(z.ps)?money(z.ps)+'/share':z.reason||'Unavailable'}</div><div class="trace assumption"><b>ROLE</b><br>This is a cross-check only. It does not receive a weight and is not averaged into ERT Base Fair Value.</div>`}if(String(key).startsWith('analysis:street:'))return `<h3>Street consensus — Business Quant</h3><div class="trace fact"><b>STREET ESTIMATE</b><br>Source: ${D.consensus.displaySource||'Business Quant Analyst Estimates API'}<br>As of ${D.consensus.asof||'—'}</div><div class="sourcebox">Displayed growth is calculated from the displayed Street forecast amount versus the comparable latest annual actual. Amount and % must reconcile.</div>`;if(String(key).startsWith('analysis:market:'))return inspectorHtml('reverse:combined');if(String(key).startsWith('analysis:ert:'))return `<h3>ERT Base expectation</h3><div class="trace assumption"><b>ERT ASSUMPTION / CALCULATED</b><br>Generated by the same Base forecast engine used by the 10-Year DCF.</div>`;if(String(key).startsWith('analysis:actual:'))return `<h3>Latest actual</h3><div class="trace fact"><b>SEC FACT</b><br>Latest complete fiscal-year data in the ERT live dataset.</div>`;if(key==='capex:actual')return `<h3>FY2025 actual CapEx</h3><div class="trace fact"><b>SEC FACT</b><br>${bn(Number(last(by('cashflow.capex')[2])))}</div>`;if(key==='capex:guide')return `<h3>FY2026 CapEx guidance</h3><div class="trace fact"><b>MANAGEMENT GUIDANCE</b><br>$175–185bn range; ERT Base uses $180bn midpoint.</div>`;if(key==='capex:incremental')return `<h3>Incremental FY2026 CapEx</h3><div class="trace calc"><b>CALCULATED</b><br>$180.0bn Base FY2026 CapEx − ${bn(Number(last(by('cashflow.capex')[2])))} FY2025 actual = ${bn(180000-Number(last(by('cashflow.capex')[2])))}</div>`;if(key==='history:fcf'){const r=by('income.revenue')[2];return `<h3>Historical Reported FCF Margin</h3><div class="trace fact"><b>SEC FACTS</b><br>${D.years.map((y,i)=>`FY${y}: ${pct(reportedFcf(i)/Number(r[i])*100)}`).join('<br>')}</div><div class="sourcebox">Reported FCF = OCF − CapEx. The DCF's economic FCF additionally deducts SBC.</div>`}if(key==='market:52w')return `<h3>52-Week Range</h3><div class="trace fact"><b>MARKET FACT</b><br>Low ${money(week52()?.low)} · High ${money(week52()?.high)}</div>`;if(key==='market:sma')return `<h3>Moving averages</h3><div class="trace calc"><b>CALCULATED FROM PRICE HISTORY</b><br>SMA20 ${money(sma(D.prices,20))}<br>SMA50 ${money(sma(D.prices,50))}<br>SMA200 ${money(sma(D.prices,200))}</div>`;if(key==='market:rsi')return `<h3>RSI (14)</h3><div class="trace calc"><b>CALCULATED FROM PRICE HISTORY</b><br>${Number.isFinite(rsi(D.prices,14))?rsi(D.prices,14).toFixed(1):'Unavailable'}</div><div class="sourcebox">Momentum context only; RSI is not an intrinsic-value input.</div>`;const r=by(key)||by('income.revenue'),i=D.years.length-1;return `<h3>${r[1]}</h3><div class="trace fact"><b>SEC FACT</b><br>FY${D.years[i]}: ${fmt(r[2][i],2)}</div>${row('Latest YoY',pct(yy(r[2],i)))}${row('Source',D.source?.form||'SEC filing')}`}
function renderInspector(){const ins=$('#inspector'),work=$('#work');if(!S.showInspector){work.classList.add('inspector-hidden');if(!$('#restoreInspector')){const b=document.createElement('button');b.id='restoreInspector';b.className='btn restore';b.textContent='Evidence / Analysis';document.body.appendChild(b)}return}work.classList.remove('inspector-hidden');$('#restoreInspector')?.remove();ins.innerHTML=`<div class="ins-head"><strong>Evidence & Analysis Inspector</strong><div class="sp"></div><button class="btn smallbtn" id="hideInspector">Hide</button></div><div class="ins-body">${inspectorHtml()}</div>`}

document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){S.page=page.dataset.page;renderPage(true);return}const rowEl=e.target.closest('[data-row]');if(rowEl){setSelected(rowEl.dataset.row);return}const insp=e.target.closest('[data-inspect]');if(insp){setSelected(insp.dataset.inspect);return}const st=e.target.closest('[data-statement]');if(st){S.statement=st.dataset.statement;renderPage(false);return}const sc=e.target.closest('[data-scenario]');if(sc){S.scenario=sc.dataset.scenario;if(S.scenario==='Custom')ensureCustom();renderValuationComponent();return}const cp=e.target.closest('[data-copy]');if(cp){copyCustom(cp.dataset.copy);return}if(e.target.id==='hideInspector'){S.showInspector=false;renderInspector();return}if(e.target.id==='restoreInspector'){S.showInspector=true;renderInspector();return}if(e.target.id==='normToggle'){S.normOpen=!S.normOpen;$('#normalBody')?.classList.toggle('open',S.normOpen);e.target.textContent=(S.normOpen?'Hide':'Show')+' FY31–35 normalisation';return}if(e.target.id==='normMode'){if(!S.normManual){initCustomNorm();S.normManual=true}else{S.normManual=false}renderValuationComponent();return}if(e.target.id==='resetCustom'){S.custom=structuredClone(baseFive());S.customNormTarget=structuredClone(longTargets('Base'));S.customNorm=null;S.normManual=false;S.scenario='Custom';renderValuationComponent();return}if(e.target.id==='yearlyPvToggle'){S.yearlyPvOpen=!S.yearlyPvOpen;$('#yearlyPvBody')?.classList.toggle('open',S.yearlyPvOpen);e.target.textContent=(S.yearlyPvOpen?'Hide':'Show')+' yearly discounted FCF';return}if(e.target.id==='aiToggle'){S.aiOpen=!S.aiOpen;$('#aiBody')?.classList.toggle('open',S.aiOpen);e.target.textContent=(S.aiOpen?'Hide':'Show')+' details';return}if(e.target.id==='quarterToggle'){S.quarterOpen=!S.quarterOpen;$('#quarterBody')?.classList.toggle('open',S.quarterOpen);e.target.textContent=(S.quarterOpen?'Hide':'Show')+' quarterly Street estimates';return}if(e.target.id==='saveNotes'){try{localStorage.setItem('ertNotes42',$('#notes').value);e.target.textContent='Saved'}catch(_e){}return}if(e.target.id==='refreshLive'){refreshLive(true);return}},true);
document.addEventListener('keydown',e=>{const el=e.target.closest('[data-driver],[data-norm],[data-wa]');if(!el)return;if(e.key==='Enter'){e.preventDefault();el.blur()}if(e.key==='Escape'){e.preventDefault();el.value=el.dataset.start??el.value;el.blur()}},true);

function mapAnnual(s){const A=s?.annual;if(!s?.validation?.ok||!Array.isArray(A?.years)||A.years.length<5)return;const years=A.years.slice(-5).map(Number);D.years=years;const maps={};for(const [k,a] of Object.entries(A))if(Array.isArray(a))maps[k]=Object.fromEntries(a.map(x=>[Number(x.year),x.value]));const specs={income:{'income.revenue':'revenue','income.cost':'cost','income.rnd':'rnd','income.sales':'sales','income.gna':'gna','income.op':'op','income.pretax':'pretax','income.tax':'tax','income.net':'net','income.eps':'eps','income.shares':'diluted_shares'},cashflow:{'cashflow.net':'net','cashflow.ocf':'ocf','cashflow.capex':'capex','cashflow.sbc':'sbc'},balance:{'balance.cash':'cash','balance.market':'marketable','balance.long_debt':'debt','balance.equity':'equity','balance.assets':'assets'}};for(const group of ['income','cashflow','balance'])for(const r of D[group]){const k=specs[group][r[0]];if(k&&maps[k])r[2]=years.map(y=>maps[k][y]??null)}if(s.shares_m!=null)D.market.shares_m=s.shares_m;if(s.net_cash_m!=null)D.market.net_cash_m=s.net_cash_m;if(s.latest_10k){D.source.form='10-K';D.source.fy=s.latest_10k.year;D.source.filingDate=s.latest_10k.filed;D.source.filing=s.latest_10k.url}S.custom=null;S.customNormTarget=null}

function applyLive(d){D.live=d;const m=d.market||{},s=d.sec||{},c=d.consensus||{};if(m.price!=null)D.market.price=m.price;if(m.asof)D.market.asof=m.asof;if(m.previous_close!=null)D.market.previous_close=m.previous_close;if(m.day_change!=null)D.market.day_change=m.day_change;if(m.day_change_pct!=null)D.market.day_change_pct=m.day_change_pct;if(m.week52)D.market.week52=m.week52;if(Array.isArray(m.history)&&m.history.length){D.dates=m.history.map(x=>x.date);D.prices=m.history.map(x=>Number(x.close))}mapAnnual(s);applyConsensus(c);if(d.treasury?.ten_year!=null)S.rf=Number(d.treasury.ten_year);if(d.erp?.value!=null)S.erp=Number(d.erp.value);S.liveLoaded=true}
async function refreshLive(force=false){const b=$('#refreshLive');if(b){b.disabled=true;b.textContent='Refreshing…'}$('#liveStatus').textContent='GOOG · loading live data…';try{const r=await fetch(API+'/api/all?ticker=GOOG&_='+Date.now(),{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'API error');applyLive(j);if(!j.consensus?.available){try{const cr=await fetch(API+'/api/consensus?ticker=GOOG&_='+Date.now(),{cache:'no-store'}),cj=await cr.json();if(cr.ok&&cj.ok&&cj.consensus?.available)applyConsensus(cj.consensus)}catch(_e){}}try{const e=await fetch(API+'/api/earnings-flow?ticker=GOOG&_='+Date.now(),{cache:'no-store'}),ej=await e.json();if(e.ok&&ej.ok)D.earningsFlow=ej.earnings_flow}catch(_e){}$('#liveStatus').textContent='GOOG · LIVE · '+(j.generated_at||D.market.asof||'');renderPage(false)}catch(err){console.error(err);$('#liveStatus').textContent='GOOG · LIVE REFRESH FAILED · using retained data'}finally{if(b){b.disabled=false;b.textContent='↻ Live Data'}}}
