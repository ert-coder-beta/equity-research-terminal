function research(){let n=localStorage.getItem('ert-notes')||'';return `<div class="page active"><h1>Research Notes</h1><p class="lead">Investment thesis, risks, catalysts and open questions.</p><div class="card"><textarea id="notes" placeholder="Write notes...">${n}</textarea><div class="actions"><button class="btn primary" id="save">Save notes</button></div></div></div>`}
function report(){return `<div id="report" class="page active"><div class="actions no-print" style="margin-bottom:10px"><button class="btn primary" onclick="window.print()">Print / Save as PDF</button></div><div class="report"><h1>Alphabet Inc. (GOOG)</h1><p>Equity Research Report — Test Build</p><h2>Executive Summary</h2><p>This report is generated from the terminal's fixed test dataset to test workflow and presentation.</p><h2>Key Metrics</h2><table><tbody><tr><td>Current price</td><td>${money(D.market.price)}</td></tr><tr><td>Base DCF</td><td>${money(dcf())}</td></tr><tr><td>Reverse DCF growth</td><td>${pct(rev())}</td></tr><tr><td>P/E</td><td>${pe().toFixed(1)}x</td></tr><tr><td>ROIC</td><td>${pct(roic())}</td></tr><tr><td>Reported FCF</td><td>${fmt(fcf())}m</td></tr></tbody></table><h2>Disclaimer</h2><p>For research and educational reference only. This is not investment advice. Users must independently verify all data and conduct their own due diligence.</p></div></div>`}
function disclaimer(){return `<div class="page active"><h1>Disclaimer</h1><div class="card"><p>This research terminal supports investment research and education.</p><p>All data, ratios, forecasts, technical indicators and valuations are provided for reference only. No warranty is given regarding completeness, accuracy or suitability for any investment decision.</p><p>Users should independently verify all data and conduct their own due diligence. This software assists verification; it does not replace independent judgement.</p><p>The author accepts no liability for losses arising from use of this software.</p></div></div>`}
function inspector(){if(!S.ins)return `<aside class="ins hide"></aside>`;let r=row(S.sel)||row('income.revenue'),pg=r[0].startsWith('income')?D.source.pages.income:r[0].startsWith('balance')?D.source.pages.balance:D.source.pages.cashflow,u=D.source.pdf+'#page='+pg,used=r[0]==='income.revenue'?['Revenue growth','Operating margin','Net margin','EV/Sales','DCF']:r[0]==='cashflow.ocf'?['Reported FCF','SBC-adjusted FCF','Owner Earnings','DCF']:['Financial statements','Research report'];return `<aside class="ins"><div class="ih"><strong>Evidence Inspector</strong><div class="sp"></div><button class="btn" id="hide">Hide</button></div><div class="ib"><div class="meta"><div><span>Internal cell ID</span><strong>${r[0]}.FY2024</strong></div><div><span>Type</span><strong>Fact</strong></div><div><span>Line item</span><strong>${r[1]}</strong></div><div><span>Displayed value</span><strong>${fmt(L(r[2]),2)}</strong></div><div><span>Form</span><strong>${D.source.form} FY${D.source.fy}</strong></div><div><span>Report page</span><strong>${pg}</strong></div><div><span>Filing date</span><strong>${D.source.date}</strong></div><div><span>Accession</span><strong>${D.source.accession}</strong></div></div><div class="actions"><a class="btn primary" href="${D.source.filing}" target="_blank">Open filing</a><a class="btn" href="${u}" target="_blank">Open report page</a></div><h3>Used in</h3>${list(used.map(x=>[x,'']))}<div class="formula">Verification: PASS<br>Source mapped: YES<br>Page mapped: YES<br>Unit review: TEST DATA<br>Manual verification: PENDING</div></div></aside>`}
function layout(c){let nav=[['overview','Overview'],['financials','Financials'],['analysis','Analysis'],['capital','Capital Allocation'],['valuation','Valuation'],['technical','Technical'],['research','Research'],['report','Report'],['disclaimer','Disclaimer']];return `<div class="top"><div><div class="brand">Equity Research Terminal</div><div class="tag">Every number traceable. Every valuation explainable.</div></div><div class="sp"></div><div class="st">GOOG · Full Feature Test Build</div></div><div class="shell"><aside class="side">${nav.map(x=>`<button data-page="${x[0]}" class="${S.page===x[0]?'active':''}">${x[1]}</button>`).join('')}</aside><main class="main"><div class="work" id="work"><section class="content">${c}</section><div class="resize" id="resize"></div>${inspector()}</div><div class="foot">For research and educational reference only. Not investment advice.</div></main></div>`}
function render(){let pages={overview,financials,analysis,capital,valuation,technical,research,report,disclaimer};app.innerHTML=layout(pages[S.page]());bind()}function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{S.page=b.dataset.page;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.stmt=b.dataset.tab;S.sel=D[S.stmt][0][0];render()});document.querySelectorAll('[data-row]').forEach(r=>r.onclick=()=>{S.sel=r.dataset.row;S.ins=true;render()});$('hide')?.addEventListener('click',()=>{S.ins=false;render()});$('basis')?.addEventListener('change',e=>{S.basis=e.target.value;render()});$('save')?.addEventListener('click',()=>{localStorage.setItem('ert-notes',$('notes').value);$('save').textContent='Saved'});let z=$('resize'),w=$('work'),drag=false;if(z&&w){z.onmousedown=()=>drag=true;window.onmouseup=()=>drag=false;window.onmousemove=e=>{if(!drag)return;let r=w.getBoundingClientRect(),right=Math.max(300,Math.min(650,r.right-e.clientX));w.style.gridTemplateColumns=`minmax(500px,1fr) 6px ${right}px`};z.ondblclick=()=>w.style.gridTemplateColumns='minmax(500px,1fr) 6px 410px'}}render();
</script></body></html>
