function ratingLine(a,n,meaning){let tone=a==='Valuation'?'tone-neg':a==='Risk'?'tone-watch':'tone-pos';let why=a.startsWith('Moat')?'ROIC spread + brand/network strength':a==='Business quality'?'32.1% operating margin · strong cash generation':a==='Growth'?'Revenue +13.9% · 5Y CAGR 17.7%':a==='Financial health'?'Net cash balance · low debt weight':a==='Capital allocation'?'Buybacks + reinvestment; CapEx needs monitoring':a==='Valuation'?'Price above base DCF · high implied growth':'Moderate: regulation, AI competition, CapEx';return `<div class="ratingRow clickable" data-inspect="rating:${a}"><span>${a}<span class="metricDesc">${why}</span></span><span class="stars ${tone}">${star(n)}</span><strong class="${tone}">${n.toFixed(1)}</strong></div>`}
function list(a){return `<div>${a.map(x=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div>`}
function histTable(mults){return `<div class="tw" style="max-height:none"><table style="min-width:960px"><thead><tr><th>Metric</th><th>Current</th><th>5Y average</th><th>5Y median</th><th>5Y valuation range</th><th>vs average</th><th>Plain-English meaning</th></tr></thead><tbody>${mults.map(([m,cur,a])=>{let av=avg(a),lo=Math.min(...a),hi=Math.max(...a),pos=(cur-lo)/(hi-lo||1)*100,avpos=(av-lo)/(hi-lo||1)*100,d=(cur/av-1)*100,tone=d<-5?'tone-pos':d>5?'tone-neg':'tone-watch',interpret=d<-15?'Cheaper than usual':d<-5?'Slightly cheaper':d>15?'Expensive vs history':d>5?'Slightly expensive':'Near historical average';return `<tr class="row clickable" data-inspect="multiple:${m}"><td><strong>${m}</strong><span class="metricDesc">${descr[m]}</span></td><td class="${tone}">${cur.toFixed(2)}x</td><td>${av.toFixed(2)}x</td><td>${med(a).toFixed(2)}x</td><td class="range"><div style="display:flex;justify-content:space-between"><span>${lo.toFixed(1)}x LOW</span><span>HIGH ${hi.toFixed(1)}x</span></div><div class="track"><i style="left:${Math.max(0,Math.min(100,pos))}%"></i><b title="5Y average" style="position:absolute;left:${avpos}%;top:-3px;height:12px;border-left:2px solid var(--amber)"></b></div><span class="metricDesc">● Current · amber marker = 5Y average</span></td><td class="${tone}">${d>=0?'+':''}${d.toFixed(0)}%</td><td class="${tone}">${interpret}</td></tr>`}).join('')}</tbody></table></div>`}

function financials(){let R=D[S.st];if(!R.find(x=>x[0]===S.sel))S.sel=R[0][0];return `<h1>Financial Statements</h1><div class="lead">Every year, every YoY change, 5Y CAGR and click-through context.</div><div class="tabs">${[['income','Income Statement'],['balance','Balance Sheet'],['cashflow','Cash Flow']].map(x=>`<button data-tab="${x[0]}" class="${S.st===x[0]?'active':''}">${x[1]}</button>`).join('')}</div><div class="tw"><table><thead><tr><th>Line item</th>${D.years.map((y,i)=>`<th>${y}</th>${i?'<th>YoY</th>':''}`).join('')}<th>5Y CAGR</th></tr></thead><tbody>${R.map(r=>`<tr class="row ${S.sel===r[0]?'sel':''}" data-row="${r[0]}"><td>${r[1]}</td>${r[2].map((v,i)=>`<td>${fmt(v,2)}</td>${i?`<td class="${yy(r[2],i)>=0?'pos':'neg'}">${yy(r[2],i)==null?'—':pct(yy(r[2],i))}</td>`:''}`).join('')}<td>${isFinite(cagr(r[2]))?pct(cagr(r[2])):'—'}</td></tr>`).join('')}</tbody></table></div>`}

function analysis(){
 let rev=by('income.revenue')[2],cap=by('cashflow.capex')[2],rec=by('balance.receivables')[2];
 return `<h1>Analysis</h1><div class="lead">What changed, why it matters, how it affects valuation — plus consensus and upcoming catalysts.</div>
 <div class="snap">${snap('Growth','STRONG','good','status:growth')}${snap('Margins','IMPROVING','good','status:margins')}${snap('ROIC','EXCELLENT','good','roic')}${snap('FCF quality','MIXED','watch','status:fcf')}${snap('CapEx','WATCH','watch','cashflow.capex')}${snap('Consensus','ABOVE OUR BASE','purple','status:consensus')}${snap('Valuation','HIGH EXPECTATIONS','bad','status:valuation')}</div>
 <div class="grid two"><div class="card"><h3 class="pos">Positive findings</h3><div class="finding find-pos"><h4>Revenue growth improved</h4><p>Growth rose from ${pct(yy(rev,3))} to ${pct(yy(rev,4))}. Higher sales support higher future FCF.</p></div><div class="finding find-pos"><h4>Operating margin expanded</h4><p>Margin reached ${pct(opm())}. More revenue is becoming operating profit.</p></div><div class="finding find-pos" data-inspect="roic"><h4>ROIC is strong</h4><p>${pct(roic())} vs WACC ${pct(wacc().w)}. Strong value-creation spread.</p></div></div>
 <div class="card"><h3 class="warn">Risks and questions</h3><div class="finding find-risk" data-row="cashflow.capex"><h4>CapEx jumped</h4><p>CapEx increased ${pct(yy(cap,4))}. It may support AI growth but weighs on near-term FCF.</p></div><div class="finding find-risk"><h4>FCF lagged earnings</h4><p>Net income grew faster than FCF because capital spending increased materially.</p></div><div class="finding find-risk" data-row="balance.receivables"><h4>Receivables need monitoring</h4><p>Receivables grew ${pct(yy(rec,4))}; compare with revenue growth to monitor collection quality.</p></div></div></div>
 <div class="card" style="margin-top:12px"><h3>ERT vs Analyst Consensus vs Market-implied expectations</h3><div class="compare head"><span>Metric</span><span>Actual</span><span>ERT base</span><span>Consensus</span><span>Market implied</span></div>${cmp('Revenue growth',pct(yy(rev,4)),'11.2%',pct(D.consensus.revenueGrowth),'—')}${cmp('EPS growth',pct(yy(by('income.eps')[2],4)),'13.8%',pct(D.consensus.epsGrowth),'—')}${cmp('FCF growth',pct(yy(D.years.map((_,i)=>reportedFcf(i)),4)),pct(fiveYCagrForecast()),pct(D.consensus.fcfGrowth),pct(reverse()))}${cmp('Operating margin',pct(opm()),'32.5%',pct(D.consensus.opMargin),'—')}${cmp('CapEx',fmt(last(cap))+'m','54,000m',fmt(D.consensus.capex_m)+'m','—')}<div class="finding find-risk" style="margin-top:10px"><h4>Expectation gap</h4><p>Current price implies FCF growth of ${pct(reverse())}, above the demo consensus ${pct(D.consensus.fcfGrowth)} and ERT base ${pct(fiveYCagrForecast())}. The market is pricing in a more demanding outcome.</p></div><div class="sourcebox"><strong>Consensus source:</strong> ${D.consensus.displaySource} · ${D.consensus.analysts} analysts · as of ${D.consensus.asof}. <br>${D.consensus.productionPlan}</div></div>
 <div class="grid two" style="margin-top:12px"><div class="card"><h3>Analyst consensus snapshot <span class="badge purple">${D.consensus.status}</span></h3>${list([['Rating',D.consensus.rating],['Buy / Hold / Sell',`${D.consensus.buy} / ${D.consensus.hold} / ${D.consensus.sell}`],['Target low',money(D.consensus.targetLow)],['Target median',money(D.consensus.targetMedian)],['Target mean',money(D.consensus.targetMean)],['Target high',money(D.consensus.targetHigh)],['30d estimate revision','+'+D.consensus.revision30+'%'],['90d estimate revision','+'+D.consensus.revision90+'%']])}</div>
 <div class="card"><h3>Upcoming catalysts & key dates</h3>${D.events.map(e=>`<div class="event"><div class="eventTop"><strong>${e.date} · ${e.title}</strong><span class="impact">${e.impact}</span></div><div class="small">${e.status}</div><p style="margin-bottom:5px">${e.watch}</p><div class="metricDesc">Source: ${e.source}</div></div>`).join('')}</div></div>`;
}
function snap(a,b,c,id=''){return `<div class="clickable" data-inspect="${id}"><span class="sub">${a}</span><b class="${c}">${b}</b></div>`}function cmp(a,b,c,d,e){return `<div class="compare"><span>${a}</span><strong>${b}</strong><strong>${c}</strong><strong class="purple">${d}</strong><strong class="warn">${e}</strong></div>`}

function valuation(){
 let W=wacc(),R=dcf(),mos=(R.ps/D.market.price-1)*100,fcfm=fcfMargins(),termRange=[1.5,2,2.5,3,3.5];
 return `<h1>Valuation Studio</h1><div class="lead">Every assumption is editable. Click any label/value for definition, benchmark, source and valuation impact.</div>
 <div class="grid two"><div class="card"><h3 class="clickable" data-inspect="wacc">WACC <span class="value tone-model">${pct(W.w)}</span></h3><div class="small">Weighted average cost of capital — the discount rate used to convert future cash flows into today's value.</div><div class="formgrid">
 ${waInput('Risk-free rate (%)','rf',S.rf,'wacc:rf')}${waInput('Beta','beta',S.beta,'wacc:beta')}${waInput('Equity risk premium (%)','erp',S.erp,'wacc:erp')}${waInput('Pre-tax cost of debt (%)','cod',S.cod,'wacc:debt')}${waInput('Tax rate (%)','tax',S.tax,'wacc:tax')}<label class="clickable" data-inspect="wacc:weights">Equity / debt weights<input value="${(W.ew*100).toFixed(2)}% / ${(W.dw*100).toFixed(2)}%" disabled></label></div>
 <div class="formula clickable" data-inspect="wacc">Cost of equity = ${pct(S.rf)} + ${S.beta.toFixed(2)} × ${pct(S.erp)} = ${pct(W.coe)}<br>After-tax cost of debt = ${pct(S.cod)} × (1-${pct(S.tax)}) = ${pct(W.after)}<br>Equity weight ${(W.ew*100).toFixed(2)}% · Debt weight ${(W.dw*100).toFixed(2)}%<br><strong>WACC = ${pct(W.w)}</strong></div></div>
 <div class="card"><h3>Terminal growth assumption</h3><label class="sub clickable" data-inspect="terminal">Selected long-run growth (%)<input id="terminal" value="${S.terminal}" style="width:100%;margin-top:5px;background:#0a121b;color:#fff;border:1px solid var(--line);padding:10px;border-radius:7px"></label><div class="value tone-model clickable" data-inspect="terminal">${pct(S.terminal)}</div><div class="small">Growth after the explicit 5-year forecast. Editable independently from WACC.</div>${list([['Conservative reference','2.0%'],['Base reference','2.5%'],['Optimistic reference','3.0%'],['WACC − g spread',pct(W.w-S.terminal)],['Terminal value share of PV',pct(R.tvshare)]])}<div class="finding ${R.tvshare>70?'find-risk':'find-pos'} clickable" data-inspect="terminal"><h4>Model dependency: ${R.tvshare>70?'HIGH':'MODERATE'}</h4><p>${pct(R.tvshare)} of present value comes from terminal value, so small WACC/g changes can materially move fair value.</p></div></div></div>
 <div class="grid two" style="margin-top:12px"><div class="card"><h3>How should FCF be forecast?</h3><label class="sub">FCF basis<select id="basis" style="width:100%;margin-top:5px;background:#0a121b;color:#fff;border:1px solid var(--line);padding:8px;border-radius:7px"><option value="reported" ${S.basis==='reported'?'selected':''}>Reported FCF — ${fmt(reportedFcf())}m</option><option value="sbc" ${S.basis==='sbc'?'selected':''}>SBC-adjusted FCF — ${fmt(reportedFcf()-last(by('cashflow.sbc')[2]))}m</option><option value="owner" ${S.basis==='owner'?'selected':''}>Owner Earnings — editable maintenance CapEx</option><option value="margin" ${S.basis==='margin'?'selected':''}>5Y average FCF margin — ${pct(avg(fcfm))}</option></select></label>
 ${S.basis==='margin'?`<div class="formula clickable" data-inspect="fcfmargin">${D.years.map((y,i)=>`${y}: ${pct(fcfm[i])}`).join('<br>')}<br><strong>5Y average = ${pct(avg(fcfm))}</strong><br>Median = ${pct(med(fcfm))}</div>`:''}${S.basis==='owner'?`<label class="sub">Maintenance CapEx (% of total)<input id="maint" value="${S.maint}" style="width:100%;margin-top:5px;background:#0a121b;color:#fff;border:1px solid var(--line);padding:8px;border-radius:7px"></label>`:''}<h3 style="margin-top:12px">Year-by-year FCF growth assumptions</h3><div class="formgrid">${S.g.map((g,i)=>`<label class="clickable" data-inspect="growth:${i}">Year ${i+1} (%)<input data-g="${i}" value="${g}"></label>`).join('')}</div></div>
 <div class="card"><h3>Result <span class="badge">${D.market.model_asof}</span></h3><div class="clickable" data-inspect="dcfresult">${list([['Equity value',fmt(R.equity)+' USD million'],['Shares outstanding',fmt(D.market.shares_m)+' million shares'],['Intrinsic value',money(R.ps)+' / share'],['Current price',money(D.market.price)+' / share'],['Margin of safety',pct(mos)]])}</div><div class="sourcebox"><strong>Data dates:</strong><br>Price: ${D.market.asof}<br>Shares / financial facts: FY2024 filing ${D.source.filingDate}<br>Model recalculated: ${D.market.model_asof}</div></div></div>
 <div class="card" style="margin-top:12px"><h3>Sensitivity — WACC × terminal growth (USD/share)</h3>${sensitivity(termRange)}</div>`;
}
function waInput(label,key,val,id){return `<label class="clickable" data-inspect="${id}">${label}<input data-wa="${key}" value="${val}"></label>`}
function sensitivity(ts){let ws=[7.5,8,8.5,9,9.5,10],best=null,bd=1e9;ws.forEach(w=>ts.forEach(t=>{let v=dcf(S.g,w,t).ps,d=Math.abs(v-D.market.price);if(d<bd){bd=d;best=[w,t]}}));return `<div class="tw" style="max-height:none"><table style="min-width:700px"><thead><tr><th>WACC \ g</th>${ts.map(t=>`<th>${t}%</th>`).join('')}</tr></thead><tbody>${ws.map(w=>`<tr><td>${w}%</td>${ts.map(t=>{let v=dcf(S.g,w,t).ps,b=best[0]===w&&best[1]===t;return `<td style="${b?'outline:2px solid var(--amber);background:#28220c':''}">${money(v)}${b?'<span class="metricDesc">Closest to current price</span>':''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}

function market(){
 let ps=D.prices,dates=D.dates,s20s=smaSeries(ps,20),s50s=smaSeries(ps,50),s200s=smaSeries(ps,200),rsis=rsiSeries(ps),fv=dcf().ps;
 let s20=sma(ps,20),s50=sma(ps,50),s200=sma(ps,200),rs=rsi(ps),trend=D.market.price>s20&&s20>s50&&s50>s200?'Bullish alignment':'Mixed';
 return `<h1>Market & Price Context</h1><div class="lead">Price trend, fair value, moving averages and momentum — translated into plain English.</div>
 <div class="grid k4">${card('Current price',money(D.market.price),'Market close · '+D.market.asof)}${card('Fair value',money(fv),'Base DCF · '+D.market.model_asof,D.market.price>fv?'neg':'pos')}${card('RSI (14)',rs.toFixed(1),rs>70?'Momentum · near overbought':rs<30?'Momentum · near oversold':'Momentum · neutral')}${card('Trend',trend,`Price ${D.market.price>s20?'>':'<'} SMA20 ${s20>s50?'>':'<'} SMA50 ${s50>s200?'>':'<'} SMA200`,trend.includes('Bullish')?'pos':'warn')}</div>
 <div class="grid k3" style="margin-top:12px">${card('SMA20',money(s20),`Short-term (~1 month) · price ${(D.market.price/s20-1)*100>=0?'+':''}${((D.market.price/s20-1)*100).toFixed(1)}% vs SMA`)}${card('SMA50',money(s50),`Medium-term (~2–3 months) · price ${(D.market.price/s50-1)*100>=0?'+':''}${((D.market.price/s50-1)*100).toFixed(1)}% vs SMA`)}${card('SMA200',money(s200),`Long-term (~9–10 months) · price ${(D.market.price/s200-1)*100>=0?'+':''}${((D.market.price/s200-1)*100).toFixed(1)}% vs SMA`)}</div>
 <div class="card" style="margin-top:12px"><h3>Price, moving averages and DCF fair value</h3>${marketChart(dates,ps,s20s,s50s,s200s,fv)}<div class="legend"><span><i style="background:var(--blue)"></i>Price</span><span><i style="background:var(--amber)"></i>SMA20</span><span><i style="background:var(--purple)"></i>SMA50</span><span><i style="background:var(--cyan)"></i>SMA200</span><span><i style="background:var(--green)"></i>DCF fair value</span></div></div>
 <div class="card" style="margin-top:12px"><h3>RSI (14) — momentum</h3>${rsiChart(dates,rsis)}<div class="finding ${rs>70?'find-risk':'find-pos'}"><h4>What does this mean?</h4><p>RSI compares recent gains with recent losses. Above 70 often means momentum is unusually strong / stretched; below 30 often means unusually weak. It is not a valuation measure or automatic buy/sell signal.</p></div></div>
 <div class="finding find-risk"><h4>Combined interpretation</h4><p>Trend is ${trend.toLowerCase()}. RSI is ${rs.toFixed(1)}. Current price is ${pct((D.market.price/fv-1)*100)} above base-case fair value. Strong momentum and attractive valuation are currently giving different signals.</p></div>`;
}
function marketChart(ds,p,s20,s50,s200,fv){let W=900,H=330,pad=52,vals=[...p,...s20.filter(Boolean),...s50.filter(Boolean),...s200.filter(Boolean),fv],mn=Math.floor(Math.min(...vals)/10)*10,mx=Math.ceil(Math.max(...vals)/10)*10,x=i=>pad+i*(W-2*pad)/(p.length-1),y=v=>H-pad-(v-mn)/(mx-mn)*(H-2*pad),path=(a,cls)=>{let d='',started=false;a.forEach((v,i)=>{if(v==null)return;d+=(started?'L':'M')+x(i)+','+y(v)+' ';started=true});return `<path class="${cls}" d="${d}"/>`};let idx=[0,65,130,195,259],ticks=[mn,(mn+mx)/2,mx];return `<div class="chart" style="height:310px"><svg viewBox="0 0 ${W} ${H}"><line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/><line class="axis" x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}"/>${ticks.map(t=>`<text x="${pad-8}" y="${y(t)+4}" text-anchor="end" fill="#99adbf" font-size="11">$${t.toFixed(0)}</text><line class="axis" opacity=".25" x1="${pad}" y1="${y(t)}" x2="${W-pad}" y2="${y(t)}"/>`).join('')}${path(p,'priceLine')}${path(s20,'sma20')}${path(s50,'sma50')}${path(s200,'sma200')}<path class="fair" d="M${pad},${y(fv)} L${W-pad},${y(fv)}"/>${idx.map(i=>`<text x="${x(i)}" y="${H-20}" text-anchor="middle" fill="#99adbf" font-size="10">${ds[i].slice(0,7)}</text>`).join('')}<circle cx="${x(259)}" cy="${y(p[259])}" r="5" fill="var(--blue)"/><text x="${x(259)-8}" y="${y(p[259])-9}" text-anchor="end" fill="#fff" font-size="10">${money(p[259])}</text><text x="${W-pad-5}" y="${y(fv)-7}" text-anchor="end" fill="var(--green)" font-size="10">DCF ${money(fv)}</text></svg></div>`}
function rsiChart(ds,a){let W=900,H=220,pad=42,x=i=>pad+i*(W-2*pad)/(a.length-1),y=v=>H-pad-v/100*(H-2*pad),d='',s=false;a.forEach((v,i)=>{if(v==null)return;d+=(s?'L':'M')+x(i)+','+y(v)+' ';s=true});let idx=[0,65,130,195,259];return `<div class="chart" style="height:210px"><svg viewBox="0 0 ${W} ${H}"><line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/><line x1="${pad}" y1="${y(70)}" x2="${W-pad}" y2="${y(70)}" stroke="var(--amber)" stroke-dasharray="5 4"/><line x1="${pad}" y1="${y(30)}" x2="${W-pad}" y2="${y(30)}" stroke="var(--cyan)" stroke-dasharray="5 4"/><text x="${pad-7}" y="${y(70)+4}" text-anchor="end" fill="#f4c65f" font-size="10">70</text><text x="${pad-7}" y="${y(30)+4}" text-anchor="end" fill="#73d6f2" font-size="10">30</text><path class="rsiLine" d="${d}"/>${idx.map(i=>`<text x="${x(i)}" y="${H-15}" text-anchor="middle" fill="#99adbf" font-size="10">${ds[i].slice(0,7)}</text>`).join('')}</svg></div>`}

function research(){let n=localStorage.getItem('ert07notes')||'';return `<h1>Research Notes</h1><div class="lead">Record your thesis, assumptions and why you changed them.</div><div class="card"><textarea id="notes" style="min-height:240px">${n}</textarea><div class="actions"><button class="btn primary" id="save">Save notes</button></div></div>`}
function report(){let R=rating(),fv=dcf().ps,mos=(fv/D.market.price-1)*100;return `<div class="noPrint actions"><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div><div class="report"><h1>Alphabet Inc. (GOOG)</h1><p><strong>Plain-language equity research summary</strong></p><div style="font-size:30px;color:#d9a500">${star(R.overall)} <span style="font-size:16px;color:#111">${R.overall.toFixed(1)}/5</span></div><h2>Investment scorecard</h2><div class="reportGrid">${[['Moat',R.moat],['Business quality',R.quality],['Growth',R.growth],['Financial health',R.fin],['Capital allocation',R.capital],['Valuation',R.val]].map(x=>`<div class="reportScore"><strong>${x[0]}</strong><span style="float:right">${x[1].toFixed(1)}/5</span><div class="bar"><i style="width:${x[1]/5*100}%"></i></div></div>`).join('')}</div><h2>Three-minute summary</h2><p>Alphabet is a high-quality, strong-moat business with improving operating profitability and high returns on invested capital. The central tension is valuation: recent AI-related CapEx reduces free cash flow while the market price implies substantially faster future FCF growth than the ERT base case.</p><h2>Valuation view</h2><p>Current price is <strong>${money(D.market.price)}</strong>; base DCF fair value is <strong>${money(fv)}</strong>, implying <strong>${pct(mos)}</strong> upside/downside. This result depends heavily on WACC, terminal growth, CapEx and the FCF definition.</p><h2>Market & consensus</h2><p>Demo analyst consensus target mean is <strong>${money(D.consensus.targetMean)}</strong>. Market-implied FCF growth is <strong>${pct(reverse())}</strong>, versus ERT base-case 5Y FCF CAGR of <strong>${pct(fiveYCagrForecast())}</strong>.</p><h2>What to watch next</h2><ul>${D.events.map(e=>`<li><strong>${e.date}</strong> — ${e.title}: ${e.watch}</li>`).join('')}</ul><h2>Disclaimer</h2><p>For research and educational reference only. This build uses fixed test data and demo consensus/event placeholders. Not investment advice.</p></div>`}
function disclaimer(){return `<h1>Disclaimer</h1><div class="card"><p>This research terminal supports education and investment research. It does not provide investment advice.</p><p>Financial, market, consensus and event data must be independently verified. Demo consensus/event data in this build are specifically labelled and must not be treated as live market information.</p><p>The product is designed to make every important number understandable, traceable, editable where appropriate, and actionable.</p></div>`}

function inspector(){
 if(!S.show)return `<button id="show" class="restore">Evidence / Context</button>`;
 let special=S.sel||'income.revenue';
 if(special==='roic')return specialInspector('ROIC — Return on Invested Capital',`<div class="value">${pct(roic())}</div><p>Plain English: how efficiently the business turns invested capital into after-tax operating profit.</p>${list([['ROIC',pct(roic())],['WACC',pct(wacc().w)],['Value creation spread',pct(roic()-wacc().w)]])}<div class="formula">ROIC = NOPAT ÷ Invested Capital<br>NOPAT ≈ Operating Income × (1 − tax rate)</div><div class="finding find-pos"><p>ROIC well above WACC usually indicates strong value creation. It can support a moat thesis, but does not prove one by itself.</p></div>`);
 if(String(special).startsWith('multiple:')){let m=special.split(':')[1],cur=m==='P/E'?pe():m==='PEG'?peg():m==='EV/Sales'?evSales():m==='EV/EBIT'?evEbit():evFcf(),a=D.historicalMultiples[m],av=avg(a);return specialInspector(m,`<div class="value">${cur.toFixed(2)}x</div><p>${descr[m]}</p>${list([['Current',cur.toFixed(2)+'x'],['5Y average',av.toFixed(2)+'x'],['5Y median',med(a).toFixed(2)+'x'],['5Y low',Math.min(...a).toFixed(2)+'x'],['5Y high',Math.max(...a).toFixed(2)+'x']])}<div class="finding ${cur>av?'find-risk':'find-pos'}"><p>${cur>av?'Above':'Below'} its own 5Y average. Historical comparison tells you how GOOG is priced relative to itself — not whether it is objectively cheap.</p></div>${m==='EV/FCF'?'<div class="finding find-risk"><p>High recent CapEx reduces FCF and can make EV/FCF look expensive. Explore CapEx in Financials / Analysis.</p></div>':''}`);
 }
 if(String(special).startsWith('rating:'))return ratingInspector(special.slice(7));
 if(String(special).startsWith('status:'))return statusInspector(special.slice(7));
 if(String(special).startsWith('wacc'))return waccInspector(special);
 if(special==='terminal')return terminalInspector();
 if(special==='fcfmargin')return specialInspector('5Y average FCF margin',`<div class="value tone-model">${pct(avg(fcfMargins()))}</div><p><strong>What is it?</strong> Free cash flow as a percentage of revenue, averaged across five fiscal years.</p>${spark(fcfMargins())}${list(D.years.map((y,i)=>[y,pct(fcfMargins()[i])]))}<div class="finding find-risk"><h4>Why it matters</h4><p>Using a multi-year margin can smooth one-off CapEx cycles, but it can also hide a structural change in investment intensity.</p></div>`);
 if(special==='dcfresult')return specialInspector('DCF result — how the answer is built',`<p><strong>What is it?</strong> Present value of forecast FCF plus terminal value, adjusted for net cash, divided by shares.</p>${list([['Enterprise value',fmt(dcf().ev)+' USD million'],['Net cash',fmt(D.market.net_cash_m)+' USD million'],['Equity value',fmt(dcf().equity)+' USD million'],['Shares',fmt(D.market.shares_m)+' million'],['Fair value',money(dcf().ps)+'/share']])}<div class="finding find-risk"><h4>Stress-test it</h4><p>Change WACC, terminal growth or yearly FCF growth on the left. The result and sensitivity table recalculate immediately.</p></div>`);
 let r=by(special)||by('income.revenue'),pg=page(r[0]),unit=r[0].includes('eps')?'USD/share':r[0].includes('shares')?'million shares':'USD million';
 return `<aside class="ins ${S.show?'mobileOpen':''}"><div class="ih"><strong>Evidence & Analysis Inspector</strong><div class="sp"></div><button class="btn" id="hide">Hide</button></div><div style="padding:12px"><h3>${r[1]}</h3><div class="sub">${unit}</div>${spark(r[2])}<div class="meta"><div><span>Cell ID</span><strong>${r[0]}.FY2024</strong></div><div><span>Latest value</span><strong>${fmt(last(r[2]),2)}</strong></div><div><span>5Y CAGR</span><strong>${isFinite(cagr(r[2]))?pct(cagr(r[2])):'—'}</strong></div><div><span>2024 YoY</span><strong>${yy(r[2],4)==null?'—':pct(yy(r[2],4))}</strong></div><div><span>Form</span><strong>10-K FY2024</strong></div><div><span>Report page</span><strong>${pg}</strong></div></div><div class="finding find-pos"><h4>So what?</h4><p>${soWhat(r[0])}</p></div><div class="actions"><a class="btn primary" target="_blank" href="${D.source.filing}">Open filing</a><a class="btn" target="_blank" href="${D.source.pdf}#page=${pg}">Open page</a></div></div></aside>`;
}
function ratingInspector(name){let R=rating(),map={'Moat / competitive advantage':[R.moat,'ROIC vs WACC','Revenue durability','Operating margin','Balance-sheet strength','Brand/network effects'],'Business quality':[R.quality,'Operating margin','FCF generation','ROIC','Balance sheet','Earnings consistency'],'Growth':[R.growth,'Revenue growth','FCF growth','Cloud/AI opportunity','Consensus growth','Reinvestment'],'Financial health':[R.fin,'Net cash','Debt burden','Interest coverage','Liquidity','Cash generation'],'Capital allocation':[R.capital,'CapEx returns','Buybacks','SBC dilution','Acquisitions','Dividends'],'Valuation':[R.val,'DCF vs price','Reverse DCF','P/E history','EV/FCF history','Consensus expectations'],'Risk':[R.risk,'Regulation','AI competition','CapEx intensity','Valuation risk','Execution risk']};let a=map[name]||[3];let tone=name==='Valuation'?'tone-neg':name==='Risk'?'tone-watch':'tone-pos';return specialInspector(`${name} — ${a[0].toFixed(1)}/5`,`<div class="value ${tone}">${star(a[0])} ${a[0].toFixed(1)}/5</div><p><strong>Why this score?</strong> The rating is a research summary, not a raw fact. It combines the components below.</p>${list(a.slice(1).map((x,i)=>[x, i<2?'High weight':'Supporting']))}<div class="finding find-risk"><h4>Methodology</h4><p>Prototype score. Production version should expose exact weights, thresholds and every underlying calculation so the score can be reproduced.</p></div><div class="finding find-pos"><h4>What would change it?</h4><p>Click the underlying financial and valuation metrics elsewhere in the terminal to inspect source facts, trends and model impact.</p></div>`)}
function statusInspector(k){let x={growth:['Growth — STRONG','Revenue growth accelerated and the 5Y trend remains positive.','income.revenue'],margins:['Margins — IMPROVING','Operating margin reached 32.1%; more revenue is converting into operating profit.','income.op'],fcf:['FCF quality — MIXED','Earnings and OCF are strong, but sharply higher CapEx is absorbing cash and weakening FCF conversion.','cashflow.capex'],consensus:['Consensus — ABOVE OUR BASE','Demo analyst expectations are above the ERT base case. This does not mean estimates are rising unless historical revisions confirm it.','income.revenue'],valuation:['Valuation — HIGH EXPECTATIONS','Current price implies materially faster FCF growth than the ERT base case.','cashflow.ocf']}[k];return specialInspector(x[0],`<p>${x[1]}</p><div class="finding find-risk"><h4>Why it matters</h4><p>This status is a conclusion. Use the supporting metric below and its source evidence to test whether you agree.</p></div><button class="btn primary" data-inspect="${x[2]}">Open supporting metric</button>`)}
function waccInspector(k){let W=wacc(),common=`<div class="formula">WACC = E/(D+E) × Cost of Equity + D/(D+E) × After-tax Cost of Debt</div>`;if(k==='wacc:rf')return specialInspector('Risk-free rate — '+pct(S.rf),`<p><strong>What is it?</strong> Baseline return assumed for a near-default-free USD investment. USD DCFs commonly benchmark this to long-dated US Treasuries.</p>${list([['Selected assumption',pct(S.rf)],['Reference instrument','US 10Y Treasury'],['Why it matters','Higher risk-free → higher WACC → lower DCF value']])}<div class="finding find-risk"><h4>Benchmark / source</h4><p>Connect to the U.S. Treasury daily par yield curve in production and display the exact as-of date. Do not silently hard-code a live yield.</p></div>`);if(k==='wacc:beta')return specialInspector('Beta — '+S.beta.toFixed(2),`<p><strong>What is it?</strong> Sensitivity of GOOG equity returns to the broad market. 1.0 ≈ market-like; above 1 = historically more sensitive.</p>${list([['Selected beta',S.beta.toFixed(2)],['Used in','Cost of equity = Rf + Beta × ERP'],['Impact','Higher beta → higher WACC → lower fair value']])}<div class="finding find-risk"><p>Production version should show provider, lookback period and frequency (for example 2Y weekly / 5Y monthly) plus an industry benchmark.</p></div>`);if(k==='wacc:erp')return specialInspector('Equity risk premium — '+pct(S.erp),`<p><strong>What is it?</strong> Extra return investors demand for equities over the risk-free rate.</p>${list([['Selected ERP',pct(S.erp)],['Cost of equity',pct(W.coe)],['Impact','Higher ERP → higher WACC → lower fair value']])}<div class="finding find-risk"><p>Production benchmark: current implied ERP with source and as-of date; historical ERP shown only as context.</p></div>`);if(k==='wacc:debt')return specialInspector('Alphabet debt & cost of debt — '+pct(S.cod),`<p><strong>What is it?</strong> Current borrowing cost used for the debt portion of WACC. Coupon, effective rate and current market YTM are not the same thing.</p>${list([['Selected pre-tax cost of debt',pct(S.cod)],['FY2024 commercial paper effective rate','4.4%'],['FY2024 long-term debt face value','$12.0bn'],['FY2024 long-term debt carrying value','$10.883bn'],['2016 notes','2.00% coupon · 2.23% effective · matures 2026'],['2020 notes','0.45%–2.25% coupons · mature 2025–2060']])}<div class="finding find-risk"><h4>Important</h4><p>The 4.4% input matches FY2024 commercial paper, not a weighted live YTM for all Alphabet bonds. Production should calculate/obtain current bond YTMs before treating this as market cost of debt.</p></div><div class="sourcebox">Source: Alphabet FY2024 10-K, Note 6 Debt, p.74.</div>`);if(k==='wacc:tax')return specialInspector('Tax rate — '+pct(S.tax),`<p><strong>What is it?</strong> Tax assumption used to convert pre-tax debt cost to after-tax debt cost.</p>${list([['Selected rate',pct(S.tax)],['FY2024 tax expense',fmt(last(by('income.tax')[2]))+'m'],['FY2024 pre-tax income',fmt(last(by('income.pretax')[2]))+'m'],['Simple effective rate',pct(last(by('income.tax')[2])/last(by('income.pretax')[2])*100)]])}<p>Use a normalized tax rate when a single year contains unusual tax items.</p>`);if(k==='wacc:weights')return specialInspector('Capital structure weights',`${list([['Market equity value',fmt(D.market.price*D.market.shares_m)+' USD million'],['Debt proxy',fmt(last(by('balance.long_debt')[2]))+' USD million'],['Equity weight',pct(W.ew*100)],['Debt weight',pct(W.dw*100)]])}<p>WACC uses market-value weights where possible. Debt definition must be consistent and traceable.</p>`);return specialInspector('WACC — '+pct(W.w),`<div class="value tone-model">${pct(W.w)}</div>${common}${list([['Risk-free',pct(S.rf)],['Beta',S.beta.toFixed(2)],['ERP',pct(S.erp)],['Cost of equity',pct(W.coe)],['Pre-tax debt cost',pct(S.cod)],['Tax rate',pct(S.tax)],['After-tax debt cost',pct(W.after)],['Equity / debt weights',pct(W.ew*100)+' / '+pct(W.dw*100)]])}<div class="finding find-risk"><h4>How to use it</h4><p>Click each input on the left. Every assumption should show definition, benchmark, source, date and valuation impact here.</p></div>`)}
function terminalInspector(){let W=wacc(),R=dcf(),vals=[2,2.5,3].map(g=>[g,dcf(S.g,W.w,g).ps]);return specialInspector('Terminal growth — '+pct(S.terminal),`<p><strong>What is it?</strong> Perpetual growth assumed after Year 5. It should represent mature long-run growth, not Alphabet's recent historical growth.</p>${list([['Selected',pct(S.terminal)],['Conservative benchmark','2.0%'],['Base benchmark','2.5%'],['Optimistic benchmark','3.0%'],['WACC − g',pct(W.w-S.terminal)],['Terminal value share of PV',pct(R.tvshare)]])}<div class="formula">Terminal Value = FCF₆ ÷ (WACC − g)</div>${list(vals.map(x=>['Fair value at g = '+x[0].toFixed(1)+'%',money(x[1])+'/share']))}<div class="finding ${R.tvshare>70?'find-risk':'find-pos'}"><h4>Sanity check</h4><p>g must remain below WACC. With ${pct(R.tvshare)} of PV coming from terminal value, this model is highly sensitive to the terminal assumption.</p></div>`)}
function specialInspector(title,body){return `<aside class="ins mobileOpen"><div class="ih"><strong>Evidence & Analysis Inspector</strong><div class="sp"></div><button class="btn" id="hide">Hide</button></div><div style="padding:12px"><h3>${title}</h3>${body}</div></aside>`}
function soWhat(id){if(id==='cashflow.capex')return 'CapEx reduces current free cash flow, but may create future capacity and AI growth. The key question is whether future ROIC justifies the spending.';if(id==='income.revenue')return 'Revenue growth sets the starting point for future profit and FCF. Faster sustainable growth usually raises intrinsic value.';if(id==='balance.receivables')return 'Receivables should be compared with revenue growth. If receivables rise much faster, collection quality may be weakening.';return 'Use the trend, source and related calculations to understand whether this item improves or weakens the investment thesis.'}
function spark(a){let W=320,H=150,p=24,mn=Math.min(...a),mx=Math.max(...a),x=i=>p+i*(W-2*p)/(a.length-1),y=v=>H-p-(v-mn)/(mx-mn||1)*(H-2*p),d=a.map((v,i)=>(i?'L':'M')+x(i)+','+y(v)).join(' ');return `<div class="chart" style="height:165px"><svg viewBox="0 0 ${W} ${H}"><line class="axis" x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}"/><path class="priceLine" d="${d}"/>${a.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--blue)"/><text x="${x(i)}" y="${H-6}" fill="#99adbf" font-size="9" text-anchor="middle">${D.years[i]}</text>`).join('')}</svg></div>`}

 let r=document.getElementById('res'),w=document.getElementById('work');if(r&&w&&S.show&&window.innerWidth>767){let drag=false;r.onmousedown=()=>drag=true;window.onmouseup=()=>drag=false;window.onmousemove=e=>{if(!drag)return;let b=w.getBoundingClientRect(),right=Math.max(290,Math.min(620,b.right-e.clientX));w.style.gridTemplateColumns=`minmax(560px,1fr) 6px ${right}px`};r.ondblclick=()=>w.style.gridTemplateColumns='minmax(560px,1fr) 6px 360px'}
}

<script>
(function(){

function clickable(root){
 root.querySelectorAll('[data-a091]').forEach(x=>x.onclick=()=>{

  if(k==='tg') inspector('Terminal growth — 2.5%',

  if(k==='business') inspector('Alphabet business / revenue mix',

function enhanceValuation(){

 });
 // Add explicit assumption reasoning next to WACC/TG.
 const body=`
 <p>This replaces the simplistic “pick 22.8% + type FCF growth” logic with explicit, editable forecast drivers.</p>
 <label>Forecast method</label>
 <select class="a091-select" id="a091-method"><option>Driver-based FCF</option><option>Custom FCF margin</option><option>Reported FCF growth</option><option>Historical FCF margin</option><option>Consensus-based (demo only)</option></select>

 <tr><td>OCF margin %</td>${[37,37,37.2,37.3,37.5].map((v,i)=>`<td><input class="a091-input drv ocf" data-y="${i}" value="${v}" type="number" step=".1"></td>`).join('')}</tr>
 <tr><td>CapEx / Revenue %</td>${[15,14,13,12,11].map((v,i)=>`<td><input class="a091-input drv cap" data-y="${i}" value="${v}" type="number" step=".1"></td>`).join('')}</tr>
 <tr><td><b>FCF margin %</b></td>${[0,1,2,3,4].map(i=>`<td><b class="a091-good fm" data-y="${i}">—</b></td>`).join('')}</tr>
 </tbody></table>
 <div class="a091-grid" style="margin-top:12px">
  <div class="a091-box"><h3>CapEx classification</h3>
   <div class="row"><span>Maintenance</span><b>Not separately disclosed</b></div>

  </div>
  <div class="a091-box"><h3>Historical anchor</h3>
   <div class="row"><span>2023 CapEx</span><b>$32,251m</b></div>
   <div class="row"><span>2024 CapEx</span><b>$52,535m</b></div>
   <div class="row"><span>2024 CapEx / revenue</span><b>15.0%</b></div>
   <div class="row"><span>5Y avg FCF margin</span><b data-a091="fcf">22.8%</b></div>

 </div>
 <div class="a091-note"><b>Model rule:</b> Custom FCF Margin and Custom FCF Growth must be mutually exclusive. In Driver mode, FCF margin = OCF margin − CapEx/revenue. Changes should feed the DCF calculation engine.</div>`;

function erpInspector(){
 setInspector('Equity risk premium — 4.18%',`
 <p><strong>What is it?</strong> The extra return required for US equities above a risk-free US Treasury investment.</p>
 <h3>Why exactly 4.18%?</h3>
 <p>The selected benchmark is the Damodaran / NYU Stern US <strong>implied</strong> equity risk premium. It is not a round-number assumption chosen by ERT.</p>
 <div class="formula">Observed S&amp;P 500 level = PV(expected shareholder cash flows + terminal value, discounted at r)<br><br>
 Solve for <strong>r</strong> = market-implied equity return<br>
 ERP = r − matching risk-free rate</div>
 <h3>Where does r come from?</h3>
 <p>The implied return is the discount rate that reconciles the observed market price with the expected future shareholder cash flows. To reconstruct it rather than merely quote the published ERP, the model needs the S&amp;P 500 level, expected dividends/buybacks or cash-flow yield, explicit growth forecasts, terminal growth and matching Treasury rate.</p>
 <div class="ert-note"><strong>No circular evidence:</strong> this build does not invent an “8.63%” by simply adding 4.18% to another number. A production reconstruction must store every underlying input and source.</div>
 <h3>Why use implied ERP?</h3><p>It is forward-looking and reflects the price investors are currently paying for expected market cash flows. Historical ERP is useful context but answers a different question.</p>
 <h3>Alternatives / limitations</h3><p>Different payout definitions, normalized earnings and historical methods can produce different ERP estimates. The selected method therefore needs a source, methodology label and as-of date.</p>
 <h3>Impact on GOOG</h3><p>Higher ERP → higher cost of equity → higher WACC → lower DCF fair value. Lower ERP has the opposite effect.</p>
 <h3>Source</h3><p>Aswath Damodaran / NYU Stern implied ERP benchmark. Live build requirement: exact source URL, benchmark date, retrieved value and underlying reconstruction inputs.</p>`);
}
function tgInspector(){

 <p><strong>What is it?</strong> The perpetual nominal growth rate applied after the explicit five-year forecast.</p>
 <h3>Why exactly 2.5%?</h3>
 <p>2.5% is a <strong>mature-company base-case assumption</strong>, not Alphabet's recent growth rate. A perpetual rate must be anchored to sustainable long-run nominal economic growth because a company cannot outgrow the economy forever.</p>
 <h3>Benchmark build-up required</h3>
 <p>The production model should show the selected long-run inflation benchmark + sustainable real economic/productivity growth allowance, then explain why the final company terminal rate is below, equal to or above that reference.</p>
 <div class="ert-note"><strong>Important:</strong> this prototype does not yet have a live macro-data feed, so it must not pretend that 2.5% is a current official macro forecast.</div>
 <h3>Why not 2.0%?</h3><p>2.0% is a more conservative mature-state scenario and produces a lower terminal value.</p>
 <h3>Why not 3.0%?</h3><p>3.0% assumes stronger perpetual nominal growth. Because terminal value is very sensitive to g, even +0.5pp can materially change fair value.</p>
 <h3>Why not 5–10%?</h3><p>That would imply Alphabet permanently compounds faster than the broader nominal economy, which becomes economically implausible over an infinite horizon.</p>
 <h3>Valuation sensitivity</h3><p>2.0% → lower fair value · <strong>2.5% → base</strong> · 3.0% → higher fair value. The live model should calculate these values from the same DCF state rather than hard-code them.</p>`);
}

 <div class="formula">Revenue forecast × OCF margin = OCF<br>Revenue forecast × CapEx / Revenue = CapEx<br>OCF − CapEx = FCF</div>

 <h3>What happens when you edit a driver?</h3><p>The scenario table recalculates FCF margin immediately. The production engine should then pass the resulting FCF series into the DCF and show the change versus Base fair value.</p>

}
