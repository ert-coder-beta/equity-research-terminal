 <div class="grid two" style="margin-top:12px"><div class="card"><h3>Investment profile</h3>${ratingLine('Moat / competitive advantage',R.moat,'Wide moat potential')}${ratingLine('Business quality',R.quality,'Excellent')}${ratingLine('Growth',R.growth,'Strong')}${ratingLine('Financial health',R.fin,'Excellent')}${ratingLine('Capital allocation',R.capital,'Strong')}${ratingLine('Valuation',R.val,R.val<3?'Less attractive':'Attractive')}${ratingLine('Risk',R.risk,'Moderate')}<div class="finding find-pos" style="margin-top:10px"><h4>Overall interpretation</h4><p>High-quality, strong-moat business. Current valuation is the main constraint under the base DCF assumptions.</p></div></div>

 <div class="card" style="margin-top:12px"><h3>Historical valuation — compared with GOOG's own 5Y history</h3><div class="finding find-risk"><h4>Overall: MIXED</h4><p>Earnings measures look reasonable, while free-cash-flow valuation is stretched. Elevated CapEx is one reason these measures disagree.</p></div>${histTable(mults)}</div>`;

function ratingLine(a,n,meaning){let tone=a==='Valuation'?'tone-neg':a==='Risk'?'tone-watch':'tone-pos';let why=a.startsWith('Moat')?'ROIC spread + brand/network strength':a==='Business quality'?'32.1% operating margin · strong cash generation':a==='Growth'?'Revenue +13.9% · 5Y CAGR 17.7%':a==='Financial health'?'Net cash balance · low debt weight':a==='Capital allocation'?'Buybacks + reinvestment; CapEx needs monitoring':a==='Valuation'?'Price above base DCF · high implied growth':'Moderate: regulation, AI competition, CapEx';return `<div class="ratingRow clickable" data-inspect="rating:${a}"><span>${a}<span class="metricDesc">${why}</span></span><span class="stars ${tone}">${star(n)}</span><strong class="${tone}">${n.toFixed(1)}</strong></div>`}
function list(a){return `<div>${a.map(x=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div>`}
function histTable(mults){return `<div class="tw" style="max-height:none"><table style="min-width:960px"><thead><tr><th>Metric</th><th>Current</th><th>Live-history average</th><th>Median</th><th>Observed range</th><th>vs average</th><th>Meaning</th></tr></thead><tbody>${mults.map(([m,cur,a])=>{a=(a||[]).filter(Number.isFinite);if(a.length<2||!Number.isFinite(cur))return `<tr><td><strong>${m}</strong></td><td>${Number.isFinite(cur)?cur.toFixed(2)+'x':'Unavailable'}</td><td colspan="5" class="tone-watch">Unavailable — insufficient live SEC/market history; no demo values used.</td></tr>`;let av=avg(a),lo=Math.min(...a),hi=Math.max(...a),pos=(cur-lo)/(hi-lo||1)*100,avpos=(av-lo)/(hi-lo||1)*100,d=(cur/av-1)*100,tone=d<-5?'tone-pos':d>5?'tone-neg':'tone-watch',interpret=d<-15?'Cheaper than observed history':d<-5?'Slightly cheaper':d>15?'Expensive vs observed history':d>5?'Slightly expensive':'Near observed average';return `<tr class="row clickable" data-inspect="multiple:${m}"><td><strong>${m}</strong><span class="metricDesc">${descr[m]}</span></td><td class="${tone}">${cur.toFixed(2)}x</td><td>${av.toFixed(2)}x</td><td>${med(a).toFixed(2)}x</td><td class="range"><div style="display:flex;justify-content:space-between"><span>${lo.toFixed(1)}x LOW</span><span>HIGH ${hi.toFixed(1)}x</span></div><div class="track"><i style="left:${Math.max(0,Math.min(100,pos))}%"></i><b style="position:absolute;left:${avpos}%;top:-3px;height:12px;border-left:2px solid var(--amber)"></b></div><span class="metricDesc">Live SEC annuals + market history</span></td><td class="${tone}">${d>=0?'+':''}${d.toFixed(0)}%</td><td class="${tone}">${interpret}</td></tr>`}).join('')}</tbody></table></div>`}

function financials(){let R=D[S.st];if(!R.find(x=>x[0]===S.sel))S.sel=R[0][0];return `<h1>Financial Statements</h1><div class="lead">Live annual history: FY${D.years[0]}–FY${D.years.at(-1)} · latest TTM shown above · every YoY/CAGR guarded against missing values.</div><div class="tabs">${[['income','Income Statement'],['balance','Balance Sheet'],['cashflow','Cash Flow']].map(x=>`<button data-tab="${x[0]}" class="${S.st===x[0]?'active':''}">${x[1]}</button>`).join('')}</div><div class="tw"><table><thead><tr><th>Line item</th>${D.years.map((y,i)=>`<th>${y}</th>${i?'<th>YoY</th>':''}`).join('')}<th>5Y CAGR</th></tr></thead><tbody>${R.map(r=>`<tr class="row ${S.sel===r[0]?'sel':''}" data-row="${r[0]}"><td>${r[1]}</td>${r[2].map((v,i)=>`<td>${fmt(v,2)}</td>${i?`<td class="${yy(r[2],i)>=0?'pos':'neg'}">${yy(r[2],i)==null?'—':pct(yy(r[2],i))}</td>`:''}`).join('')}<td>${isFinite(cagr(r[2]))?pct(cagr(r[2])):'—'}</td></tr>`).join('')}</tbody></table></div>`}

 <div class="grid two" style="margin-top:12px"><div class="card"><h3>Analyst consensus snapshot <span class="badge purple">${D.consensus.status}</span></h3>${list([['Rating',D.consensus.rating],['Buy / Hold / Sell',`${D.consensus.buy} / ${D.consensus.hold} / ${D.consensus.sell}`],['Target low',money(D.consensus.targetLow)],['Target median',money(D.consensus.targetMedian)],['Target mean',money(D.consensus.targetMean)],['Target high',money(D.consensus.targetHigh)],['30d estimate revision','+'+D.consensus.revision30+'%'],['90d estimate revision','+'+D.consensus.revision90+'%']])}</div>
 <div class="card"><h3>Upcoming catalysts & key dates</h3>${D.events.map(e=>`<div class="event"><div class="eventTop"><strong>${e.date} · ${e.title}</strong><span class="impact">${e.impact}</span></div><div class="small">${e.status}</div><p style="margin-bottom:5px">${e.watch}</p><div class="metricDesc">Source: ${e.source}</div></div>`).join('')}</div></div>`;

function snap(a,b,c,id=''){return `<div class="clickable" data-inspect="${id}"><span class="sub">${a}</span><b class="${c}">${b}</b></div>`}function cmp(a,b,c,d,e){return `<div class="compare"><span>${a}</span><strong>${b}</strong><strong>${c}</strong><strong class="purple">${d}</strong><strong class="warn">${e}</strong></div>`}

function waInput(label,key,val,id){return `<label class="clickable" data-inspect="${id}">${label}<input data-wa="${key}" value="${val}"></label>`}
function sensitivity(ts){
 let ws=[7.5,8,8.5,9,9.5,10],best=null,bd=Infinity,matrix=[];
 ws.forEach(w=>{
   let row=[];
   ts.forEach(t=>{
     let v=NaN;
     try{v=Number(dcf(S.g,w,t).ps)}catch(_e){}
     row.push(v);
     if(Number.isFinite(v)&&Number.isFinite(Number(D.market.price))){
       let dist=Math.abs(v-Number(D.market.price));
       if(dist<bd){bd=dist;best=[w,t]}
     }
   });
   matrix.push(row);
 });
 return `<div class="tw" style="max-height:none"><table style="min-width:700px"><thead><tr><th>WACC \\ g</th>${ts.map(t=>`<th>${t}%</th>`).join('')}</tr></thead><tbody>${ws.map((w,ri)=>`<tr><td>${w}%</td>${ts.map((t,ci)=>{let v=matrix[ri][ci],b=best&&best[0]===w&&best[1]===t;return `<td style="${b?'outline:2px solid var(--amber);background:#28220c':''}">${Number.isFinite(v)?money(v):'Unavailable'}${b?'<span class="metricDesc">Closest to current price</span>':''}</td>`}).join('')}</tr>`).join('')}</tbody></table>${best?'':'<div class="sourcebox">Sensitivity unavailable until required valuation inputs are valid.</div>'}</div>`
}

function market(){
 let ps=D.prices,dates=D.dates,s20s=smaSeries(ps,20),s50s=smaSeries(ps,50),s200s=smaSeries(ps,200),rsis=rsiSeries(ps),fv=dcf().ps;
 let s20=sma(ps,20),s50=sma(ps,50),s200=sma(ps,200),rs=rsi(ps),trend=D.market.price>s20&&s20>s50&&s50>s200?'Bullish alignment':'Mixed';
 let cm=D.consensus.targetMean||216,medt=D.consensus.targetMedian||214,cl=D.consensus.targetLow||165,ch=D.consensus.targetHigh||260;
 return `<h1>Market & Price Context</h1><div class="lead">Price trend, fair value, moving averages and momentum — translated into plain English.</div>
 <div class="grid market5">
 ${card('Current price',money(D.market.price),'Market close · '+D.market.asof)}
 ${card('DCF fair value',money(fv),'Base DCF · '+D.market.model_asof,D.market.price>fv?'neg':'pos')}
 <div class="card clickable" data-inspect="consensus"><div class="sub">Analyst consensus target <span class="badge purple">${D.consensus.status||'DEMO'}</span></div><div class="value purple">${money(cm)}</div><div class="small">Median ${money(medt)} · range ${money(cl)}–${money(ch)}</div></div>
 ${card('RSI (14)',rs.toFixed(1),rs>70?'Momentum · near overbought':rs<30?'Momentum · near oversold':'Momentum · neutral')}
 ${card('Trend',trend,`Price ${D.market.price>s20?'>':'<'} SMA20 ${s20>s50?'>':'<'} SMA50 ${s50>s200?'>':'<'} SMA200`,trend.includes('Bullish')?'pos':'warn')}

 ${card('Mean target',money(cm),`${((cm/D.market.price-1)*100)>=0?'+':''}${((cm/D.market.price-1)*100).toFixed(1)}% vs current price`,'purple')}
 ${card('Median target',money(medt),'External analyst reference','purple')}
 ${card('Low target',money(cl),'Lower end of target range')}
 ${card('High target',money(ch),'Upper end of target range')}
 </div><div class="sourcebox"><strong>Consensus source:</strong> ${D.consensus.displaySource}. Production version must show provider, analyst count, as-of date and historical revisions.</div></div>
 <div class="grid k3" style="margin-top:12px">${card('SMA20',money(s20),`Short-term (~1 month) · price ${(D.market.price/s20-1)*100>=0?'+':''}${((D.market.price/s20-1)*100).toFixed(1)}% vs SMA`)}${card('SMA50',money(s50),`Medium-term (~2–3 months) · price ${(D.market.price/s50-1)*100>=0?'+':''}${((D.market.price/s50-1)*100).toFixed(1)}% vs SMA`)}${card('SMA200',money(s200),`Long-term (~9–10 months) · price ${(D.market.price/s200-1)*100>=0?'+':''}${((D.market.price/s200-1)*100).toFixed(1)}% vs SMA`)}</div>
 <div class="card" style="margin-top:12px"><h3>Price, moving averages, DCF fair value and consensus</h3>${marketChart(dates,ps,s20s,s50s,s200s,fv,cm,cl,ch)}<div class="legend"><span><i style="background:var(--blue)"></i>Price</span><span><i style="background:var(--amber)"></i>SMA20</span><span><i style="background:var(--purple)"></i>SMA50</span><span><i style="background:var(--cyan)"></i>SMA200</span><span><i style="background:var(--green)"></i>DCF fair value</span><span><i style="background:#bd9cff"></i>Consensus mean</span><span><i style="background:rgba(189,156,255,.28)"></i>Consensus range</span></div></div>

function marketChart(ds,p,s20,s50,s200,fv,cm,cl,ch){
 let W=1000,H=390,pad=58,vals=[...p,...s20.filter(Boolean),...s50.filter(Boolean),...s200.filter(Boolean),fv,cm,cl,ch],
 mn=Math.floor(Math.min(...vals)/10)*10,mx=Math.ceil(Math.max(...vals)/10)*10,
 x=i=>pad+i*(W-2*pad)/(p.length-1),y=v=>H-pad-(v-mn)/(mx-mn)*(H-2*pad),
 path=(a,cls)=>{let d='',started=false;a.forEach((v,i)=>{if(v==null)return;d+=(started?'L':'M')+x(i)+','+y(v)+' ';started=true});return `<path class="${cls}" d="${d}"/>`};
 let end=p.length-1,idx=[0,Math.round(end*.25),Math.round(end*.5),Math.round(end*.75),end],ticks=[mn,mn+(mx-mn)*.25,mn+(mx-mn)*.5,mn+(mx-mn)*.75,mx];
 return `<div class="chart marketMainChart" style="height:390px"><svg viewBox="0 0 ${W} ${H}">
 <line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/><line class="axis" x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}"/>
 ${ticks.map(t=>`<text x="${pad-8}" y="${y(t)+4}" text-anchor="end" fill="#99adbf" font-size="11">$${t.toFixed(0)}</text><line class="axis" opacity=".22" x1="${pad}" y1="${y(t)}" x2="${W-pad}" y2="${y(t)}"/>`).join('')}
 <rect x="${pad}" y="${y(ch)}" width="${W-2*pad}" height="${Math.max(0,y(cl)-y(ch))}" fill="#bd9cff" opacity=".10"/>
 <line x1="${pad}" y1="${y(cm)}" x2="${W-pad}" y2="${y(cm)}" stroke="#bd9cff" stroke-width="2" stroke-dasharray="9 5"/>
 ${path(p,'priceLine')}${path(s20,'sma20')}${path(s50,'sma50')}${path(s200,'sma200')}<path class="fair" d="M${pad},${y(fv)} L${W-pad},${y(fv)}"/>
 ${idx.map(i=>`<text x="${x(i)}" y="${H-22}" text-anchor="middle" fill="#99adbf" font-size="10">${ds[i].slice(0,7)}</text>`).join('')}
 <circle cx="${x(end)}" cy="${y(p[end])}" r="5" fill="var(--blue)"/><text x="${x(end)-8}" y="${y(p[end])-9}" text-anchor="end" fill="#fff" font-size="10">${money(p[end])}</text>
 <text x="${W-pad-5}" y="${y(fv)-7}" text-anchor="end" fill="var(--green)" font-size="10">DCF ${money(fv)}</text>
 <text x="${W-pad-5}" y="${y(cm)-7}" text-anchor="end" fill="#c8a6ff" font-size="10">Consensus ${money(cm)} (DEMO)</text>
 <text x="${pad+5}" y="${y(ch)+14}" fill="#bda1ea" font-size="9">High ${money(ch)}</text><text x="${pad+5}" y="${y(cl)-5}" fill="#bda1ea" font-size="9">Low ${money(cl)}</text>
 </svg></div>`;
}
function rsiChart(ds,a){let W=900,H=220,pad=42,x=i=>pad+i*(W-2*pad)/Math.max(1,a.length-1),y=v=>H-pad-v/100*(H-2*pad),d='',ok=false;a.forEach((v,i)=>{if(!Number.isFinite(v))return;d+=(ok?'L':'M')+x(i)+','+y(v)+' ';ok=true});let end=Math.max(0,a.length-1),idx=[0,.25,.5,.75,1].map(q=>Math.min(end,Math.round(end*q)));return `<div class="chart" style="height:210px"><svg viewBox="0 0 ${W} ${H}"><line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/><line x1="${pad}" y1="${y(70)}" x2="${W-pad}" y2="${y(70)}" stroke="var(--amber)" stroke-dasharray="5 4"/><line x1="${pad}" y1="${y(30)}" x2="${W-pad}" y2="${y(30)}" stroke="var(--cyan)" stroke-dasharray="5 4"/><path class="rsiLine" d="${d}"/>${idx.map(i=>`<text x="${x(i)}" y="${H-15}" text-anchor="middle" fill="#99adbf" font-size="10">${(ds[i]||'').slice(0,7)}</text>`).join('')}</svg></div>`}

function report(){let R=rating(),fv=dcf().ps,mos=(fv/D.market.price-1)*100;return `<div class="noPrint actions"><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div><div class="report"><h1>Alphabet Inc. (GOOG)</h1><p><strong>Plain-language equity research summary</strong></p>
 <h2>Company & business overview</h2><div class="companyOverviewGrid"><div class="companyOverviewBox"><h3>What does Alphabet do?</h3><p>Alphabet is the parent company of Google. Its main economics come from Search and other advertising, YouTube, subscriptions/platforms/devices, Google Cloud and smaller Other Bets.</p><p><strong>Sector / industry:</strong> Interactive media / internet services<br><strong>Primary cash engine:</strong> Google advertising<br><strong>Major growth engine:</strong> Google Cloud / AI</p></div><div class="companyOverviewBox"><h3>Strengths vs weaknesses</h3><p class="positiveText"><strong>Strengths:</strong> Search distribution, YouTube scale, Cloud/AI opportunity, high cash generation and a strong balance sheet.</p><p class="negativeText"><strong>Risks:</strong> advertising dependence, AI/search disruption, regulation, heavy infrastructure CapEx, Cloud competition and uncertain returns from Other Bets.</p></div></div>
 <h2>Business / revenue mix</h2><table class="bizMix"><thead><tr><th>Business</th><th>Economic role</th><th>Contribution</th><th>Main opportunity</th><th>Main downside</th></tr></thead><tbody><tr><td><strong>Google Search & other</strong></td><td>Core advertising cash engine</td><td>Use filing-derived revenue</td><td>Commercial intent + AI monetisation</td><td>AI behaviour shift / antitrust</td></tr><tr><td><strong>YouTube</strong></td><td>Ads + subscriptions</td><td>Use disclosed categories</td><td>Video / creator ecosystem</td><td>Platform competition</td></tr><tr><td><strong>Subscriptions / platforms / devices</strong></td><td>Diversification</td><td>Use filing-derived revenue</td><td>Recurring subscriptions</td><td>Mixed hardware/platform economics</td></tr><tr><td><strong>Google Cloud</strong></td><td>Cloud + AI growth engine</td><td>Revenue + segment profit where disclosed</td><td>Enterprise AI / cloud</td><td>CapEx + AWS/Azure competition</td></tr><tr><td><strong>Other Bets</strong></td><td>Long-duration optionality</td><td>Segment disclosure where available</td><td>Waymo / new businesses</td><td>Losses / uncertain payoff</td></tr></tbody></table><p><small>Production build must populate exact contribution, 5Y trend and profitability from Alphabet filings. Items not separately disclosed must be labelled rather than estimated.</small></p>
 <div style="font-size:30px;color:#d9a500">${star(R.overall)} <span style="font-size:16px;color:#111">${R.overall.toFixed(1)}/5</span></div><h2>Investment scorecard</h2><div class="reportGrid">${[['Moat',R.moat],['Business quality',R.quality],['Growth',R.growth],['Financial health',R.fin],['Capital allocation',R.capital],['Valuation',R.val]].map(x=>`<div class="reportScore"><strong>${x[0]}</strong><span style="float:right">${x[1].toFixed(1)}/5</span><div class="bar"><i style="width:${x[1]/5*100}%"></i></div></div>`).join('')}</div><h2>Three-minute summary</h2><p>Alphabet is a high-quality, strong-moat business with improving operating profitability and high returns on invested capital. The central tension is valuation: recent AI-related CapEx reduces free cash flow while the market price implies substantially faster future FCF growth than the ERT base case.</p><h2>Valuation view</h2><p>Current price is <strong>${money(D.market.price)}</strong>; base DCF fair value is <strong>${money(fv)}</strong>, implying <strong>${pct(mos)}</strong> upside/downside. This result depends heavily on WACC, terminal growth, CapEx and the FCF definition.</p><h2>Market & consensus</h2><p>Analyst consensus target is <strong>${D.consensus&&D.consensus.status==='LIVE'?money(D.consensus.targetMean):'Unavailable'}</strong>. Market-implied FCF growth is <strong>${pct(reverse())}</strong>.</p><h2>What to watch next</h2><ul>${D.events.map(e=>`<li><strong>${e.date}</strong> — ${e.title}: ${e.watch}</li>`).join('')}</ul><h2>Disclaimer</h2><p>For research and educational reference only. Live-connected fields use the configured data sources; unavailable sources are labelled. Some research/event narrative fields may remain prototype content. Not investment advice.</p></div>`}

function inspector(){
 if(!S.show)return `<button id="show" class="restore">Evidence / Context</button>`;
 let special=S.sel||'income.revenue';
 if(special==='roic')return specialInspector('ROIC — Return on Invested Capital',`<div class="value">${pct(roic())}</div><p>Plain English: how efficiently the business turns invested capital into after-tax operating profit.</p>${list([['ROIC',pct(roic())],['WACC',pct(wacc().w)],['Value creation spread',pct(roic()-wacc().w)]])}<div class="formula">ROIC = NOPAT ÷ Invested Capital<br>NOPAT ≈ Operating Income × (1 − tax rate)</div><div class="finding find-pos"><p>ROIC well above WACC usually indicates strong value creation. It can support a moat thesis, but does not prove one by itself.</p></div>`);
 if(String(special).startsWith('multiple:')){
   let m=special.split(':')[1];
   let s=D.live?.sec||{}, price=Number(D.market.price), priceAsOf=D.market.asof||'—';

   let enterprise=price*shares-netCash;
   let eps=Number(s?.income_ttm?.diluted_eps ?? s?.diluted_eps_ttm);
   let rev=Number(s?.revenue_ttm_m ?? s?.income_ttm?.revenue);
   let op=Number(s?.income_ttm?.operating_income ?? s?.operating_income_ttm_m);
   let fwd=dcf()?.detail?.[0]||{};
   let cur,formula,inputs=[],basis='';

   if(m==='P/E'){
     cur=Number.isFinite(eps)&&eps>0?price/eps:pe();
     formula=`P/E = Current price ÷ TTM diluted EPS<br>${money(price)} ÷ ${Number.isFinite(eps)?money(eps):'Unavailable'} = ${Number.isFinite(cur)?cur.toFixed(2)+'x':'Unavailable'}`;
     inputs=[['Current price',money(price)],['Price as of',priceAsOf],['TTM diluted EPS',Number.isFinite(eps)?money(eps):'Unavailable'],['EPS period',s.latest_period||'—'],['Price source','Live market Worker'],['EPS source','SEC XBRL / normalized TTM']];
     basis='Trailing P/E using latest market price and latest validated TTM diluted EPS.';
   }else if(m==='PEG'){
     let p=pe(),g=(D.consensus?.status==='LIVE'&&Number(D.consensus.epsGrowth)>0)?Number(D.consensus.epsGrowth):cagr(by('income.eps')[2]);
     let gsrc=(D.consensus?.status==='LIVE'&&Number(D.consensus.epsGrowth)>0)?'Live analyst consensus EPS growth':'Historical 5Y diluted EPS CAGR';
     cur=Number.isFinite(p)&&g>0?p/g:NaN;
     formula=`PEG = P/E ÷ EPS growth rate<br>${Number.isFinite(p)?p.toFixed(2)+'x':'Unavailable'} ÷ ${pct(g)} = ${Number.isFinite(cur)?cur.toFixed(2):'Unavailable'}`;
     inputs=[['P/E',Number.isFinite(p)?p.toFixed(2)+'x':'Unavailable'],['EPS growth',pct(g)],['Growth definition',gsrc],['Price as of',priceAsOf],['Source','Live market + SEC / live consensus when available']];
     basis='PEG always labels the growth denominator; it is not silently mixed between historical and forward growth.';
   }else if(m==='EV/Sales'){
     cur=Number.isFinite(rev)&&rev>0?enterprise/rev:evSales();
     formula=`EV/Sales = Enterprise Value ÷ TTM Revenue<br>${fmt(enterprise,1)}m ÷ ${Number.isFinite(rev)?fmt(rev,1)+'m':'Unavailable'} = ${Number.isFinite(cur)?cur.toFixed(2)+'x':'Unavailable'}`;
     inputs=[['Market cap',fmt(price*shares,1)+'m'],['Net cash',fmt(netCash,1)+'m'],['Enterprise value',fmt(enterprise,1)+'m'],['TTM revenue',Number.isFinite(rev)?fmt(rev,1)+'m':'Unavailable'],['Revenue period',s.latest_period||'—'],['Source','Live market + SEC XBRL']];
     basis='Enterprise value is current market cap less the latest validated net-cash balance.';
   }else if(m==='EV/EBIT'){
     cur=Number.isFinite(op)&&op>0?enterprise/op:evEbit();
     formula=`EV/EBIT = Enterprise Value ÷ TTM operating income<br>${fmt(enterprise,1)}m ÷ ${Number.isFinite(op)?fmt(op,1)+'m':'Unavailable'} = ${Number.isFinite(cur)?cur.toFixed(2)+'x':'Unavailable'}`;
     inputs=[['Enterprise value',fmt(enterprise,1)+'m'],['TTM operating income',Number.isFinite(op)?fmt(op,1)+'m':'Unavailable'],['Period',s.latest_period||'—'],['Source','Live market + SEC XBRL']];
     basis='EBIT is explicitly proxied by operating income in this terminal.';
   }else{
     let f=Number(fwd.fcf), fy=Number(String(s.latest_period||'').slice(0,4))||D.years.at(-1)+1;
     cur=Number.isFinite(f)&&f>0?enterprise/f:evFcf();
     formula=`Forward EV/FCF = Enterprise Value ÷ FY${fy}E FCF<br>${fmt(enterprise,1)}m ÷ ${Number.isFinite(f)?fmt(f,1)+'m':'Unavailable'} = ${Number.isFinite(cur)?cur.toFixed(2)+'x':'Unavailable'}`;
     inputs=[['Enterprise value',fmt(enterprise,1)+'m'],[`FY${fy}E Revenue`,Number.isFinite(Number(fwd.revenue))?fmt(fwd.revenue,1)+'m':'Unavailable'],['Forecast OCF margin',Number.isFinite(Number(fwd.ocfMargin))?pct(fwd.ocfMargin):'Unavailable'],['Forecast OCF',Number.isFinite(Number(fwd.ocf))?fmt(fwd.ocf,1)+'m':'Unavailable'],['Forecast CapEx intensity',Number.isFinite(Number(fwd.capexIntensity))?pct(fwd.capexIntensity):'Unavailable'],['Forecast CapEx',Number.isFinite(Number(fwd.capex))?fmt(fwd.capex,1)+'m':'Unavailable'],[`FY${fy}E FCF`,Number.isFinite(f)?fmt(f,1)+'m':'Unavailable'],['Forecast source','ERT forward driver model']];
     basis='Forward EV/FCF uses forecast FCF, not TTM FCF.';
   }
   let a=(D.historicalMultiples[m]||[]).filter(Number.isFinite),hist=a.length?list([['5Y average',avg(a).toFixed(2)+'x'],['5Y median',med(a).toFixed(2)+'x'],['5Y low',Math.min(...a).toFixed(2)+'x'],['5Y high',Math.max(...a).toFixed(2)+'x']]):'<div class="sourcebox">Historical comparison unavailable.</div>';
   return specialInspector(m+` — ${Number.isFinite(cur)?cur.toFixed(2)+'x':'Unavailable'}`,`<span class="badge good">LATEST / LIVE-DERIVED</span><div class="formula">${formula}</div>${list(inputs)}<div class="sourcebox"><strong>Calculation basis:</strong> ${basis}</div>${hist}<div class="finding ${a.length&&Number.isFinite(cur)&&cur>avg(a)?'find-risk':'find-pos'}"><h4>So what?</h4><p>${a.length&&Number.isFinite(cur)?(cur>avg(a)?'Above its own historical average.':'Below its own historical average.'):'Review the formula and inputs above before interpreting the multiple.'}</p></div>`);
 }
 if(String(special).startsWith('rating:'))return ratingInspector(special.slice(7));
 if(String(special).startsWith('status:'))return statusInspector(special.slice(7));
 if(String(special).startsWith('wacc'))return waccInspector(special);
 if(special==='terminal')return terminalInspector();
 if(special==='fcfmargin')return specialInspector('5Y average FCF margin',`<div class="value tone-model">${pct(avg(fcfMargins()))}</div><p><strong>What is it?</strong> Free cash flow as a percentage of revenue, averaged across five fiscal years.</p>${spark(fcfMargins())}${list(D.years.map((y,i)=>[y,pct(fcfMargins()[i])]))}<div class="finding find-risk"><h4>Why it matters</h4><p>Using a multi-year margin can smooth one-off CapEx cycles, but it can also hide a structural change in investment intensity.</p></div>`);
 if(String(special).startsWith('driver:')){let k=special.split(':')[1];if(k==='revenue')return specialInspector('Revenue growth driver',`<p><strong>What is it?</strong> The year-by-year growth assumption used to build forecast revenue.</p><div class="formula">Forecast Revenueₜ = Revenueₜ₋₁ × (1 + growthₜ)</div><p><strong>Why it matters:</strong> Revenue is the top-line driver. With OCF margin and CapEx intensity held constant, higher revenue creates more OCF and FCF.</p><div class="finding find-risk"><h4>How to use it</h4><p>Edit Y1–Y5 directly or use Bear/Base/Bull. Every change flows through the driver DCF immediately.</p></div>`);if(k==='ocf')return specialInspector('OCF margin driver',`<p><strong>What is it?</strong> Operating cash flow as a percentage of revenue.</p><div class="formula">OCF = Revenue × OCF margin</div><p>It captures cash conversion before capital expenditure. Higher OCF margin raises FCF if CapEx intensity is unchanged.</p>`);return specialInspector('CapEx / Revenue driver',`<p><strong>What is it?</strong> Capital expenditure as a percentage of revenue.</p><div class="formula">CapEx = Revenue × CapEx intensity<br>FCF margin = OCF margin − CapEx / Revenue</div><p><strong>Why it matters to GOOG:</strong> AI/data-centre investment can depress near-term FCF while potentially supporting future growth.</p><div class="finding find-risk"><h4>Classification limitation</h4><p>Maintenance, growth and one-off CapEx are not precisely separated here because Alphabet does not disclose a full split. Do not invent one.</p></div>`)}
 if(special==='dcfresult')return specialInspector('DCF result — how the answer is built',`<p><strong>What is it?</strong> Present value of forecast FCF plus terminal value, adjusted for net cash, divided by shares.</p>${list([['Enterprise value',fmt(dcf().ev)+' USD million'],['Net cash',fmt(D.market.net_cash_m)+' USD million'],['Equity value',fmt(dcf().equity)+' USD million'],['Shares',fmt(D.market.shares_m)+' million'],['Fair value',money(dcf().ps)+'/share']])}<div class="finding find-risk"><h4>Stress-test it</h4><p>Change WACC, terminal growth or yearly FCF growth on the left. The result and sensitivity table recalculate immediately.</p></div>`);
 let r=by(special)||by('income.revenue'),pg=page(r[0]),unit=r[0].includes('eps')?'USD/share':r[0].includes('shares')?'million shares':'USD million',fy=D.years.at(-1),idx=D.years.length-1,filing=D.source?.filing||'#';
 return `<aside class="ins ${S.show?'mobileOpen':''}"><div class="ih"><strong>Evidence & Analysis Inspector</strong><div class="sp"></div><button class="btn" id="hide">Hide</button></div><div style="padding:12px"><h3>${r[1]}</h3><div class="sub">${unit}</div>${spark(r[2])}<div class="meta"><div><span>Cell ID</span><strong>${r[0]}.FY${fy}</strong></div><div><span>Latest annual value</span><strong>${fmt(last(r[2]),2)}</strong></div><div><span>5Y CAGR</span><strong>${isFinite(cagr(r[2]))?pct(cagr(r[2])):'—'}</strong></div><div><span>${fy} YoY</span><strong>${yy(r[2],idx)==null?'—':pct(yy(r[2],idx))}</strong></div><div><span>Form</span><strong>${D.source?.form||'10-K'} FY${D.source?.fy||fy}</strong></div><div><span>Filed</span><strong>${D.source?.filingDate||'—'}</strong></div></div><div class="finding find-pos"><h4>So what?</h4><p>${soWhat(r[0])}</p></div><div class="actions">${filing!=='#'?`<a class="btn primary" target="_blank" href="${filing}">Open filing</a>`:''}</div></div></aside>`;
}
function ratingInspector(name){let R=rating(),map={'Moat / competitive advantage':[R.moat,'ROIC vs WACC','Revenue durability','Operating margin','Balance-sheet strength','Brand/network effects'],'Business quality':[R.quality,'Operating margin','FCF generation','ROIC','Balance sheet','Earnings consistency'],'Growth':[R.growth,'Revenue growth','FCF growth','Cloud/AI opportunity','Consensus growth','Reinvestment'],'Financial health':[R.fin,'Net cash','Debt burden','Interest coverage','Liquidity','Cash generation'],'Capital allocation':[R.capital,'CapEx returns','Buybacks','SBC dilution','Acquisitions','Dividends'],'Valuation':[R.val,'DCF vs price','Reverse DCF','P/E history','EV/FCF history','Consensus expectations'],'Risk':[R.risk,'Regulation','AI competition','CapEx intensity','Valuation risk','Execution risk']};let a=map[name]||[3];let tone=name==='Valuation'?'tone-neg':name==='Risk'?'tone-watch':'tone-pos';return specialInspector(`${name} — ${a[0].toFixed(1)}/5`,`<div class="value ${tone}">${star(a[0])} ${a[0].toFixed(1)}/5</div><p><strong>Why this score?</strong> The rating is a research summary, not a raw fact. It combines the components below.</p>${list(a.slice(1).map((x,i)=>[x, i<2?'High weight':'Supporting']))}<div class="finding find-risk"><h4>Methodology</h4><p>Prototype score. Production version should expose exact weights, thresholds and every underlying calculation so the score can be reproduced.</p></div><div class="finding find-pos"><h4>What would change it?</h4><p>Click the underlying financial and valuation metrics elsewhere in the terminal to inspect source facts, trends and model impact.</p></div>`)}

function waccInspector(k){let W=wacc(),common=`<div class="formula">WACC = E/(D+E) × Cost of Equity + D/(D+E) × After-tax Cost of Debt</div>`;if(k==='wacc:rf')return specialInspector('Risk-free rate — '+pct(S.rf),`<p><strong>What is it?</strong> Baseline return assumed for a near-default-free USD investment. USD DCFs commonly benchmark this to long-dated US Treasuries.</p>${list([['Selected assumption',pct(S.rf)],['Reference instrument','US 10Y Treasury'],['Why it matters','Higher risk-free → higher WACC → lower DCF value']])}<div class="finding find-risk"><h4>Benchmark / source</h4><p>Connect to the U.S. Treasury daily par yield curve in production and display the exact as-of date. Do not silently hard-code a live yield.</p></div>`);if(k==='wacc:beta')return specialInspector('Beta — '+S.beta.toFixed(2),`<p><strong>What is it?</strong> Sensitivity of GOOG equity returns to the broad market. 1.0 ≈ market-like; above 1 = historically more sensitive.</p>${list([['Selected beta',S.beta.toFixed(2)],['Used in','Cost of equity = Rf + Beta × ERP'],['Impact','Higher beta → higher WACC → lower fair value']])}<div class="finding find-risk"><p>Production version should show provider, lookback period and frequency (for example 2Y weekly / 5Y monthly) plus an industry benchmark.</p></div>`);if(k==='wacc:erp')return specialInspector('Equity risk premium — '+S.erp.toFixed(2)+'%',`
<p><strong>What is it?</strong> The extra return investors require for owning US equities rather than a near-default-free USD investment.</p>
<h3>Why exactly ${S.erp.toFixed(2)}%?</h3>
<p>The selected 4.18% is intended to represent Aswath Damodaran / NYU Stern's <strong>US implied equity risk premium</strong> benchmark. It is not supposed to be a round-number ERT guess.</p>
<div class="formula">
Observed S&amp;P 500 price<br>
= present value of expected future shareholder cash flows<br>
discounted at the market-required equity return (r)<br><br>
Solve the valuation equation for <strong>r</strong><br>
then: <strong>Implied ERP = r − risk-free rate</strong>
</div>
<h3>So where does the implied equity return come from?</h3>
<p>It is <strong>solved from the market price</strong>. The calculation asks: “Given today's S&amp;P 500 level and the cash flows investors expect to receive, what discount rate makes those future cash flows equal today's index price?” That solved discount rate is the market-implied expected equity return.</p>
<h3>What inputs are required to reproduce 4.18%?</h3>
${list([
['1. Market price','S&P 500 index level on the benchmark date'],
['2. Near-term cash flows','Expected dividends + buybacks / shareholder distributions'],
['3. Near-term growth','Forecast growth in earnings / cash returned to shareholders'],
['4. Terminal growth','Long-run mature growth assumption'],
['5. Risk-free rate','Matching USD Treasury benchmark'],
['6. Solve for r','Discount rate that equates PV of expected cash flows to the observed index price'],
['7. Subtract Rf','r − risk-free rate = implied ERP']
])}
<div class="finding find-risk"><h4>Why I am not showing invented intermediate numbers</h4>
<p>The current prototype stores the 4.18% benchmark but does not yet store the full dated Damodaran worksheet inputs needed to reproduce it line-by-line. Therefore it must <strong>not</strong> invent an “8.63% implied return” or any S&amp;P cash-flow assumptions merely to make the explanation look complete.</p></div>
<h3>Why implied ERP rather than historical ERP?</h3>
<p>Historical ERP tells you what equities earned over bonds in the past. Implied ERP is forward-looking: it extracts the return premium embedded in today's market price and expected cash flows. For a current DCF discount rate, that is usually the more relevant benchmark.</p>
<h3>Why can the number be 4.18% rather than 4%, 5% or 10%?</h3>
<p>Because it is the <strong>output of the market-implied valuation equation</strong>, not a rating scale. If index price, expected distributions, growth expectations or Treasury yields change, the solved ERP changes as well. There is no requirement for it to be a round number.</p>
${list([
['Selected ERP',S.erp.toFixed(2)+'%'],
['Risk-free assumption',pct(S.rf)],
['Beta',S.beta.toFixed(2)],
['GOOG cost of equity',pct(W.coe)],
['GOOG WACC',pct(W.w)],
['Valuation impact','Higher ERP → higher cost of equity/WACC → lower fair value']
])}
<div class="sourcebox"><strong>Source framework:</strong> Aswath Damodaran / NYU Stern — implied equity risk premium methodology.<br><strong>Production requirement:</strong> store exact source URL, as-of date, published ERP and the underlying worksheet inputs so every intermediate number can be reproduced.</div>
`);if(k==='wacc:debt')return specialInspector('Alphabet debt & cost of debt — '+pct(S.cod),`<p><strong>What is it?</strong> Current borrowing cost used for the debt portion of WACC. Coupon, effective rate and current market YTM are not the same thing.</p>${list([['Selected pre-tax cost of debt',pct(S.cod)],['FY2024 commercial paper effective rate','4.4%'],['FY2024 long-term debt face value','$12.0bn'],['FY2024 long-term debt carrying value','$10.883bn'],['2016 notes','2.00% coupon · 2.23% effective · matures 2026'],['2020 notes','0.45%–2.25% coupons · mature 2025–2060']])}<div class="finding find-risk"><h4>Important</h4><p>The 4.4% input matches FY2024 commercial paper, not a weighted live YTM for all Alphabet bonds. Production should calculate/obtain current bond YTMs before treating this as market cost of debt.</p></div><div class="sourcebox">Source: Alphabet FY2024 10-K, Note 6 Debt, p.74.</div>`);if(k==='wacc:tax')return specialInspector('Tax rate — '+pct(S.tax),`<p><strong>What is it?</strong> Tax assumption used to convert pre-tax debt cost to after-tax debt cost.</p>${list([['Selected rate',pct(S.tax)],['FY2024 tax expense',fmt(last(by('income.tax')[2]))+'m'],['FY2024 pre-tax income',fmt(last(by('income.pretax')[2]))+'m'],['Simple effective rate',pct(last(by('income.tax')[2])/last(by('income.pretax')[2])*100)]])}<p>Use a normalized tax rate when a single year contains unusual tax items.</p>`);if(k==='wacc:weights')return specialInspector('Capital structure weights',`${list([['Market equity value',fmt(D.market.price*D.market.shares_m)+' USD million'],['Debt proxy',fmt(last(by('balance.long_debt')[2]))+' USD million'],['Equity weight',pct(W.ew*100)],['Debt weight',pct(W.dw*100)]])}<p>WACC uses market-value weights where possible. Debt definition must be consistent and traceable.</p>`);return specialInspector('WACC — '+pct(W.w),`<div class="value tone-model">${pct(W.w)}</div>${common}${list([['Risk-free',pct(S.rf)],['Beta',S.beta.toFixed(2)],['ERP',pct(S.erp)],['Cost of equity',pct(W.coe)],['Pre-tax debt cost',pct(S.cod)],['Tax rate',pct(S.tax)],['After-tax debt cost',pct(W.after)],['Equity / debt weights',pct(W.ew*100)+' / '+pct(W.dw*100)]])}<div class="finding find-risk"><h4>How to use it</h4><p>Click each input on the left. Every assumption should show definition, benchmark, source, date and valuation impact here.</p></div>`)}
function terminalInspector(){let W=wacc(),R=dcf(),vals=[2,2.5,3].map(g=>[g,dcf(S.g,W.w,g).ps]);return specialInspector('Terminal growth — '+pct(S.terminal),`
<p><strong>What is it?</strong> Perpetual nominal growth assumed after Year 5.</p>
<h3>Why exactly ${pct(S.terminal)}?</h3>

      const o1=0.60*latestOcf+0.40*histOcf, o5=0.45*latestOcf+0.55*histOcf;
      const c1=0.70*latestCap+0.30*histCap, c5=0.40*latestCap+0.60*histCap;
      const lerp=(a,b,i)=>a+(b-a)*(i/4);
      const base={rev:[0,1,2,3,4].map(i=>+lerp(r1,r5,i).toFixed(1)),ocf:[0,1,2,3,4].map(i=>+lerp(o1,o5,i).toFixed(1)),cap:[0,1,2,3,4].map(i=>+lerp(c1,c5,i).toFixed(1))};
      S.liveBaseDrivers=base;
      if(S.drvScenario!=='Custom'){S.drvRev=[...base.rev];S.drvOcf=[...base.ocf];S.drvCap=[...base.cap];S.drvScenario='Base';}
    }
    return true;
  }
  function apply(d){
    const m=d.market||{}, s=d.sec||{}, t=d.treasury||{}, c=d.consensus||{};
    const secOK=s?.validation?.ok===true;
    if(typeof D!=='undefined'){
      if(D.market){
        if(m.price!=null) D.market.price=m.price;
        if(m.asof) D.market.asof=m.asof;
        D.market.previous_close=m.previous_close??null; D.market.day_change=m.day_change??null; D.market.day_change_pct=m.day_change_pct??null; D.market.week52=m.week52||D.market.week52||null;
        if(secOK&&s.shares_m!=null) D.market.shares_m=s.shares_m;
        if(secOK&&s.net_cash_m!=null) D.market.net_cash_m=s.net_cash_m;
        D.market.model_asof=new Date().toISOString().slice(0,10);
      }
      if(Array.isArray(m.history)&&m.history.length>30){
        D.dates=m.history.map(x=>x.date);
        D.prices=m.history.map(x=>x.close);
      }
      if(D.consensus && c.available){
        D.consensus.status='LIVE';
        D.consensus.displaySource=c.source||c.provider||'Live analyst estimates provider';
        D.consensus.asof=c.asof||d.generated_at||null;
        D.consensus.provider=c.provider||null;
        D.consensus.forwardAnnual={
          revenue:Array.isArray(c.annual?.revenue)?c.annual.revenue:[],
          eps:Array.isArray(c.annual?.eps)?c.annual.eps:[]
        };
        D.consensus.forwardQuarterly={
          revenue:Array.isArray(c.quarterly?.revenue)?c.quarterly.revenue:[],
          eps:Array.isArray(c.quarterly?.eps)?c.quarterly.eps:[]
        };
        D.consensus.nextAnnual=c.next_annual||null;
        D.consensus.priceTargetAvailable=!!c.price_target_available;
        D.consensus.targetMean=c.price_target_available&&c.mean!=null?c.mean:null;
        D.consensus.targetMedian=c.price_target_available&&c.median!=null?c.median:null;
        D.consensus.targetLow=c.price_target_available&&c.low!=null?c.low:null;
        D.consensus.targetHigh=c.price_target_available&&c.high!=null?c.high:null;

        const yr=Number(c.next_annual?.year);
        const revEst=Number(c.next_annual?.revenue?.estimate);
        const epsEst=Number(c.next_annual?.eps?.estimate);
        const lastRev=Number(last(by('income.revenue')[2]));
        const lastEps=Number(last(by('income.eps')[2]));
        D.consensus.revenueGrowth=Number.isFinite(revEst)&&lastRev>0?((revEst/1e6)/lastRev-1)*100:null;
        D.consensus.epsGrowth=Number.isFinite(epsEst)&&lastEps>0?(epsEst/lastEps-1)*100:null;
      } else if(D.consensus && !c.isolated){
        D.consensus.status='UNAVAILABLE';
        D.consensus.displaySource='No reliable live consensus returned by configured data source';
        D.consensus.forwardAnnual={revenue:[],eps:[]};
        D.consensus.forwardQuarterly={revenue:[],eps:[]};
        D.consensus.nextAnnual=null;
        D.consensus.targetMean=D.consensus.targetMedian=D.consensus.targetLow=D.consensus.targetHigh=null;
      }
      D.live = d;
      if(secOK)syncAnnualSEC(s);
    }
    if(typeof S!=='undefined'){
      if(t.ten_year!=null) S.rf=t.ten_year;
      if(d.erp && d.erp.value!=null) S.erp=d.erp.value;
    }
    setPill('ertStatus','ok','LIVE · updated '+(d.generated_at||'now'));
    setPill('ertPrice','ok','Price '+fmtMoney(m.price)+' · '+(m.asof||''));
    setPill('ertSEC',secOK?'ok':'bad',(secOK?'DATA OK · ':'DATA WARNING · ')+(s.latest_form||'SEC')+' · '+(s.latest_period||''));
    setPill('ertTreasury',t.ten_year!=null?'ok':'warn','US 10Y '+(t.ten_year!=null?fmtPct(t.ten_year):'unavailable'));
    if(c.available){
      setPill('ertConsensus','ok','Consensus LIVE · '+(c.next_annual?.year||'forward')+'E');
    }else if(c.isolated && D?.consensus && ['LIVE','CACHED','STALE CACHE'].includes(D.consensus.status) && D.consensus.nextAnnual){
      setPill('ertConsensus','ok','Consensus '+D.consensus.status+' · Business Quant · FY'+D.consensus.nextAnnual.year+'E');
    }else{
      setPill('ertConsensus','warn','Consensus unavailable');
    }
  }

  function setPill(id,cls,text){
    const x=document.getElementById(id); if(!x)return;
    x.className='livepill '+cls;x.textContent=text;
  }

  function restoreStatus(d){
    if(!d)return;
    const m=d.market||{},s=d.sec||{},t=d.treasury||{},c=d.consensus||{},secOK=s?.validation?.ok===true;
    setPill('ertStatus','ok','LIVE · updated '+(d.generated_at||'now'));
    setPill('ertPrice','ok','Price '+fmtMoney(m.price)+' · '+(m.asof||''));
    setPill('ertSEC',secOK?'ok':'bad',(secOK?'DATA OK · ':'DATA WARNING · ')+(s.latest_form||'SEC')+' · '+(s.latest_period||''));
    setPill('ertTreasury',t.ten_year!=null?'ok':'warn','US 10Y '+(t.ten_year!=null?fmtPct(t.ten_year):'unavailable'));
    if(c.available){
      setPill('ertConsensus','ok','Consensus LIVE · '+(c.next_annual?.year||'forward')+'E');
    }else if(c.isolated && D?.consensus && ['LIVE','CACHED','STALE CACHE'].includes(D.consensus.status) && D.consensus.nextAnnual){
      setPill('ertConsensus','ok','Consensus '+D.consensus.status+' · Business Quant · FY'+D.consensus.nextAnnual.year+'E');
    }else{
      setPill('ertConsensus','warn','Consensus unavailable');
    }
  }

  function restoreFromMemory(){
    ensureBar();
    const d=(typeof D!=='undefined'&&D.live)?D.live:live.data;
    if(d){
      restoreStatus(d);
    }else{
      setPill('ertStatus','warn','Live data not loaded yet');
    }
    if(typeof D!=='undefined' && D.consensus && ['LIVE','CACHED','STALE CACHE'].includes(D.consensus.status) && D.consensus.nextAnnual){
      setPill('ertConsensus','ok','Consensus '+D.consensus.status+' · Business Quant · FY'+D.consensus.nextAnnual.year+'E');
    }
  }
  window.ERT_RESTORE_LIVE_BAR=restoreFromMemory;

  function ensureBar(){
    const a=document.getElementById('app');if(!a||document.getElementById('ertLiveBar'))return;
    const bar=document.createElement('div');bar.className='livebar';bar.id='ertLiveBar';
    bar.innerHTML='<span id="ertStatus" class="livepill warn">Live API not checked</span>'+
      '<span id="ertPrice" class="livepill">Price —</span>'+
      '<span id="ertSEC" class="livepill">SEC —</span>'+
      '<span id="ertTreasury" class="livepill">US 10Y —</span>'+
      '<span id="ertConsensus" class="livepill">Consensus —</span>'+
      '<button class="apiBtn" id="ertApi">⚙ API</button>'+
      '<button class="refreshBtn" id="ertLiveRefresh">↻ Refresh Live Data</button>';
    a.prepend(bar);
    document.getElementById('ertApi').onclick=configure;
    document.getElementById('ertLiveRefresh').onclick=refresh;
  }

  function financialPanel(){ return; /* disabled: TTM is not a primary Financial Statements block */

    const a=document.getElementById('app'); if(!a||!live.data||document.getElementById('ertLiveFinancials'))return;
    const p=(typeof S!=='undefined'&&S.page)||'';
    if(!['overview','financials','valuation','report'].includes(p))return;
    const s=live.data.sec||{},secOK=s?.validation?.ok===true;
    const sec=document.createElement('section');sec.className='card liveDataPanel';sec.id='ertLiveFinancials';
    sec.innerHTML='<h3>Latest live financial anchor '+(secOK?'· DATA VALIDATED':'· DATA WARNING')+'</h3>'+(!secOK?'<div class="finding find-risk"><strong>SEC normalization failed validation. DCF will not use these values.</strong><br>'+((s.validation?.warnings||[]).join('<br>')||'Unknown validation error')+'</div>':'')+'<div class="liveDataGrid">'+
      '<div class="card"><div class="sub">Revenue TTM</div><div class="value">'+fmtBn(s.revenue_ttm_m)+'</div><div class="small">'+(s.latest_period||'')+'</div></div>'+
      '<div class="card"><div class="sub">Net income TTM</div><div class="value">'+fmtBn(s.net_income_ttm_m)+'</div><div class="small">SEC XBRL</div></div>'+
      '<div class="card"><div class="sub">Operating cash flow TTM</div><div class="value">'+fmtBn(s.ocf_ttm_m)+'</div><div class="small">SEC XBRL</div></div>'+
      '<div class="card"><div class="sub">CapEx TTM</div><div class="value">'+fmtBn(s.capex_ttm_m)+'</div><div class="small">FCF '+fmtBn(s.fcf_ttm_m)+'</div></div>'+
      '</div><div class="sourcebox"><b>Live valuation anchor:</b> DCF uses latest TTM FCF, latest shares and latest net-cash/debt values where available. Source: '+(s.source||'SEC EDGAR')+'. Annual years: '+((s.annual?.years||[]).join(' → ')||'unavailable')+'.</div>';
    const bar=document.getElementById('ertLiveBar'); if(bar)bar.after(sec); else a.prepend(sec);
  }

  // Override DCF anchor functions only when live SEC data exists.
  const origBaseFcf = window.baseFcf;
  const origMarketCap = window.marketCap;
  const origWacc = window.wacc;
  const origDcf = window.dcf;

  if(typeof origBaseFcf==='function'){
    window.baseFcf=function(){
      const s=live.data&&live.data.sec;
      if(s?.validation?.ok && s.fcf_ttm_m!=null && S.basis==='reported') return s.fcf_ttm_m;
      if(s?.validation?.ok && s.revenue_ttm_m!=null && S.basis==='margin') return s.revenue_ttm_m * avg(fcfMargins())/100;
      return origBaseFcf();
    };
  }
  if(typeof origMarketCap==='function'){
    window.marketCap=function(){
      const s=live.data&&live.data.sec, m=live.data&&live.data.market;
      if(s?.validation?.ok&&s.shares_m!=null&&m&&m.price!=null) return s.shares_m*m.price;
      return origMarketCap();
    };
  }
  if(typeof origWacc==='function'){
    window.wacc=function(){
      const s=live.data&&live.data.sec;
      let W=origWacc();
      if(!s?.validation?.ok||s.debt_m==null)return W;
      let coe=S.rf+S.beta*S.erp, eq=marketCap(), debt=s.debt_m, ew=eq/(eq+debt),dw=1-ew,after=S.cod*(1-S.tax/100);
      return {w:S.waccOverride!==null&&S.waccOverride!==''&&Number.isFinite(Number(S.waccOverride))?Number(S.waccOverride):coe*ew+after*dw,calc:coe*ew+after*dw,coe,after,ew,dw,debt,eq};
    };
  }
  if(typeof origDcf==='function'){
    // DCF deliberately remains the forward driver-based model.
    // Live SEC data re-anchors the drivers and updates shares/net cash in D.market.
  }

  
  function liveFinancialStatements(){ return; /* disabled: TTM is valuation context only */

    const a=document.getElementById('app'); if(!a||!live.data||document.getElementById('ertLiveStatements'))return;
    const p=(typeof S!=='undefined'&&S.page)||'';
    if(p!=='financials')return;
    const s=live.data.sec||{}, I=s.income_ttm||{}, C=s.cashflow_ttm||{};
    const rows=[
      ['Revenues',I.revenue],
      ['Cost of revenues',I.cost_of_revenue],
      ['Research and development',I.research_and_development],
      ['Sales and marketing',I.sales_and_marketing],
      ['General and administrative',I.general_and_administrative],
      ['Income from operations',I.operating_income],
      ['Income before income taxes',I.pretax_income],
      ['Provision for income taxes',I.income_tax],
      ['Net income',I.net_income],
      ['Diluted EPS',I.diluted_eps,'eps']
    ];
    const sec=document.createElement('section');sec.className='card liveDataPanel';sec.id='ertLiveStatements';
    sec.innerHTML=`<h2>LIVE Financial Statements — latest SEC TTM</h2>
      <div class="sourcebox"><strong>Latest filing:</strong> ${s.latest_form||'—'} · period ${s.latest_period||'—'} · Source: ${s.source||'SEC EDGAR'}<br>
      <strong>Annual history:</strong> the table below is synchronised to the latest five complete SEC fiscal years when available. TTM remains a separate current valuation anchor.</div>
      <h3>Income statement — TTM</h3>
      <table class="ert-table"><thead><tr><th>Line item</th><th>TTM</th><th>Period</th><th>Status</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${r[0]}</td><td><strong>${r[1]==null?'Unavailable':(r[2]==='eps'?Number(r[1]).toFixed(2):fmtBn(r[1]))}</strong></td><td>${s.latest_period||'—'}</td><td>${r[1]==null?'Not mapped from SEC XBRL':'LIVE SEC'}</td></tr>`).join('')}
      </tbody></table>
      <h3 style="margin-top:16px">Cash flow — TTM</h3>
      <div class="liveDataGrid">
        <div class="card"><div class="sub">Operating cash flow</div><div class="value">${fmtBn(C.operating_cash_flow)}</div></div>
        <div class="card"><div class="sub">CapEx</div><div class="value">${fmtBn(C.capex)}</div></div>
        <div class="card"><div class="sub">Free cash flow</div><div class="value">${fmtBn(C.free_cash_flow)}</div></div>
        <div class="card"><div class="sub">Net cash</div><div class="value">${fmtBn(s.net_cash_m)}</div></div>
      </div>`;
    const lead=[...a.querySelectorAll('h1')].find(x=>/financial statements/i.test(x.textContent));
    if(lead) lead.parentNode.insertBefore(sec,lead.nextSibling.nextSibling); else a.prepend(sec);
  }

  function enhance(){ ensureBar(); financialPanel(); liveFinancialStatements(); }
  new MutationObserver(()=>setTimeout(enhance,0)).observe(document.getElementById('app'),{childList:true,subtree:true});
  setTimeout(()=>{
    enhance();
    if(configured()) refresh();
    else setPill('ertStatus','warn','Configure live API once: ⚙ API');
  },100);

  window.ERT_REFRESH_LIVE=refresh;
})();
</script>

<script id="ert-index5-financials-recovery">
(function(){
  const originalFinancials = window.financials;

  function secData(){
    return D.live?.sec || null;
  }
  function annualKeyMap(){
    return {
      'income.revenue':'revenue','income.cost':'cost','income.rnd':'rnd','income.sales':'sales','income.gna':'gna',
      'income.op':'op','income.pretax':'pretax','income.tax':'tax','income.net':'net','income.eps':'eps','income.shares':'diluted_shares',
      'cashflow.net':'net','cashflow.ocf':'ocf','cashflow.capex':'capex','cashflow.fcf':'fcf',
      'balance.cash':'cash','balance.market':'marketable','balance.long_debt':'debt','balance.equity':'equity','balance.assets':'assets'
    };
  }
  function qKeyMap(){
    return {
      'income.revenue':['income','revenue'],
      'income.cost':['income','cost'],
      'income.rnd':['income','rnd'],
      'income.sales':['income','sales'],
      'income.gna':['income','gna'],
      'income.op':['income','op'],
      'income.pretax':['income','pretax'],
      'income.tax':['income','tax'],
      'income.net':['income','net'],
      'income.eps':['income','eps'],
      'income.shares':['income','shares'],
      'cashflow.net':['cashflow','net'],
      'cashflow.ocf':['cashflow','ocf'],
      'cashflow.capex':['cashflow','capex'],
      'cashflow.fcf':['cashflow','fcf'],
      'balance.cash':['balance','cash'],
      'balance.market':['balance','marketable'],
      'balance.long_debt':['balance','debt'],
      'balance.equity':['balance','equity'],
      'balance.assets':['balance','assets']
    };
  }
  function qNo(x){ return Number(x?.q || String(x?.label||'').match(/Q([1-4])/)?.[1]); }
  function qYear(x){ return Number(x?.year || String(x?.period||'').slice(0,4)); }
  function qSeries(id){
    const m=qKeyMap()[id], s=secData();
    if(!m || !s?.quarterly) return [];
    return s.quarterly?.[m[0]]?.[m[1]] || [];
  }
  function qFact(id,year,q){
    return qSeries(id).find(x=>qYear(x)===year && qNo(x)===q && x.value!=null) || null;
  }
  function latestCurrentYear(){
    const s=secData(), p=String(s?.latest_period||'');
    const y=Number(p.slice(0,4));
    return Number.isFinite(y)&&y>0?y:Number(D.years.at(-1))+1;
  }
  function latestQuarter(year){
    const qs=qSeries('income.revenue').filter(x=>qYear(x)===year&&x.value!=null).map(qNo).filter(Number.isFinite);
    return qs.length?Math.max(...qs):0;
  }
  function isFlow(id){
    return id.startsWith('income.') || id.startsWith('cashflow.');
  }
  function sumToQuarter(id,year,n){
    if(!n)return null;
    if(id==='income.eps') return null;
    let total=0;
    for(let q=1;q<=n;q++){
      const x=qFact(id,year,q);
      if(!x)return null;
      total+=Number(x.value);
    }
    return total;
  }
  function ytdValue(id,year,n){
    if(!n)return null;
    if(id.startsWith('balance.')){
      return qFact(id,year,n)?.value ?? null;
    }
    return sumToQuarter(id,year,n);
  }
  function asAnnualValue(row,year){
    const idx=D.years.indexOf(year);
    return idx>=0 ? row[2][idx] : null;
  }
  function displayVal(id,v){
    if(v==null || !Number.isFinite(Number(v))) return '—';
    if(id==='income.eps') return Number(v).toFixed(2);
    return fmt(Number(v),2);
  }
  function annualYoy(row,i){
    if(i===0)return null;
    return yy(row[2],i);
  }

  function companyGuidance(id){
    const g=D.live?.guidance;
    if(!g?.available) return {value:'Not provided', note:'COMPANY GUIDANCE'};
    const v=g.metrics?.[id];
    return {value:v==null?'Not quantitatively guided':String(v), note:'COMPANY GUIDANCE'};
  }
  function streetConsensus(id,year){
    const c=D.consensus;
    if(!['LIVE','CACHED','STALE CACHE'].includes(c?.status)) return {value:'Unavailable', note:'ANALYST CONSENSUS'};
    if(id==='income.revenue'){
      const r=(c.forwardAnnual?.revenue||[]).find(x=>Number(x.period)===year && String(x.data_type).toLowerCase()==='estimate');
      if(r?.estimate!=null)return {value:'$'+(Number(r.estimate)/1e9).toFixed(1)+'bn', note:'ANALYST CONSENSUS'};
    }
    if(id==='income.eps'){
      const r=(c.forwardAnnual?.eps||[]).find(x=>Number(x.period)===year && String(x.data_type).toLowerCase()==='estimate');
      if(r?.estimate!=null)return {value:Number(r.estimate).toFixed(2), note:'ANALYST CONSENSUS'};
    }
    return {value:'—', note:'ANALYST CONSENSUS'};
  }
  function ertForecast(id,year,qn){
    let d;
    try{ d=dcf(); }catch(_e){ return null; }
    const first=d?.detail?.[0];
    if(!first)return null;

    if(id==='income.revenue' && first.revenue!=null) return first.revenue;
    if(id==='cashflow.fcf' && first.fcf!=null) return first.fcf;
    if(id==='cashflow.ocf' && first.revenue!=null && first.ocfMargin!=null) return first.revenue*first.ocfMargin/100;
    if(id==='cashflow.capex' && first.revenue!=null && first.capexIntensity!=null) return first.revenue*first.capexIntensity/100;

    // For selected income-statement lines, extend the current YTD ratio to ERT revenue.
    const ertRev=first.revenue;
    const ytdRev=ytdValue('income.revenue',year,qn);
    if(ertRev!=null && ytdRev>0){
      if(id==='income.op'){
        const v=ytdValue(id,year,qn); if(v!=null)return ertRev*(v/ytdRev);
      }
      if(id==='income.net'){
        const v=ytdValue(id,year,qn); if(v!=null)return ertRev*(v/ytdRev);
      }
      if(id==='income.eps'){
        const epsQ=qSeries('income.eps').filter(x=>qYear(x)===year&&qNo(x)<=qn&&x.value!=null);
        if(epsQ.length===qn)return epsQ.reduce((a,x)=>a+Number(x.value),0)/qn*4;
      }
    }
    return null;
  }
  function liveSnapshot(s){
    if(!s)return '';
    return `<div class="card finRecoverTop">
      <h3>Latest live financial snapshot <span class="badge good">${s?.validation?.ok?'SEC VALIDATED':'DATA WARNING'}</span></h3>
      <div class="finRecoverGrid">
        ${card('Revenue TTM',s.revenue_ttm_m==null?'—':'$'+(Number(s.revenue_ttm_m)/1000).toFixed(1)+'bn',s.latest_period||'')}
        ${card('Net income TTM',s.net_income_ttm_m==null?'—':'$'+(Number(s.net_income_ttm_m)/1000).toFixed(1)+'bn','SEC XBRL')}
        ${card('Operating cash flow TTM',s.ocf_ttm_m==null?'—':'$'+(Number(s.ocf_ttm_m)/1000).toFixed(1)+'bn','SEC XBRL')}
        ${card('CapEx TTM',s.capex_ttm_m==null?'—':'$'+(Number(s.capex_ttm_m)/1000).toFixed(1)+'bn','FCF '+(s.fcf_ttm_m==null?'—':'$'+(Number(s.fcf_ttm_m)/1000).toFixed(1)+'bn'))}
      </div>
      <div class="sourcebox"><strong>Valuation anchor:</strong> TTM remains a current valuation input only. It is not presented as FY${latestCurrentYear()}. Source: ${s.source||'SEC EDGAR companyfacts + submissions'}.</div>
    </div>`;
  }

  window.financials=function(){
    const s=secData();

<script id="ert-consensus-businessquant-v29">
(function(){
  const KEY='ert_consensus_GOOG_businessquant_v29';
  const MAX_AGE=24*60*60*1000;

  function workerBase(){
    try{
      const v=localStorage.getItem('ertApiBase');
      if(v && /^https?:\/\//.test(v)) return v.replace(/\/+$/,'');
    }catch(_e){}
    return 'https://ert-live-data.cmyukhk.workers.dev';
  }
  function readLocal(){
    try{
      const x=JSON.parse(localStorage.getItem(KEY)||'null');
      return x?.consensus?.available?x:null;
    }catch(_e){return null}
  }
  function saveLocal(c){
    try{localStorage.setItem(KEY,JSON.stringify({saved_at:Date.now(),consensus:c}))}catch(_e){}
  }
  function applyConsensus(c, localHit=false, stale=false){
    if(!c?.available)return false;
    D.live=D.live||{};
    D.live.consensus=c;
    D.consensus=D.consensus||{};
    D.consensus.status=stale?'STALE CACHE':localHit?'CACHED':'LIVE';
    D.consensus.displaySource=c.source||'Business Quant Analyst Estimates API';
    D.consensus.provider=c.provider||'Business Quant';
    D.consensus.asof=c.asof||null;
    D.consensus.forwardAnnual={
      revenue:Array.isArray(c.annual?.revenue)?c.annual.revenue:[],
      eps:Array.isArray(c.annual?.eps)?c.annual.eps:[]
    };
    D.consensus.forwardQuarterly={
      revenue:Array.isArray(c.quarterly?.revenue)?c.quarterly.revenue:[],
      eps:Array.isArray(c.quarterly?.eps)?c.quarterly.eps:[]
    };
    D.consensus.nextAnnual=c.next_annual||null;
    D.consensus.priceTargetAvailable=false;
    D.consensus.targetMean=D.consensus.targetMedian=D.consensus.targetLow=D.consensus.targetHigh=null;
    const r=Number(c.next_annual?.revenue?.estimate), e=Number(c.next_annual?.eps?.estimate);
    const lr=Number(last(by('income.revenue')[2])), le=Number(last(by('income.eps')[2]));
    D.consensus.revenueGrowth=Number.isFinite(r)&&lr>0?((r/1e6)/lr-1)*100:null;
    D.consensus.epsGrowth=Number.isFinite(e)&&le>0?(e/le-1)*100:null;
    D.consensus.analystCountAvailable=false;
    return true;
  }
  async function getConsensus(force=false){
    const old=readLocal();
    if(old && !force && Date.now()-old.saved_at<MAX_AGE){
      applyConsensus(old.consensus,true,false);
      return old.consensus;
    }
    try{
      const r=await fetch(workerBase()+'/api/consensus?ticker=GOOG',{cache:'no-store'});
      const j=await r.json(), c=j?.consensus;
      if(r.ok && j?.ok && c?.available){
        saveLocal(c); applyConsensus(c,false,!!c.cache?.stale); return c;
      }
      if(old){applyConsensus(old.consensus,true,true);return old.consensus}
      return c||null;
    }catch(_e){
      if(old){applyConsensus(old.consensus,true,true);return old.consensus}
      return null;
    }
  }
  window.ERTConsensusV29={getConsensus,applyConsensus,workerBase};
  window.addEventListener('load',async()=>{
    await getConsensus(false);
    try{render()}catch(_e){}
  },{once:true});
})();
</script>

<script id="ert30-core">
(function(){
 const av=a=>{const b=(a||[]).map(Number).filter(Number.isFinite);return b.length?b.reduce((x,y)=>x+y,0)/b.length:NaN};
 const sd=a=>{const b=(a||[]).map(Number).filter(Number.isFinite);if(b.length<2)return 0;const m=av(b);return Math.sqrt(b.reduce((s,x)=>s+(x-m)**2,0)/(b.length-1))};
 const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
 const fy0=()=>Number(D.years?.at(-1))||2025;

 const actualRev=()=>Number(last(by('income.revenue')[2]));
 const actualGrowth=()=>yy(by('income.revenue')[2],D.years.length-1);
 const actualOcf=()=>Number(last(by('cashflow.ocf')[2]))/actualRev()*100;
 const actualCap=()=>Number(last(by('cashflow.capex')[2]))/actualRev()*100;
 const hist=()=>{
   const r=by('income.revenue')[2],o=by('cashflow.ocf')[2],c=by('cashflow.capex')[2];
   return {
     ocf:D.years.map((_,i)=>Number(r[i])>0?Number(o[i])/Number(r[i])*100:null).filter(Number.isFinite),
     cap:D.years.map((_,i)=>Number(r[i])>0?Number(c[i])/Number(r[i])*100:null).filter(Number.isFinite)
   };
 };
 const bqGrowth=(field,y)=>{
   const x=ann('revenue',y),v=Number(x?.[field]),r=actualRev();
   return Number.isFinite(v)&&r>0?(v/1e6/r-1)*100:null;
 };
 function scenario(name){
   const base=S.liveBaseDrivers||{rev:[...S.drvRev],ocf:[...S.drvOcf],cap:[...S.drvCap]};
   if(name==='Base')return {rev:[...base.rev],ocf:[...base.ocf],cap:[...base.cap],meta:{name:'Base'}};
   if(name==='Custom')return {rev:[...S.drvRev],ocf:[...S.drvOcf],cap:[...S.drvCap],meta:{name:'Custom'}};
   const low=bqGrowth('low',fy0()+1),high=bqGrowth('high',fy0()+1),target=name==='Bear'?low:high;
   const h=hist(),ocfSpread=clamp(sd(h.ocf)*.5,.5,3),capSpread=clamp(sd(h.cap)*.5,.5,3);
   const baseY1=Number(base.rev[0]), ref=Number.isFinite(target)?target:baseY1+(name==='Bear'?-3:3), y1=(baseY1+ref)/2, spread=y1-baseY1;
   const fade=[1,.8125,.625,.4375,.25];
   return {
     rev:base.rev.map((x,i)=>+(Number(x)+spread*fade[i]).toFixed(1)),
     ocf:base.ocf.map((x,i)=>+(Number(x)+(name==='Bear'?-ocfSpread:ocfSpread)*fade[i]).toFixed(1)),
     cap:base.cap.map((x,i)=>+Math.max(0,Number(x)+(name==='Bear'?capSpread:-capSpread)*fade[i]).toFixed(1)),
     meta:{name,baseY1,streetLow:low,streetHigh:high,streetRef:ref,ocfSpread,capSpread}
   };
 }
 function setScenario(name){
   if(name!=='Custom'){const p=scenario(name);S.drvRev=[...p.rev];S.drvOcf=[...p.ocf];S.drvCap=[...p.cap];S.scenarioMeta=p.meta}
   S.drvScenario=name;S.sel='scenario:'+name;S.show=true;if(S.page==='valuation'&&typeof window.ERT43_REFRESH_VALUATION==='function')window.ERT43_REFRESH_VALUATION();else render();
 }
 window.ERT30={fy0,years,ann,actualRev,actualGrowth,actualOcf,actualCap,hist,bqGrowth,scenario,setScenario};
 const prior=window.render;
 window.render=function(){
   const r=prior.apply(this,arguments);
   setTimeout(()=>{
     document.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>setScenario(b.dataset.scenario));
     const reset=document.getElementById('resetDrivers');if(reset)reset.onclick=()=>setScenario('Base');
   },0);
   return r;
 };
})();
</script>

<script id="ert31-capex-guidance">
(function(){
  const fy0=()=>window.ERT30?.fy0?.()||Number(D.years?.at(-1))||2025;
  const years=()=>window.ERT30?.years?.()||[1,2,3,4,5].map(i=>fy0()+i);
  const MGMT={
    low2026:175000, high2026:185000, mid2026:180000,
    source2026:'Alphabet Q2 2026 earnings call — FY2026 CapEx guidance $175–185bn',
    source2027:'Alphabet 2026 investor update / Q2 2026 call — FY2027 exact CapEx guidance not verified in this build'
  };
  function capexM(i){
    const d=dcf()?.detail?.[i];
    return d?Number(d.revenue)*Number(d.capexIntensity)/100:NaN;
  }
  function guidanceStatus(i){
    const y=years()[i],c=capexM(i);
    if(y===2026){
      if(!Number.isFinite(c))return {label:'Unavailable',cls:'unknown31'};
      if(c<MGMT.low2026)return {label:'BELOW guidance',cls:'unknown31'};
      if(c>MGMT.high2026)return {label:'ABOVE guidance',cls:'unknown31'};
      return {label:'WITHIN guidance',cls:'mgmt31'};
    }
    if(y===2027){
      const prev=capexM(i-1);
      if(!Number.isFinite(c)||!Number.isFinite(prev))return {label:'Unavailable',cls:'unknown31'};
      return c>prev?{label:'Direction aligned ↑',cls:'mgmt31'}:{label:'NOT aligned',cls:'unknown31'};
    }
    return {label:'No management guidance',cls:'unknown31'};
  }
  function impliedIntensity(){
    const r=Number(dcf()?.detail?.[0]?.revenue);
    return Number.isFinite(r)&&r>0?MGMT.mid2026/r*100:NaN;
  }
  function reverseAudit(){
    const r=reverse(), hit=Number.isFinite(r)&&r>=49.95;
    return {value:r,hitUpper:hit,label:hit?'>50% / solver upper bound reached':pct(r)};
  }
  function gap(){
    const fv=Number(dcf()?.ps),px=Number(D.market.price);
    return Number.isFinite(fv)&&Number.isFinite(px)&&px!==0?(fv/px-1)*100:NaN;
  }
  window.ERT31={MGMT,fy0,years,capexM,guidanceStatus,impliedIntensity,reverseAudit,gap};
})();
</script>

<script id="ert32-core">
(function(){
 const avg=a=>{const b=(a||[]).map(Number).filter(Number.isFinite);return b.length?b.reduce((x,y)=>x+y,0)/b.length:NaN};
 const sd=a=>{const b=(a||[]).map(Number).filter(Number.isFinite);if(b.length<2)return 0;const m=avg(b);return Math.sqrt(b.reduce((s,x)=>s+(x-m)**2,0)/(b.length-1))};
 const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

 function w52(){
   const z=D.market?.week52;
   if(z?.high!=null&&z?.low!=null)return z;
   const ds=D.dates||[],ps=D.prices||[];
   if(!ps.length)return null;
   const end=Date.parse((ds.at(-1)||new Date().toISOString().slice(0,10))+'T00:00:00Z'),cut=end-365*86400000;
   const win=ps.map((v,i)=>({date:ds[i],close:Number(v)})).filter(x=>Number.isFinite(x.close)&&Date.parse((x.date||'')+'T00:00:00Z')>=cut);
   if(!win.length)return null;
   const hi=win.reduce((a,b)=>b.close>a.close?b:a),lo=win.reduce((a,b)=>b.close<a.close?b:a);
   return {high:hi.close,high_date:hi.date,low:lo.close,low_date:lo.date,range_start:win[0].date,range_end:win.at(-1).date,method:'Fallback: rolling 365-day closing high/low'};
 }
 function rangePos(){
   const z=w52(),p=Number(D.market.price);
   return z&&z.high>z.low?clamp((p-z.low)/(z.high-z.low)*100,0,100):NaN;
 }
 function actualSbcRatioSeries(){
   const r=by('income.revenue')[2],s=by('cashflow.sbc')[2]||[];
   return D.years.map((_,i)=>Number(r[i])>0&&Number.isFinite(Number(s[i]))?Number(s[i])/Number(r[i])*100:null).filter(Number.isFinite);
 }
 function sbcScenario(name=S.drvScenario){
   const a=actualSbcRatioSeries(),latest=a.at(-1),avg3=avg(a.slice(-3));
   if(!Number.isFinite(latest))return [0,0,0,0,0];
   const y1=.6*latest+.4*(Number.isFinite(avg3)?avg3:latest);
   const y5=Number.isFinite(avg3)?avg3:latest;
   const base=[0,1,2,3,4].map(i=>y1+(y5-y1)*(i/4));
   const spread=clamp(sd(a)*.5,.25,1.5),fade=[1,.8125,.625,.4375,.25];
   if(name==='Bear')return base.map((x,i)=>+(x+spread*fade[i]).toFixed(2));
   if(name==='Bull')return base.map((x,i)=>+Math.max(0,x-spread*fade[i]).toFixed(2));
   return base.map(x=>+x.toFixed(2));
 }
 function dcfAdjusted(){
   const W=wacc().w,t=S.terminal,ratios=sbcScenario(S.drvScenario),base=dcf(),detail=[];
   let pv=0,lastAdj=null;
   for(let i=0;i<base.detail.length;i++){
     const x=base.detail[i],sbc=x.revenue*ratios[i]/100,adj=x.fcf-sbc,df=x.df;
     pv+=adj*df;lastAdj=adj;
     detail.push({...x,sbcRatio:ratios[i],sbc,reportedFcf:x.fcf,adjustedFcf:adj,adjustedFcfMargin:adj/x.revenue*100,pvAdjusted:adj*df});
   }
   const spread=W/100-t/100;if(spread<=0||!Number.isFinite(lastAdj))return {ps:NaN,detail,pv,pvt:NaN,ev:NaN,equity:NaN,tvshare:NaN};
   const tv=lastAdj*(1+t/100)/spread,pvt=tv/Math.pow(1+W/100,5),ev=pv+pvt,equity=ev+D.market.net_cash_m;
   return {ps:equity/D.market.shares_m,detail,pv,pvt,ev,equity,tvshare:pvt/ev*100,sbcRatios:ratios};
 }
 function capexGuidanceScenario(name=S.drvScenario){
   return name==='Bear'?185000:name==='Bull'?175000:180000;
 }
 function guidedCapexY1(name=S.drvScenario){
   const p=ERT30?.scenario?.(name)||null;
   const revGrowth=Number(p?.rev?.[0]??S.drvRev[0]),rev0=Number(last(by('income.revenue')[2]));
   const rev1=rev0*(1+revGrowth/100),cap=capexGuidanceScenario(name);
   return rev1>0?cap/rev1*100:NaN;
 }
 function applyGuidedCapex(name=S.drvScenario){
   if(!['Bear','Base','Bull'].includes(name))return;
   const intensity=guidedCapexY1(name);
   if(Number.isFinite(intensity)){
     S.drvCap[0]=+intensity.toFixed(2);
     if(S.liveBaseDrivers&&name==='Base')S.liveBaseDrivers.cap[0]=+intensity.toFixed(2);
   }
 }
 window.ERT32={w52,rangePos,actualSbcRatioSeries,sbcScenario,dcfAdjusted,capexGuidanceScenario,guidedCapexY1,applyGuidedCapex};
})();
</script>
<script id="ert32-capex-fix">
(function(){
  // Upgrade the scenario setter: FY2026 CapEx is anchored to management range.
  const oldSet=ERT30.setScenario;

  // Correct FY2027 direction check: compare against management FY2026 baseline, not ERT's old FY2026 model.
