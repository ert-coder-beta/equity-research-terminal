<script id="ert34-capex-return">
(function(){
  const MG={
    guideLow:175000,
    guideMid:180000,
    guideHigh:185000,
    backlog:240000,
    backlogPeriod:'Q4 2025',
    capexSource:'Alphabet Q4 2025 earnings call',
    backlogSource:'Alphabet Q4 2025 earnings call',
    computeAllocation:'Just over half of FY2026 ML compute expected to go to Google Cloud',
    capacity:'Google Cloud described as operating in a tight supply environment'
  };

  function scenarioDrivers(name){
    const p=ERT30.scenario(name);
    const rev=[...p.rev],ocf=[...p.ocf],cap=[...p.cap];
    const rev0=Number(last(by('income.revenue')[2]));
    const rev1=rev0*(1+Number(rev[0])/100);
    const capex=name==='Bear'?MG.guideHigh:name==='Bull'?MG.guideLow:MG.guideMid;
    if(rev1>0)cap[0]=capex/rev1*100;
    return {rev,ocf,cap,capex};
  }
  function sbcRatios(name){
    if(name==='Custom' && Array.isArray(S.drvSbc))return [...S.drvSbc];
    return [...ERT32.sbcScenario(name)];
  }
  function dcfFrom(name){
    const x=scenarioDrivers(name),sr=sbcRatios(name),W=wacc().w,t=S.terminal;
    const start=Number(last(by('income.revenue')[2]));
    let rev=start,pv=0,lastAdj=null;
    const detail=[];
    for(let i=0;i<5;i++){
      rev*=1+x.rev[i]/100;
      const ocf=rev*x.ocf[i]/100;
      const capex=rev*x.cap[i]/100;
      const sbc=rev*sr[i]/100;
      const fcf=ocf-capex-sbc;
      const df=1/Math.pow(1+W/100,i+1);
      pv+=fcf*df;lastAdj=fcf;
      detail.push({year:ERT30.fy0()+i+1,revenue:rev,ocf,capex,sbc,fcf,df});
    }
    const spread=W/100-t/100;
    if(spread<=0)return {ps:NaN,detail,pv,pvt:NaN,ev:NaN,equity:NaN};
    const tv=lastAdj*(1+t/100)/spread,pvt=tv/Math.pow(1+W/100,5),ev=pv+pvt,equity=ev+D.market.net_cash_m;
    return {ps:equity/D.market.shares_m,detail,pv,pvt,ev,equity,capex2026:x.capex};
  }
  function incrementalCapex(name){
    return (name==='Bear'?MG.guideHigh:name==='Bull'?MG.guideLow:MG.guideMid)-Number(last(by('cashflow.capex')[2]));
  }

  // Present value factor for a constant incremental annual FCF beginning in FY2027 (year 2),
  // continuing through FY2030 and then terminalized using the same WACC/g.
  function extraFcfPvFactor(){
    const W=wacc().w/100,g=S.terminal/100;
    if(W<=g)return NaN;
    let factor=0;
    for(let yr=2;yr<=5;yr++)factor+=1/Math.pow(1+W,yr);
    factor+=(1+g)/(W-g)/Math.pow(1+W,5);
    return factor;
  }
  function marketImplied(name='Base'){
    const base=dcfFrom(name),shares=Number(D.market.shares_m),gapPerShare=Math.max(0,Number(D.market.price)-Number(base.ps));
    const gapEquity=gapPerShare*shares,factor=extraFcfPvFactor(),addFcf=factor>0?gapEquity/factor:NaN,inc=incrementalCapex(name);
    const ret=inc>0?addFcf/inc*100:NaN,payback=addFcf>0?inc/addFcf:NaN;
    return {base,gapPerShare,gapEquity,additionalAnnualFcf:addFcf,incrementalCapex:inc,returnPct:ret,paybackYears:payback,factor};
  }
  function fairValueAtReturn(retPct,name='Base'){
    const b=dcfFrom(name),inc=incrementalCapex(name),extra=inc*Number(retPct)/100,factor=extraFcfPvFactor();
    return b.ps+(extra*factor)/Number(D.market.shares_m);
  }
  function fmtBnM(v){return Number.isFinite(Number(v))?'$'+(Number(v)/1000).toFixed(1)+'bn':'—'}
  function fmtPct(v){return Number.isFinite(Number(v))?Number(v).toFixed(1)+'%':'—'}

  function scenarioRows(){
    return ['Bear','Base','Bull'].map(name=>{
      const m=marketImplied(name),fv=m.base.ps;
      return `<tr class="clickable" data-inspect="capexroi:scenario:${name}">
        <td><strong>${name}</strong></td>
        <td>${fmtBnM(m.base.capex2026)}</td>
        <td>${fmtBnM(m.incrementalCapex)}</td>
        <td class="capex34-implied">${fmtPct(m.returnPct)}</td>
        <td>${Number.isFinite(m.paybackYears)?m.paybackYears.toFixed(1)+' yrs':'—'}</td>
        <td>${money(fv)}</td>
      </tr>`;
    }).join('');
  }
  function moduleHtml(){
    const fy=ERT30.fy0(),actual=Number(last(by('cashflow.capex')[2])),base=marketImplied('Base'),baseD=base.base,rev1=Number(baseD.detail?.[0]?.revenue),capRatio=rev1>0?MG.guideMid/rev1*100:NaN;
    const sense=[5,10,15,20,25],vals=sense.map(r=>fairValueAtReturn(r,'Base'));
    return `<div class="card" style="margin-top:12px"><h3>AI / CapEx Investment Return Analysis</h3>
      <p>This section asks whether the extraordinary AI / Cloud investment can plausibly earn enough future cash return to bridge ERT's DCF and the market price. It does <strong>not</strong> assume management promised a specific ROI.</p>
      <div class="capex34-grid">
        <div class="capex34-kpi clickable" data-inspect="capexroi:guide"><span class="sub">FY2026 CapEx</span><div class="v">${fmtBnM(MG.guideMid)}</div><div class="capex34-fact">FACT · $175–185bn management guidance</div></div>
        <div class="capex34-kpi clickable" data-inspect="capexroi:incremental"><span class="sub">Incremental CapEx</span><div class="v">${fmtBnM(MG.guideMid-actual)}</div><div class="capex34-calc">CALCULATED · vs FY${fy} actual ${fmtBnM(actual)}</div></div>
        <div class="capex34-kpi clickable" data-inspect="capexroi:backlog"><span class="sub">Cloud backlog</span><div class="v">${fmtBnM(MG.backlog)}</div><div class="capex34-fact">FACT · ${MG.backlogPeriod}</div></div>
        <div class="capex34-kpi clickable" data-inspect="capexroi:ratio"><span class="sub">CapEx / ERT Revenue</span><div class="v">${fmtPct(capRatio)}</div><div class="capex34-calc">CALCULATED · $180bn ÷ FY2026E ERT revenue</div></div>
      </div>

      <h4>CapEx → Return Bridge</h4>
      <div class="capex34-bridge">
        <div class="capex34-step clickable" data-inspect="capexroi:actual"><div class="sub">FY${fy} actual CapEx</div><div class="value">${fmtBnM(actual)}</div><div class="capex34-fact">SEC FACT</div></div>
        <div class="capex34-arrow">→</div>
        <div class="capex34-step clickable" data-inspect="capexroi:guide"><div class="sub">FY2026 Base CapEx</div><div class="value">${fmtBnM(MG.guideMid)}</div><div class="capex34-fact">GUIDANCE MIDPOINT</div></div>
        <div class="capex34-arrow">→</div>
        <div class="capex34-step clickable" data-inspect="capexroi:incremental"><div class="sub">Incremental investment</div><div class="value">+${fmtBnM(MG.guideMid-actual)}</div><div class="capex34-calc">CALCULATED</div></div>
        <div class="capex34-arrow">→</div>
        <div class="capex34-step clickable" data-inspect="capexroi:market"><div class="sub">What must it produce?</div><div class="value">${fmtBnM(base.additionalAnnualFcf)}/yr</div><div class="capex34-implied">MARKET-IMPLIED MODEL OUTPUT</div></div>
      </div>

      <div class="tw"><table class="capex34-table"><thead><tr><th>Scenario</th><th>FY26 CapEx</th><th>Incremental CapEx</th><th>Required annual FCF return</th><th>Implied payback</th><th>Fair Value after SBC</th></tr></thead><tbody>${scenarioRows()}</tbody></table></div>

      <h4 style="margin-top:16px">What return does the market price require? — Base Case</h4>
      <div class="capex34-grid">
        <div class="capex34-kpi"><span class="sub">Current market price</span><div class="v">${money(D.market.price)}</div><div class="capex34-fact">MARKET FACT</div></div>
        <div class="capex34-kpi"><span class="sub">ERT Base Fair Value</span><div class="v">${money(baseD.ps)}</div><div class="capex34-calc">SBC-adjusted DCF</div></div>
        <div class="capex34-kpi"><span class="sub">Valuation gap</span><div class="v">${money(base.gapPerShare)}/share</div><div class="capex34-calc">CURRENT PRICE − ERT VALUE</div></div>
        <div class="capex34-kpi clickable" data-inspect="capexroi:market"><span class="sub">Required annual incremental FCF</span><div class="v">${fmtBnM(base.additionalAnnualFcf)}</div><div class="capex34-implied">${fmtPct(base.returnPct)} on incremental CapEx · payback ${Number.isFinite(base.paybackYears)?base.paybackYears.toFixed(1):'—'} yrs</div></div>
      </div>

      <h4>CapEx Payback Sensitivity — Base Case</h4>
      <div class="capex34-sense">
        <div class="head">Incremental FCF return</div>${sense.map(r=>`<div class="head">${r}%</div>`).join('')}
        <div>Fair value after SBC</div>${vals.map((v,i)=>`<div class="${v>=D.market.price?'pos':'neg'}">${money(v)}${v>=D.market.price?'<br><small>≥ market</small>':''}</div>`).join('')}
      </div>
      <div class="sourcebox"><strong>Market-implied methodology:</strong> solve the additional constant annual FCF beginning in FY2027 that, discounted at the current ERT WACC and terminal growth and terminalized after FY2030, closes the gap between ERT after-SBC fair value and the current share price. Required return = that annual FCF ÷ incremental FY2026 CapEx. This is a stylized reverse-valuation diagnostic, not a management forecast.</div>

      <div class="capex34-evidence" style="margin-top:12px">
        <div><h4 class="capex34-fact">Known / sourced</h4><p>FY2026 CapEx guidance: $175–185bn; Base uses $180bn midpoint. FY2025 actual CapEx: ${fmtBnM(actual)}. Google Cloud backlog was $240bn at Q4 2025. Management said AI investment was already translating into business performance, Cloud remained supply-constrained, and just over half of FY2026 ML compute was expected to support Cloud.</p></div>
        <div><h4 class="capex34-assume">Unknown / not promised</h4><p>Management did not promise a specific revenue uplift, FCF return, ROI percentage, payback period, or post-2026 CapEx normalisation date. Those outputs are ERT assumptions or market-implied calculations and are labelled accordingly.</p></div>
      </div>
    </div>`;
  }

  function inspectorHtml(k){
    const fy=ERT30.fy0(),actual=Number(last(by('cashflow.capex')[2]));
    if(k==='capexroi:guide')return specialInspector('FY2026 CapEx — management guidance',`<div class="traceFact"><b>FACT</b><br>Alphabet FY2026 CapEx guidance: $175–185bn.<br>ERT Base: $180bn midpoint.<br>Bear: $185bn · Bull: $175bn.</div><div class="sourcebox">${MG.capexSource}. This is a management spending range, not an ROI promise.</div>`);
    if(k==='capexroi:actual')return specialInspector(`FY${fy} actual CapEx`,`<div class="traceFact"><b>SEC FACT</b><br>${fmtBnM(actual)}</div>`);
    if(k==='capexroi:incremental')return specialInspector('Incremental CapEx — calculation',`<div class="traceCalc"><b>CALCULATED</b><br>$180.0bn FY2026 Base CapEx − ${fmtBnM(actual)} FY${fy} actual = <strong>${fmtBnM(MG.guideMid-actual)}</strong> incremental investment.</div>`);
    if(k==='capexroi:backlog')return specialInspector('Google Cloud backlog',`<div class="traceFact"><b>FACT</b><br>Q4 2025 Cloud backlog: $240bn.</div><div class="sourcebox">${MG.backlogSource}. Backlog is contracted performance obligations, not immediate revenue and not proof of a specific CapEx ROI.</div>`);
    if(k==='capexroi:ratio'){const b=marketImplied('Base'),r=b.base.detail[0].revenue;return specialInspector('FY2026 CapEx / Revenue',`<div class="traceCalc"><b>CALCULATED</b><br>$180.0bn ÷ ${fmtBnM(r)} FY2026E ERT revenue = <strong>${fmtPct(MG.guideMid/r*100)}</strong>.</div>`);}
    if(k==='capexroi:market'){const m=marketImplied('Base');return specialInspector('Market-implied return on incremental AI / Cloud CapEx',`<div class="traceFact"><b>MARKET FACT</b><br>Current price: ${money(D.market.price)}</div><div class="traceCalc"><b>ERT BASE</b><br>After-SBC DCF: ${money(m.base.ps)}<br>Gap: ${money(m.gapPerShare)}/share.</div><div class="traceAssume"><b>MARKET-IMPLIED — NOT MANAGEMENT GUIDANCE</b><br>Additional constant annual FCF required from FY2027 onward: ${fmtBnM(m.additionalAnnualFcf)}.<br>Implied annual FCF return on incremental FY2026 CapEx: ${fmtPct(m.returnPct)}.<br>Simple payback: ${Number.isFinite(m.paybackYears)?m.paybackYears.toFixed(1)+' years':'—'}.</div><div class="sourcebox">The incremental FCF is discounted using the same WACC / terminal growth as ERT and terminalized after FY2030. It answers “what would have to be true?” rather than “what will happen?”.</div>`);}
    if(k.startsWith('capexroi:scenario:')){const name=k.split(':').at(-1),m=marketImplied(name);return specialInspector(`${name} — AI / CapEx return scenario`,`<div class="traceFact"><b>FACT / GUIDANCE RANGE</b><br>FY2026 CapEx used: ${fmtBnM(m.base.capex2026)}.</div><div class="traceAssume"><b>ERT SCENARIO</b><br>Revenue / OCF / later CapEx / SBC assumptions come from the ${name} scenario engine.</div><div class="traceCalc"><b>CALCULATED</b><br>Incremental CapEx: ${fmtBnM(m.incrementalCapex)}<br>After-SBC Fair Value: ${money(m.base.ps)}.</div><div class="traceAssume"><b>MARKET-IMPLIED</b><br>Required annual FCF return: ${fmtPct(m.returnPct)}<br>Payback: ${Number.isFinite(m.paybackYears)?m.paybackYears.toFixed(1)+' years':'—'}.</div>`);}
    return null;
  }

  window.ERT34Capex={MG,scenarioDrivers,dcfFrom,marketImplied,fairValueAtReturn,moduleHtml,inspectorHtml};
})();
</script>
<script id="ert34-integration">
(function(){
  // Insert the previously-promised CapEx return analysis in the correct place:
  // Forecast Engine -> CapEx Return Analysis -> SBC valuation bridge.
  
  

  // CapEx ROI inspector.
  const oldIns=window.inspector;
  window.inspector=function(){
    const k=String(S.sel||'');
    if(k.startsWith('capexroi:'))return ERT34Capex.inspectorHtml(k)||oldIns();
    return oldIns();
  };

  // True same-page render stability: preserve .content scrollTop, not only window.scrollY.
  // This covers scenario switches, WACC/terminal commits, financial tabs and any other same-page render.
  const rawRender=window.render;
  let lastPage=S.page;
  window.render=function(){
    const oldPage=lastPage, c=document.querySelector('.content');
    const cTop=c?c.scrollTop:0, cLeft=c?c.scrollLeft:0, wx=window.scrollX,wy=window.scrollY;
    const result=rawRender.apply(this,arguments);
    const same=S.page===oldPage;
    lastPage=S.page;
    if(same)requestAnimationFrame(()=>{
      const nc=document.querySelector('.content');
      if(nc){nc.scrollTop=cTop;nc.scrollLeft=cLeft;}
      window.scrollTo(wx,wy);
    });
    return result;
  };

  // Inspector-only rendering. Evidence-cell clicks no longer rebuild the page.
  function updateInspectorOnly(){
    const work=document.getElementById('work');if(!work)return;
    work.querySelector('.res')?.remove();
    work.querySelector('.ins')?.remove();
    work.querySelector('#show')?.remove();
    if(S.show){
      work.classList.remove('inspectorCollapsed');
      const section=work.querySelector('.content');
      section.insertAdjacentHTML('afterend','<div class="res" id="res"></div>'+inspector());
    }else{
      work.classList.add('inspectorCollapsed');
      work.insertAdjacentHTML('beforeend',inspector());
    }
  }
  window.ERT34_UPDATE_INSPECTOR=updateInspectorOnly;

  // Capture inspector/row clicks before legacy handlers call full render().
  document.addEventListener('click',e=>{
    if(e.target.closest('input,select,textarea,button[data-page],button[data-tab],button[data-scenario]'))return;
    const t=e.target.closest('[data-inspect],[data-row]');
    if(!t)return;
    e.preventDefault();e.stopImmediatePropagation();
    S.sel=t.dataset.inspect||t.dataset.row;S.show=true;
    updateInspectorOnly();
  },true);
  document.addEventListener('click',e=>{
    if(e.target?.id==='hide'){
      e.preventDefault();e.stopImmediatePropagation();S.show=false;updateInspectorOnly();
    }else if(e.target?.id==='show'){
      e.preventDefault();e.stopImmediatePropagation();S.show=true;updateInspectorOnly();
    }
  },true);
})();
</script>

<script id="ert40-engine">
(function(){
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const mean=a=>{const x=(a||[]).map(Number).filter(Number.isFinite);return x.length?x.reduce((s,v)=>s+v,0)/x.length:NaN};
  const lerp=(a,b,t)=>a+(b-a)*t;
  const lastN=(a,n)=>a.slice(Math.max(0,a.length-n));
  const pct1=v=>Number.isFinite(Number(v))?Number(v).toFixed(1)+'%':'—';
  const mm=v=>Number.isFinite(Number(v))?'$'+fmt(Number(v),0)+'m':'—';
  const num1=v=>Number.isFinite(Number(v))?Number(v).toFixed(1):'';
  function fy0(){return Number(D.years?.at(-1))||2025}
  function detailedYears(){return [1,2,3,4,5].map(i=>fy0()+i)}

  function actualRatios(){
    const rev=by('income.revenue')[2]||[],ocf=by('cashflow.ocf')[2]||[],cap=by('cashflow.capex')[2]||[],sbc=by('cashflow.sbc')[2]||[];
    return {
      ocf:rev.map((r,i)=>Number(r)>0?Number(ocf[i])/Number(r)*100:null).filter(Number.isFinite),
      cap:rev.map((r,i)=>Number(r)>0?Number(cap[i])/Number(r)*100:null).filter(Number.isFinite),
      sbc:rev.map((r,i)=>Number(r)>0?Number(sbc[i])/Number(r)*100:null).filter(Number.isFinite)
    };
  }
  function streetRevenue(y,scenario='Base'){
    const a=D.consensus?.forwardAnnual?.revenue||[],x=a.find(z=>Number(z.period)===Number(y)&&String(z.data_type||'estimate').toLowerCase()==='estimate');
    if(!x)return null;
    if(scenario==='Bear'&&Number.isFinite(Number(x.low)))return Number(x.low)/1e6;
    if(scenario==='Bull'&&Number.isFinite(Number(x.high)))return Number(x.high)/1e6;
    return Number.isFinite(Number(x.estimate))?Number(x.estimate)/1e6:null;
  }
  function sbcScenario(name){
    const a=actualRatios().sbc,latest=a.at(-1),avg3=mean(lastN(a,3));
    const base0=Number.isFinite(latest)&&Number.isFinite(avg3)?0.6*latest+0.4*avg3:(Number.isFinite(latest)?latest:5.5);
    const end=clamp(mean(lastN(a,3)),4,6.5),base=[0,1,2,3,4].map(i=>lerp(base0,end,i/4));
    if(name==='Bear')return base.map(x=>x+.5);if(name==='Bull')return base.map(x=>Math.max(2,x-.5));
    if(name==='Custom'&&Array.isArray(S.drvSbc)&&S.drvSbc.length===5)return S.drvSbc.map(Number);
    return base;
  }
  function scenarioCore(name){
    const b=window.ERT30?.scenario?.(name==='Custom'?'Custom':name);
    return b||{rev:[...S.drvRev],ocf:[...S.drvOcf],cap:[...S.drvCap]};
  }
  function detailedDrivers(name='Base'){
    const years=detailedYears(),raw=scenarioCore(name),rev0=Number(last(by('income.revenue')[2]));
    const out={years,revGrowth:[],ocf:[],cap:[],sbc:[],revenues:[]};let prev=rev0;
    for(let i=0;i<5;i++){
      let growth,revenue;
      if(name==='Custom'){
        growth=Number(S.drvRev[i]);revenue=prev*(1+growth/100);
      }else{
        const sr=streetRevenue(years[i],name);
        if(Number.isFinite(sr)&&sr>0){revenue=sr;growth=prev>0?(revenue/prev-1)*100:Number(raw.rev[i]);}
        else{growth=Number(raw.rev[i]);revenue=prev*(1+growth/100);}
      }
      out.revGrowth.push(growth);out.revenues.push(revenue);prev=revenue;
    }
    if(name==='Custom'){
      out.ocf=(S.drvOcf||[]).slice(0,5).map(Number);out.cap=(S.drvCap||[]).slice(0,5).map(Number);out.sbc=sbcScenario('Custom');
    }else{
      out.ocf=raw.ocf.map(Number);out.sbc=sbcScenario(name);
      const cap26=name==='Bear'?185000:name==='Bull'?175000:180000,cap26Pct=cap26/out.revenues[0]*100;
      const fy30Target=name==='Bear'?22:name==='Bull'?15:18;
      out.cap=[0,1,2,3,4].map(i=>lerp(cap26Pct,fy30Target,i/4));
    }
    return out;
  }
  function longRunTargets(name='Base'){
    const a=actualRatios(),recentOcf=mean(lastN(a.ocf,3)),histCap=mean((a.cap||[]).slice(0,-1).slice(-4)),recentSbc=mean(lastN(a.sbc,3));
    const base={revGrowth:Math.max(Number(S.terminal)+1.5,4.5),ocf:Number.isFinite(recentOcf)?clamp(recentOcf,36,43):40,cap:Number.isFinite(histCap)?clamp(histCap+2,13,16):15,sbc:Number.isFinite(recentSbc)?clamp(recentSbc,4,6.5):5.5};
    if(name==='Bear')return {...base,revGrowth:Math.max(Number(S.terminal)+1,3.5),ocf:base.ocf-2,cap:base.cap+2,sbc:base.sbc+.5};
    if(name==='Bull')return {...base,revGrowth:base.revGrowth+1,ocf:base.ocf+2,cap:Math.max(10,base.cap-2),sbc:Math.max(2,base.sbc-.5)};
    if(name==='Custom'&&S.normTargets?.Custom)return {...S.normTargets.Custom};return base;
  }
  function ensureState(){
    if(!Array.isArray(S.drvSbc)||S.drvSbc.length!==5)S.drvSbc=sbcScenario('Base').map(x=>+x.toFixed(1));
    S.normTargets=S.normTargets||{};if(!S.normTargets.Custom)S.normTargets.Custom={...longRunTargets('Base')};
    S.normManual=S.normManual||{};if(!Array.isArray(S.normManual.Custom)||S.normManual.Custom.length!==5)S.normManual.Custom=null;
    if(typeof S.normOpen!=='boolean')S.normOpen=false;if(typeof S.normCustomManual!=='boolean')S.normCustomManual=false;if(typeof S.dcfBridgeOpen!=='boolean')S.dcfBridgeOpen=false;
  }
  function tenYearDrivers(name='Base'){
    ensureState();const first=detailedDrivers(name),target=longRunTargets(name);const years=[...first.years],revGrowth=[...first.revGrowth],ocf=[...first.ocf],cap=[...first.cap],sbc=[...first.sbc],revenues=[...first.revenues];let prev=revenues.at(-1);
    const manual=name==='Custom'&&S.normCustomManual&&Array.isArray(S.normManual.Custom)?S.normManual.Custom:null;
    for(let j=1;j<=5;j++){
      years.push(fy0()+5+j);const t=j/5,d=manual?manual[j-1]:{revGrowth:lerp(revGrowth[4],target.revGrowth,t),ocf:lerp(ocf[4],target.ocf,t),cap:lerp(cap[4],target.cap,t),sbc:lerp(sbc[4],target.sbc,t)};
      revGrowth.push(Number(d.revGrowth));ocf.push(Number(d.ocf));cap.push(Number(d.cap));sbc.push(Number(d.sbc));prev*=1+Number(d.revGrowth)/100;revenues.push(prev);
    }
    return {years,revGrowth,ocf,cap,sbc,revenues,target};
  }
  function dcfFromDrivers(drv,opts={}){
    const W=Number(opts.wacc??wacc().w),g=Number(opts.terminal??S.terminal),deductSbc=opts.deductSbc!==false;let pv=0,lastFcf=0;const detail=[];
    for(let i=0;i<10;i++){
      const revenue=Number(drv.revenues[i]),ocfM=revenue*Number(drv.ocf[i])/100,capM=revenue*Number(drv.cap[i])/100,sbcM=revenue*Number(drv.sbc[i])/100;
      const fcf=ocfM-capM-(deductSbc?sbcM:0),df=1/Math.pow(1+W/100,i+1),pvFcf=fcf*df;pv+=pvFcf;lastFcf=fcf;
      detail.push({year:drv.years[i],revenue,revGrowth:Number(drv.revGrowth[i]),ocfMargin:Number(drv.ocf[i]),capMargin:Number(drv.cap[i]),sbcMargin:Number(drv.sbc[i]),ocf:ocfM,capex:capM,sbc:sbcM,fcf,fcfMargin:fcf/revenue*100,df,pvFcf});
    }
    const spread=W/100-g/100;if(spread<=0)return {ps:NaN,detail,pv,pvt:NaN,ev:NaN,equity:NaN,tvshare:NaN,drivers:drv,wacc:W,terminal:g,deductSbc};
    const tv=lastFcf*(1+g/100)/spread,pvt=tv/Math.pow(1+W/100,10),ev=pv+pvt,equity=ev+Number(D.market.net_cash_m),ps=equity/Number(D.market.shares_m);
    return {ps,detail,pv,tv,pvt,ev,equity,tvshare:pvt/ev*100,drivers:drv,wacc:W,terminal:g,deductSbc};
  }
  function dcf10(name='Base',opts={}){return dcfFromDrivers(tenYearDrivers(name),opts)}
  function normalizedFcfCheck(name='Base'){
    const b=dcf10(name),fy5=b.detail[4],t=b.drivers.target,normMargin=t.ocf-t.cap-t.sbc,normFcf=fy5.revenue*normMargin/100,W=wacc().w/100,g=S.terminal/100;if(W<=g)return {ps:NaN};const tv=normFcf*(1+g)/(W-g),pv=tv/Math.pow(1+W,5),equity=pv+Number(D.market.net_cash_m);return {ps:equity/Number(D.market.shares_m),normMargin,normFcf};
  }
  function forwardEarningsCheck(name='Base'){
    const year=fy0()+2,arr=D.consensus?.forwardAnnual?.eps||[],x=arr.find(z=>Number(z.period)===year&&String(z.data_type||'estimate').toLowerCase()==='estimate');let e=x&&Number.isFinite(Number(x.estimate))?Number(x.estimate):null;
    if(!Number.isFinite(e)){const eps0=Number(last(by('income.eps')[2])),revg=detailedDrivers(name).revGrowth.slice(0,2);e=eps0*Math.pow(1+mean(revg)/100,2)}const multiple=name==='Bear'?18:name==='Bull'?24:22;return {ps:e*multiple,eps:e,multiple,year};
  }
  function evFcfCheck(name='Base'){
    const b=dcf10(name),y2=b.detail[1],multiple=name==='Bear'?16:name==='Bull'?22:19;if(!y2||!Number.isFinite(y2.fcf)||y2.fcf<=0)return {ps:NaN,fcf:y2?.fcf,multiple,year:y2?.year,valid:false};const enterprise=y2.fcf*multiple,equity=enterprise+Number(D.market.net_cash_m),ps=equity/Number(D.market.shares_m);return {ps,fcf:y2.fcf,multiple,year:y2.year,valid:Number.isFinite(ps)&&ps>1&&ps<5000};
  }
  function rangeStatus(v,base){if(!Number.isFinite(v)||!Number.isFinite(base)||base===0)return ['UNAVAILABLE','ert40-warn'];const d=Math.abs(v/base-1)*100;return d<=20?['SUPPORTIVE','ert40-support']:d<=35?['CHECK','ert40-warn']:['OUTLIER','ert40-outlier']}
  function agreement(name='Base'){const primary=dcf10(name).ps,vals=[normalizedFcfCheck(name).ps,forwardEarningsCheck(name).ps,evFcfCheck(name).ps].filter(Number.isFinite),diffs=vals.map(v=>Math.abs(v/primary-1)*100),supportive=diffs.filter(x=>x<=20).length,outliers=diffs.filter(x=>x>35).length;return {label:outliers>=2?'LOW':supportive>=2?'HIGH':'MEDIUM',supportive,outliers,diffs}}
  function valuationSummary(){const bear=dcf10('Bear').ps,base=dcf10('Base').ps,bull=dcf10('Bull').ps,ag=agreement('Base'),width=base>0?(bull-bear)/base*100:999,confidence=ag.label==='HIGH'&&width<55?'MEDIUM-HIGH':ag.label==='LOW'||width>90?'LOW':'MEDIUM';return {bear,base,bull,market:Number(D.market.price),confidence,agreement:ag}}
  function copyToCustom(from){ensureState();const d=detailedDrivers(from),t=longRunTargets(from);S.drvRev=d.revGrowth.map(x=>+Number(x).toFixed(1));S.drvOcf=d.ocf.map(x=>+Number(x).toFixed(1));S.drvCap=d.cap.map(x=>+Number(x).toFixed(1));S.drvSbc=d.sbc.map(x=>+Number(x).toFixed(1));S.normTargets.Custom={...t};S.normManual.Custom=null;S.normCustomManual=false;S.drvScenario='Custom'}
  function enableManualNormalisation(){ensureState();if(S.drvScenario!=='Custom')copyToCustom(S.drvScenario);const d=tenYearDrivers('Custom');S.normManual.Custom=[5,6,7,8,9].map(i=>({revGrowth:+d.revGrowth[i].toFixed(1),ocf:+d.ocf[i].toFixed(1),cap:+d.cap[i].toFixed(1),sbc:+d.sbc[i].toFixed(1)}));S.normCustomManual=true;S.normOpen=true}
  function shiftedDrivers(kind,shift){
    const d=tenYearDrivers('Base'),x={years:[...d.years],revGrowth:[...d.revGrowth],ocf:[...d.ocf],cap:[...d.cap],sbc:[...d.sbc],revenues:[...d.revenues],target:{...d.target}};
    if(kind==='revenue'){x.revGrowth=x.revGrowth.map(v=>v+shift);let p=Number(last(by('income.revenue')[2]));x.revenues=x.revGrowth.map(g=>{p*=1+g/100;return p})}
    if(kind==='ocf')x.ocf=x.ocf.map(v=>v+shift);
    if(kind==='cap')x.cap=x.cap.map(v=>Math.max(0,v-shift));
    return x;
  }
  function solveShift(kind){
    const target=Number(D.market.price),ranges={revenue:[-10,35],ocf:[-20,35],cap:[-5,30]},[lo0,hi0]=ranges[kind];let lo=lo0,hi=hi0;
    const val=s=>dcfFromDrivers(shiftedDrivers(kind,s)).ps;
    const vlo=val(lo),vhi=val(hi);if(!Number.isFinite(vlo)||!Number.isFinite(vhi)||target<Math.min(vlo,vhi)||target>Math.max(vlo,vhi))return {kind,shift:null,ps:null,reachable:false};
    for(let i=0;i<80;i++){const m=(lo+hi)/2,v=val(m);if(v<target)lo=m;else hi=m}
    const shift=(lo+hi)/2,drv=shiftedDrivers(kind,shift),r=dcfFromDrivers(drv);return {kind,shift,ps:r.ps,reachable:true,drivers:drv};
  }
  function reverseDrivers(){return {revenue:solveShift('revenue'),ocf:solveShift('ocf'),cap:solveShift('cap')}}
  ensureState();
  window.ERT40={fy0,detailedYears,actualRatios,streetRevenue,detailedDrivers,longRunTargets,tenYearDrivers,dcfFromDrivers,dcf10,normalizedFcfCheck,forwardEarningsCheck,evFcfCheck,rangeStatus,valuationSummary,copyToCustom,enableManualNormalisation,reverseDrivers,agreement,pct1,mm,num1};
})();
</script>
<script id="ert40-ui">

g>FY${x.year}</strong></td><td>${fmt(x.revenue,0)}m</td><td>${pct(x.ocfMargin)}</td><td>${fmt(x.capex,0)}m</td><td>${fmt(x.sbc,0)}m</td><td>${fmt(x.fcf,0)}m</td><td>${x.df.toFixed(4)}</td><td>${fmt(x.pvFcf,0)}m</td></tr>`).join('')}</tbody></table></div></div></div>`;
  }
  function reverse(){
    const base=ERT40.dcf10('Base'),z=ERT40.reverseDrivers(),r5=base.detail[4],fmtReq=(x,kind)=>{if(!x.reachable)return '<span class="ert40-status ert40-outlier">OUTSIDE SOLVER RANGE</span>';if(kind==='revenue')return `<div class="v ert40-implied">+${x.shift.toFixed(1)}ppt / yr</div><div class="small">FY${r5.year} growth ${pct(x.drivers.revGrowth[4])}</div>`;if(kind==='ocf')return `<div class="v ert40-implied">+${x.shift.toFixed(1)}ppt</div><div class="small">FY${r5.year} OCF margin ${pct(x.drivers.ocf[4])}</div>`;return `<div class="v ert40-implied">−${x.shift.toFixed(1)}ppt</div><div class="small">FY${r5.year} CapEx/Revenue ${pct(x.drivers.cap[4])}</div>`};
    return `<div class="card"><h3 class="clickable" data-inspect="v40:reverse">Reverse DCF — what does ${money(D.market.price)} require?</h3><div class="small">One driver at a time; WACC ${pct(wacc().w)} and terminal growth ${pct(S.terminal)} held fixed. MARKET-IMPLIED — NOT MANAGEMENT GUIDANCE.</div><div class="ert40-reverse" style="margin-top:10px"><div class="head"><strong>Driver</strong><div class="small">ERT Base → market hurdle</div></div><div><strong>Revenue growth</strong><div class="small">Base FY${r5.year} ${pct(r5.revGrowth)}</div>${fmtReq(z.revenue,'revenue')}</div><div><strong>OCF margin</strong><div class="small">Base FY${r5.year} ${pct(r5.ocfMargin)}</div>${fmtReq(z.ocf,'ocf')}</div><div><strong>CapEx normalisation</strong><div class="small">Base FY${r5.year} ${pct(r5.capMargin)}</div>${fmtReq(z.cap,'cap')}</div></div></div>`;
  }
  function cross(){
    const base=ERT40.dcf10('Base'),n=ERT40.normalizedFcfCheck('Base'),p=ERT40.forwardEarningsCheck('Base'),e=ERT40.evFcfCheck('Base'),one=(label,obj,key)=>{const v=obj.ps,[st,cls]=ERT40.rangeStatus(v,base.ps);return `<div class="clickable" data-inspect="${key}"><strong>${label}</strong><div class="v">${Number.isFinite(v)?money(v):'CHECK DATA'}</div><span class="ert40-status ${Number.isFinite(v)?cls:'ert40-warn'}">${Number.isFinite(v)?st:'UNAVAILABLE'}</span></div>`};
    return `<div class="card"><h3>Independent Cross-Checks</h3><div class="small">These challenge the primary 10Y DCF. They are not averaged into ERT Base Fair Value.</div><div class="ert40-cross" style="margin-top:9px"><div class="head"><strong>Primary</strong><div class="v">${money(base.ps)}</div><span class="ert40-status ert40-support">10Y DCF</span></div>${one('Normalised FCF DCF',n,'v40:norm')}${one('Forward Earnings',p,'v40:pe')}${one('EV / FCF',e,'v40:evfcf')}</div></div>`;
  }
  function page(){return `<h1>Valuation Studio</h1><div class="lead">One 10-year DCF engine. Forecast first; valuation second. Detailed evidence stays in the Inspector.</div>${summary()}<div class="grid" style="gap:12px">${forecast()}${dcfSection()}${reverse()}${cross()}</div>`}
  window.ERT40UI={page,summary,forecast,normalisation,dcfSection,reverse,cross};
})();
</script>
<script id="ert40-integrate">
(function(){
  /* Valuation is rendered directly by the canonical valuation() function. No valuation override lives here. */
  const oldOverview=window.overview;
  window.overview=function(){
    let x=oldOverview(),s=ERT40.valuationSummary(),base=s.base,bear=s.bear,bull=s.bull;
    x=x.replace(/<div class="sub">Base fair value — after SBC<\/div><div class="value [^"]*">[^<]*<\/div><div class="small">Primary · OCF − CapEx − SBC<\/div>/,
      `<div class="sub">ERT Primary Fair Value</div><div class="value ${base>=D.market.price?'pos':'neg'}">${money(base)}</div><div class="delta33 ${base>=D.market.price?'pos':'neg'}">${base>=D.market.price?'▲':'▼'} ${((base/D.market.price-1)*100).toFixed(1)}% vs current price</div><div class="small">10-Year Explicit DCF · range ${money(bear)}–${money(bull)}</div>`);
    x=x.replace('<div class="lead">30-second answer: is GOOG worth deeper research?</div>',`<div class="lead">30-second answer: is GOOG worth deeper research?</div><div class="sourcebox"><strong>ERT valuation:</strong> ${money(base)} central fair value · ${money(bear)}–${money(bull)} Bear–Bull range · confidence ${s.confidence}. Primary method: 10-Year Explicit DCF.</div>`);return x;
  };
  const oldIns=window.inspector;
  window.inspector=function(){
    const k=String(S.sel||'');
    if(k==='v40:dcf10'){
      const sc=['Bear','Base','Bull','Custom'].includes(S.drvScenario)?S.drvScenario:'Base',b=ERT40.dcf10(sc),before=ERT40.dcf10(sc,{deductSbc:false});
      return specialInspector(`10-Year Explicit DCF — ${sc}`,`<div class="traceFact"><b>STRUCTURE</b><br>FY${b.detail[0].year}–FY${b.detail[4].year} detailed forecast<br>FY${b.detail[5].year}–FY${b.detail[9].year} explicit normalisation<br>Terminal Value begins after FY${b.detail[9].year}</div><div class="traceCalc"><b>CALCULATION</b><br>PV explicit FCF ${ERT40.mm(b.pv)}<br>PV Terminal Value ${ERT40.mm(b.pvt)}<br>Enterprise Value ${ERT40.mm(b.ev)}<br>+ Net cash ${ERT40.mm(D.market.net_cash_m)}<br>Equity Value ${ERT40.mm(b.equity)}<br>÷ ${fmt(D.market.shares_m,0)}m diluted shares<br><strong>Fair Value ${money(b.ps)}/share</strong></div><div class="traceAssume"><b>SBC TREATMENT</b><br>After-SBC economic FV ${money(b.ps)}<br>Before-SBC reference ${money(before.ps)}<br>SBC is deducted once from FCF; there is no second full dilution penalty.</div>`);
    }
    if(k==='v40:revenue'){const d=ERT40.tenYearDrivers('Base');return specialInspector('Revenue growth — Base',`<div class="traceFact"><b>STREET / FACT ANCHOR</b><br>FY${d.years[0]}–FY${d.years[4]} uses Business Quant annual Revenue estimates where available, with SEC actual revenue as the starting point.</div><div class="traceAssume"><b>FY${d.years[5]}–FY${d.years[9]}</b><br>ERT fades growth toward ${ERT40.pct1(d.target.revGrowth)} before terminal growth ${ERT40.pct1(S.terminal)}.</div>`)}
    if(k==='v40:ocf'){const d=ERT40.tenYearDrivers('Base');return specialInspector('OCF margin — Base',`<div class="traceFact"><b>HISTORICAL ANCHOR</b><br>SEC OCF / Revenue history.</div><div class="traceAssume"><b>LONG-RUN TARGET</b><br>${ERT40.pct1(d.target.ocf)} · ERT assumption.</div><div class="traceCalc"><b>VALUATION EFFECT</b><br>Higher OCF margin → higher economic FCF → higher fair value, all else equal.</div>`)}
    if(k==='v40:capex'){const d=ERT40.tenYearDrivers('Base');return specialInspector('CapEx / Revenue — Base',`<div class="traceFact"><b>MANAGEMENT GUIDANCE</b><br>FY${d.years[0]} CapEx range $175–185bn; Base uses $180bn midpoint.</div><div class="traceAssume"><b>ERT NORMALISATION</b><br>FY${d.years[1]} onward is an ERT assumption, not management guidance. Base FY${d.years[4]} ${ERT40.pct1(d.cap[4])}; long-run ${ERT40.pct1(d.target.cap)}.</div><div class="traceCalc"><b>VALUATION EFFECT</b><br>Higher CapEx → lower FCF → lower fair value, all else equal.</div>`)}
    if(k==='v40:sbc'){const d=ERT40.tenYearDrivers('Base');return specialInspector('SBC / Revenue — Base',`<div class="traceFact"><b>SEC HISTORY</b><br>Historical SBC / Revenue is the anchor.</div><div class="traceAssume"><b>ERT NORMALISATION</b><br>Long-run target ${ERT40.pct1(d.target.sbc)}.</div><div class="traceCalc"><b>ECONOMIC FCF</b><br>OCF − CapEx − SBC. SBC is not deducted a second time as a full dilution penalty.</div>`)}
    if(k==='v40:reverse'){const z=ERT40.reverseDrivers();return specialInspector('Reverse DCF — market-implied hurdles',`<div class="traceFact"><b>MARKET PRICE</b><br>${money(D.market.price)}/share</div><div class="traceAssume"><b>FIXED</b><br>WACC ${pct(wacc().w)}<br>Terminal growth ${pct(S.terminal)}</div><div class="traceCalc"><b>ONE DRIVER AT A TIME</b><br>Revenue growth uplift: ${z.revenue.reachable?z.revenue.shift.toFixed(1)+'ppt/year':'outside solver range'}<br>OCF margin uplift: ${z.ocf.reachable?z.ocf.shift.toFixed(1)+'ppt':'outside solver range'}<br>CapEx-intensity reduction: ${z.cap.reachable?z.cap.shift.toFixed(1)+'ppt':'outside solver range'}</div><div class="sourcebox">MARKET-IMPLIED — NOT MANAGEMENT GUIDANCE. The solver changes one driver at a time; it does not claim these outcomes will occur.</div>`)}
    if(k==='v40:norm'){const n=ERT40.normalizedFcfCheck('Base');return specialInspector('Normalised FCF DCF — cross-check',`<div class="traceAssume"><b>CROSS-CHECK</b><br>Normalised FCF margin ${ERT40.pct1(n.normMargin)}<br>Indicated fair value ${money(n.ps)}</div><div class="sourcebox">Independent challenge to the 10Y DCF; not averaged into Base.</div>`)}
    if(k==='v40:pe'){const z=ERT40.forwardEarningsCheck('Base');return specialInspector('Forward Earnings — cross-check',`<div class="traceFact"><b>FY${z.year}E EPS</b><br>${Number.isFinite(z.eps)?z.eps.toFixed(2):'Unavailable'}</div><div class="traceAssume"><b>ERT P/E</b><br>${z.multiple.toFixed(0)}x</div><div class="traceCalc"><b>INDICATION</b><br>${money(z.ps)}/share</div>`)}
    if(k==='v40:evfcf'){const z=ERT40.evFcfCheck('Base');return specialInspector('EV / FCF — cross-check',`<div class="traceCalc"><b>FY${z.year||'—'}E ECONOMIC FCF</b><br>${Number.isFinite(z.fcf)?ERT40.mm(z.fcf):'Unavailable'}</div><div class="traceAssume"><b>ERT EV/FCF</b><br>${z.multiple.toFixed(0)}x</div><div class="traceCalc"><b>INDICATION</b><br>${Number.isFinite(z.ps)?money(z.ps):'CHECK DATA / UNAVAILABLE'}</div>`)}
    return oldIns();
  };
  function refresh(){if(typeof window.ERT43_REFRESH_VALUATION==='function')window.ERT43_REFRESH_VALUATION();else render()}
  document.addEventListener('click',e=>{
    if(S.page!=='valuation')return;
    if(e.target?.id==='copySelected40'){e.preventDefault();e.stopImmediatePropagation();ERT40.copyToCustom(S.drvScenario);refresh();return}
    if(e.target?.id==='normToggle'){e.preventDefault();e.stopImmediatePropagation();S.normOpen=!S.normOpen;refresh();return}
    if(e.target?.id==='normManual'){e.preventDefault();e.stopImmediatePropagation();if(S.normCustomManual){S.normCustomManual=false}else{ERT40.enableManualNormalisation()}refresh();return}
    if(e.target?.id==='dcfBridgeToggle'){e.preventDefault();e.stopImmediatePropagation();S.dcfBridgeOpen=!S.dcfBridgeOpen;refresh();return}
  },true);
  document.addEventListener('focusin',e=>{if(S.page==='valuation'){const el=e.target.closest('[data-norm]');if(el)el.dataset.start=el.value}},true);
  document.addEventListener('keydown',e=>{if(S.page!=='valuation')return;const el=e.target.closest('[data-norm]');if(!el)return;if(e.key==='Enter'){e.preventDefault();el.blur()}if(e.key==='Escape'){e.preventDefault();el.value=el.dataset.start??el.value;el.blur()}},true);
  document.addEventListener('change',e=>{if(S.page!=='valuation')return;const el=e.target.closest('[data-norm]');if(!el)return;e.preventDefault();e.stopImmediatePropagation();const v=parseFloat(el.value),i=+el.dataset.i,k=el.dataset.norm;if(!Number.isFinite(v))return;if(!S.normCustomManual||!Array.isArray(S.normManual?.Custom)){ERT40.enableManualNormalisation()}S.normManual.Custom[i][k]=v;S.drvScenario='Custom';refresh()},true);
})();
</script>
</body></html>
