 let W=wacc(),R=dcf(),mos=(R.ps/D.market.price-1)*100,fcfm=fcfMargins(),termRange=[1.5,2,2.5,3,3.5];
 return `<h1>Valuation Studio</h1><div class="lead">Inputs are traceable, benchmarked, editable and connected to valuation impact.</div>
 <div class="grid two"><div class="card"><h3>WACC <span class="value">${pct(W.w)}</span></h3><div class="small">Weighted average cost of capital. Click / edit every component.</div><div class="formgrid"><label>Risk-free rate (%)<input data-wa="rf" value="${S.rf}"></label><label>Beta<input data-wa="beta" value="${S.beta}"></label><label>Equity risk premium (%)<input data-wa="erp" value="${S.erp}"></label><label>Pre-tax cost of debt (%)<input data-wa="cod" value="${S.cod}"></label><label>Tax rate (%)<input data-wa="tax" value="${S.tax}"></label><label>Terminal growth (%)<input id="terminal" value="${S.terminal}"></label></div>
 <div class="formula">Cost of equity = ${pct(S.rf)} + ${S.beta.toFixed(2)} × ${pct(S.erp)} = ${pct(W.coe)}<br>After-tax cost of debt = ${pct(S.cod)} × (1-${pct(S.tax)}) = ${pct(W.after)}<br>Equity weight ${(W.ew*100).toFixed(2)}% · Debt weight ${(W.dw*100).toFixed(2)}%<br><strong>WACC = ${pct(W.w)}</strong></div>
 <div class="sourcebox"><strong>Benchmarks to connect live:</strong> US 10Y Treasury (risk-free), calculated/published beta, Damodaran/market ERP, Alphabet bond YTM schedule, SEC effective tax rate, market-value E/D weights.</div></div>
 <div class="card"><h3>Terminal growth benchmark</h3><div class="value">${pct(S.terminal)}</div><div class="small">Long-run growth after the explicit 5-year forecast.</div>${list([['Conservative reference','2.0%'],['Base reference','2.5%'],['Optimistic reference','3.0%'],['WACC − g spread',pct(W.w-S.terminal)],['Terminal value share of PV',pct(R.tvshare)]])}<div class="finding ${S.terminal>3?'find-neg':'find-risk'}"><h4>Sanity check</h4><p>Terminal growth should normally be benchmarked against long-run inflation / nominal economic growth. Historical GOOG growth is not sustainable forever.</p></div></div></div>
 <div class="grid two" style="margin-top:12px"><div class="card"><h3>How should FCF be forecast?</h3><label class="sub">FCF basis<select id="basis" style="width:100%;margin-top:5px;background:#0a121b;color:#fff;border:1px solid var(--line);padding:8px;border-radius:7px"><option value="reported" ${S.basis==='reported'?'selected':''}>Reported FCF — ${fmt(reportedFcf())}m</option><option value="sbc" ${S.basis==='sbc'?'selected':''}>SBC-adjusted FCF — ${fmt(reportedFcf()-last(by('cashflow.sbc')[2]))}m</option><option value="owner" ${S.basis==='owner'?'selected':''}>Owner Earnings — editable maintenance CapEx</option><option value="margin" ${S.basis==='margin'?'selected':''}>5Y average FCF margin — ${pct(avg(fcfm))}</option></select></label>
 ${S.basis==='margin'?`<div class="formula">${D.years.map((y,i)=>`${y}: ${pct(fcfm[i])}`).join('<br>')}<br><strong>5Y average = ${pct(avg(fcfm))}</strong><br>Median = ${pct(med(fcfm))}</div>`:''}
 ${S.basis==='owner'?`<label class="sub">Maintenance CapEx (% of total)<input id="maint" value="${S.maint}" style="width:100%;margin-top:5px;background:#0a121b;color:#fff;border:1px solid var(--line);padding:8px;border-radius:7px"></label>`:''}
 <h3 style="margin-top:12px">Year-by-year FCF growth assumptions</h3><div class="formgrid">${S.g.map((g,i)=>`<label>Year ${i+1} (%)<input data-g="${i}" value="${g}"></label>`).join('')}</div></div>
 <div class="card"><h3>Result <span class="badge">${D.market.model_asof}</span></h3>${list([['Equity value',fmt(R.equity)+' USD million'],['Shares outstanding',fmt(D.market.shares_m)+' million shares'],['Intrinsic value',money(R.ps)+' / share'],['Current price',money(D.market.price)+' / share'],['Margin of safety',pct(mos)]])}<div class="sourcebox"><strong>Data dates:</strong><br>Price: ${D.market.asof}<br>Shares / financial facts: FY2024 filing ${D.source.filingDate}<br>Model recalculated: ${D.market.model_asof}</div></div></div>
 <div class="card" style="margin-top:12px"><h3>Sensitivity — WACC × terminal growth (USD/share)</h3>${sensitivity(termRange)}</div>`;
}
function sensitivity(ts){let ws=[7.5,8,8.5,9,9.5,10],best=null,bd=1e9;ws.forEach(w=>ts.forEach(t=>{let v=dcf(S.g,w,t).ps,d=Math.abs(v-D.market.price);if(d<bd){bd=d;best=[w,t]}}));return `<div class="tw" style="max-height:none"><table style="min-width:700px"><thead><tr><th>WACC \ g</th>${ts.map(t=>`<th>${t}%</th>`).join('')}</tr></thead><tbody>${ws.map(w=>`<tr><td>${w}%</td>${ts.map(t=>{let v=dcf(S.g,w,t).ps,b=best[0]===w&&best[1]===t;return `<td style="${b?'outline:2px solid var(--amber);background:#28220c':''}">${money(v)}${b?'<span class="metricDesc">Closest to current price</span>':''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}

function market(){
 let ps=D.prices,dates=D.dates,s20s=smaSeries(ps,20),s50s=smaSeries(ps,50),s200s=smaSeries(ps,200),rsis=rsiSeries(ps),fv=dcf().ps;
 let s20=sma(ps,20),s50=sma(ps,50),s200=sma(ps,200),rs=rsi(ps),trend=D.market.price>s20&&s20>s50&&s50>s200?'Bullish alignment':'Mixed';
 return `<h1>Market & Price Context</h1><div class="lead">Price trend, fair value, moving averages and momentum — translated into plain English.</div>
 <div class="grid k4">${card('Current price',money(D.market.price),'Market close · '+D.market.asof)}${card('Fair value',money(fv),'Base DCF · '+D.market.model_asof,D.market.price>fv?'neg':'pos')}${card('RSI (14)',rs.toFixed(1),rs>70?'Momentum · near overbought':rs<30?'Momentum · near oversold':'Momentum · neutral')}${card('Trend',trend,`Price ${D.market.price>s20?'>':'<'} SMA20 ${s20>s50?'>':'<'} SMA50 ${s50>s200?'>':'<'} SMA200`,trend.includes('Bullish')?'pos':'warn')}</div>
 <div class="grid k3" style="margin-top:12px">${card('SMA20',money(s20),`Short-term (~1 month) · price ${(D.market.price/s20-1)*100>=0?'+':''}${((D.market.price/s20-1)*100).toFixed(1)}% vs SMA`)}${card('SMA50',money(s50),`Medium-term (~2–3 months) · price ${(D.market.price/s50-1)*100>=0?'+':''}${((D.market.price/s50-1)*100).toFixed(1)}% vs SMA`)}${card('SMA200',money(s200),`Long-term (~9–10 months) · price ${(D.market.price/s200-1)*100>=0?'+':''}${((D.market.price/s200-1)*100).toFixed(1)}% vs SMA`)}</div>
 <div class="card" style="margin-top:12px"><h3>Price, moving averages and DCF fair value</h3>${marketChart(dates,ps,s20s,s50s,s200s,fv)}<div class="legend"><span><i style="background:var(--blue)"></i>Price</span><span><i style="background:var(--amber)"></i>SMA20</span><span><i style="background:var(--purple)"></i>SMA50</span><span><i style="background:var(--cyan)"></i>SMA200</span><span><i style="background:var(--green)"></i>DCF fair value</span></div></div>
 <div class="card" style="margin-top:12px"><h3>RSI (14) — momentum</h3>${rsiChart(dates,rsis)}<div class="finding ${rs>70?'find-risk':'find-pos'}"><h4>What does this mean?</h4><p>RSI compares recent gains with recent losses. Above 70 often means momentum is unusually strong / stretched; below 30 often means unusually weak. It is not a valuation measure or automatic buy/sell signal.</p></div></div>
 <div class="finding find-risk"><h4>Combined interpretation</h4><p>Trend is ${trend.toLowerCase()}. RSI is ${rs.toFixed(1)}. Current price is ${pct((D.market.price/fv-1)*100)} above base-case fair value. Strong momentum and attractive valuation are currently giving different signals.</p></div>`;
}
function marketChart(ds,p,s20,s50,s200,fv){let W=900,H=330,pad=52,vals=[...p,...s20.filter(Boolean),...s50.filter(Boolean),...s200.filter(Boolean),fv],mn=Math.floor(Math.min(...vals)/10)*10,mx=Math.ceil(Math.max(...vals)/10)*10,x=i=>pad+i*(W-2*pad)/(p.length-1),y=v=>H-pad-(v-mn)/(mx-mn)*(H-2*pad),path=(a,cls)=>{let d='',started=false;a.forEach((v,i)=>{if(v==null)return;d+=(started?'L':'M')+x(i)+','+y(v)+' ';started=true});return `<path class="${cls}" d="${d}"/>`};let idx=[0,65,130,195,259],ticks=[mn,(mn+mx)/2,mx];return `<div class="chart" style="height:310px"><svg viewBox="0 0 ${W} ${H}"><line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/><line class="axis" x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}"/>${ticks.map(t=>`<text x="${pad-8}" y="${y(t)+4}" text-anchor="end" fill="#99adbf" font-size="11">$${t.toFixed(0)}</text><line class="axis" opacity=".25" x1="${pad}" y1="${y(t)}" x2="${W-pad}" y2="${y(t)}"/>`).join('')}${path(p,'priceLine')}${path(s20,'sma20')}${path(s50,'sma50')}${path(s200,'sma200')}<path class="fair" d="M${pad},${y(fv)} L${W-pad},${y(fv)}"/>${idx.map(i=>`<text x="${x(i)}" y="${H-20}" text-anchor="middle" fill="#99adbf" font-size="10">${ds[i].slice(0,7)}</text>`).join('')}<circle cx="${x(259)}" cy="${y(p[259])}" r="5" fill="var(--blue)"/><text x="${x(259)-8}" y="${y(p[259])-9}" text-anchor="end" fill="#fff" font-size="10">${money(p[259])}</text><text x="${W-pad-5}" y="${y(fv)-7}" text-anchor="end" fill="var(--green)" font-size="10">DCF ${money(fv)}</text></svg></div>`}
function rsiChart(ds,a){let W=900,H=220,pad=42,x=i=>pad+i*(W-2*pad)/(a.length-1),y=v=>H-pad-v/100*(H-2*pad),d='',s=false;a.forEach((v,i)=>{if(v==null)return;d+=(s?'L':'M')+x(i)+','+y(v)+' ';s=true});let idx=[0,65,130,195,259];return `<div class="chart" style="height:210px"><svg viewBox="0 0 ${W} ${H}"><line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/><line x1="${pad}" y1="${y(70)}" x2="${W-pad}" y2="${y(70)}" stroke="var(--amber)" stroke-dasharray="5 4"/><line x1="${pad}" y1="${y(30)}" x2="${W-pad}" y2="${y(30)}" stroke="var(--cyan)" stroke-dasharray="5 4"/><text x="${pad-7}" y="${y(70)+4}" text-anchor="end" fill="#f4c65f" font-size="10">70</text><text x="${pad-7}" y="${y(30)+4}" text-anchor="end" fill="#73d6f2" font-size="10">30</text><path class="rsiLine" d="${d}"/>${idx.map(i=>`<text x="${x(i)}" y="${H-15}" text-anchor="middle" fill="#99adbf" font-size="10">${ds[i].slice(0,7)}</text>`).join('')}</svg></div>`}

function research(){let n=localStorage.getItem('ert07notes')||'';return `<h1>Research Notes</h1><div class="lead">Record your thesis, assumptions and why you changed them.</div><div class="card"><textarea id="notes" style="min-height:240px">${n}</textarea><div class="actions"><button class="btn primary" id="save">Save notes</button></div></div>`}
function report(){let R=rating(),fv=dcf().ps,mos=(fv/D.market.price-1)*100;return `<div class="noPrint actions"><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div><div class="report"><h1>Alphabet Inc. (GOOG)</h1><p><strong>Plain-language equity research summary</strong></p><div style="font-size:30px;color:#d9a500">${star(R.overall)} <span style="font-size:16px;color:#111">${R.overall.toFixed(1)}/5</span></div><h2>Investment scorecard</h2><div class="reportGrid">${[['Moat',R.moat],['Business quality',R.quality],['Growth',R.growth],['Financial health',R.fin],['Capital allocation',R.capital],['Valuation',R.val]].map(x=>`<div class="reportScore"><strong>${x[0]}</strong><span style="float:right">${x[1].toFixed(1)}/5</span><div class="bar"><i style="width:${x[1]/5*100}%"></i></div></div>`).join('')}</div><h2>Three-minute summary</h2><p>Alphabet is a high-quality, strong-moat business with improving operating profitability and high returns on invested capital. The central tension is valuation: recent AI-related CapEx reduces free cash flow while the market price implies substantially faster future FCF growth than the ERT base case.</p><h2>Valuation view</h2><p>Current price is <strong>${money(D.market.price)}</strong>; base DCF fair value is <strong>${money(fv)}</strong>, implying <strong>${pct(mos)}</strong> upside/downside. This result depends heavily on WACC, terminal growth, CapEx and the FCF definition.</p><h2>Market & consensus</h2><p>Demo analyst consensus target mean is <strong>${money(D.consensus.targetMean)}</strong>. Market-implied FCF growth is <strong>${pct(reverse())}</strong>, versus ERT base-case 5Y FCF CAGR of <strong>${pct(fiveYCagrForecast())}</strong>.</p><h2>What to watch next</h2><ul>${D.events.map(e=>`<li><strong>${e.date}</strong> — ${e.title}: ${e.watch}</li>`).join('')}</ul><h2>Disclaimer</h2><p>For research and educational reference only. This build uses fixed test data and demo consensus/event placeholders. Not investment advice.</p></div>`}
function disclaimer(){return `<h1>Disclaimer</h1><div class="card"><p>This research terminal supports education and investment research. It does not provide investment advice.</p><p>Financial, market, consensus and event data must be independently verified. Demo consensus/event data in this build are specifically labelled and must not be treated as live market information.</p><p>The product is designed to make every important number understandable, traceable, editable where appropriate, and actionable.</p></div>`}

function inspector(){
 if(!S.show)return `<button id="show" class="restore">Evidence / Context</button>`;
 let special=S.sel||'income.revenue';
 if(special==='roic')return specialInspector('ROIC — Return on Invested Capital',`<div class="value">${pct(roic())}</div><p>Plain English: how efficiently the business turns invested capital into after-tax operating profit.</p>${list([['ROIC',pct(roic())],['WACC',pct(wacc().w)],['Value creation spread',pct(roic()-wacc().w)]])}<div class="formula">ROIC = NOPAT ÷ Invested Capital<br>NOPAT ≈ Operating Income × (1 − tax rate)</div><div class="finding find-pos"><p>ROIC well above WACC usually indicates strong value creation. It can support a moat thesis, but does not prove one by itself.</p></div>`);
 if(String(special).startsWith('multiple:')){let m=special.split(':')[1],cur=m==='P/E'?pe():m==='PEG'?peg():m==='EV/Sales'?evSales():m==='EV/EBIT'?evEbit():evFcf(),a=D.historicalMultiples[m],av=avg(a);return specialInspector(m,`<div class="value">${cur.toFixed(2)}x</div><p>${descr[m]}</p>${list([['Current',cur.toFixed(2)+'x'],['5Y average',av.toFixed(2)+'x'],['5Y median',med(a).toFixed(2)+'x'],['5Y low',Math.min(...a).toFixed(2)+'x'],['5Y high',Math.max(...a).toFixed(2)+'x']])}<div class="finding ${cur>av?'find-risk':'find-pos'}"><p>${cur>av?'Above':'Below'} its own 5Y average. Historical comparison tells you how GOOG is priced relative to itself — not whether it is objectively cheap.</p></div>${m==='EV/FCF'?'<div class="finding find-risk"><p>High recent CapEx reduces FCF and can make EV/FCF look expensive. Explore CapEx in Financials / Analysis.</p></div>':''}`);
 }
 let r=by(special)||by('income.revenue'),pg=page(r[0]),unit=r[0].includes('eps')?'USD/share':r[0].includes('shares')?'million shares':'USD million';
 return `<aside class="ins ${S.show?'mobileOpen':''}"><div class="ih"><strong>Evidence & Analysis Inspector</strong><div class="sp"></div><button class="btn" id="hide">Hide</button></div><div style="padding:12px"><h3>${r[1]}</h3><div class="sub">${unit}</div>${spark(r[2])}<div class="meta"><div><span>Cell ID</span><strong>${r[0]}.FY2024</strong></div><div><span>Latest value</span><strong>${fmt(last(r[2]),2)}</strong></div><div><span>5Y CAGR</span><strong>${isFinite(cagr(r[2]))?pct(cagr(r[2])):'—'}</strong></div><div><span>2024 YoY</span><strong>${yy(r[2],4)==null?'—':pct(yy(r[2],4))}</strong></div><div><span>Form</span><strong>10-K FY2024</strong></div><div><span>Report page</span><strong>${pg}</strong></div></div><div class="finding find-pos"><h4>So what?</h4><p>${soWhat(r[0])}</p></div><div class="actions"><a class="btn primary" target="_blank" href="${D.source.filing}">Open filing</a><a class="btn" target="_blank" href="${D.source.pdf}#page=${pg}">Open page</a></div></div></aside>`;
}
function specialInspector(title,body){return `<aside class="ins mobileOpen"><div class="ih"><strong>Evidence & Analysis Inspector</strong><div class="sp"></div><button class="btn" id="hide">Hide</button></div><div style="padding:12px"><h3>${title}</h3>${body}</div></aside>`}
function soWhat(id){if(id==='cashflow.capex')return 'CapEx reduces current free cash flow, but may create future capacity and AI growth. The key question is whether future ROIC justifies the spending.';if(id==='income.revenue')return 'Revenue growth sets the starting point for future profit and FCF. Faster sustainable growth usually raises intrinsic value.';if(id==='balance.receivables')return 'Receivables should be compared with revenue growth. If receivables rise much faster, collection quality may be weakening.';return 'Use the trend, source and related calculations to understand whether this item improves or weakens the investment thesis.'}
function spark(a){let W=320,H=150,p=24,mn=Math.min(...a),mx=Math.max(...a),x=i=>p+i*(W-2*p)/(a.length-1),y=v=>H-p-(v-mn)/(mx-mn||1)*(H-2*p),d=a.map((v,i)=>(i?'L':'M')+x(i)+','+y(v)).join(' ');return `<div class="chart" style="height:165px"><svg viewBox="0 0 ${W} ${H}"><line class="axis" x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}"/><path class="priceLine" d="${d}"/>${a.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--blue)"/><text x="${x(i)}" y="${H-6}" fill="#99adbf" font-size="9" text-anchor="middle">${D.years[i]}</text>`).join('')}</svg></div>`}

function render(){let P={overview,financials,analysis,valuation,market,research,report,disclaimer};app.innerHTML=top(P[S.page]());bind()}
function bind(){
 document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{S.page=b.dataset.page;S.menu=false;render()});
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.st=b.dataset.tab;S.sel=D[S.st][0][0];render()});
 document.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.row;S.show=true;render()});
 document.querySelectorAll('[data-inspect]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.inspect;S.show=true;render()});
 document.getElementById('menuBtn')?.addEventListener('click',()=>{S.menu=!S.menu;render()});
 document.getElementById('shade')?.addEventListener('click',()=>{S.menu=false;render()});
 document.getElementById('hide')?.addEventListener('click',()=>{S.show=false;render()});
 document.getElementById('show')?.addEventListener('click',()=>{S.show=true;render()});
 document.querySelectorAll('[data-wa]').forEach(i=>i.onchange=e=>{S[e.target.dataset.wa]=+e.target.value;render()});
 document.getElementById('terminal')?.addEventListener('change',e=>{S.terminal=+e.target.value;render()});
 document.getElementById('basis')?.addEventListener('change',e=>{S.basis=e.target.value;render()});
 document.getElementById('maint')?.addEventListener('change',e=>{S.maint=+e.target.value;render()});
 document.querySelectorAll('[data-g]').forEach(i=>i.onchange=e=>{S.g[+e.target.dataset.g]=+e.target.value;render()});
 document.getElementById('save')?.addEventListener('click',()=>{localStorage.setItem('ert07notes',document.getElementById('notes').value);document.getElementById('save').textContent='Saved'});
 let r=document.getElementById('res'),w=document.getElementById('work');if(r&&w&&S.show&&window.innerWidth>767){let drag=false;r.onmousedown=()=>drag=true;window.onmouseup=()=>drag=false;window.onmousemove=e=>{if(!drag)return;let b=w.getBoundingClientRect(),right=Math.max(290,Math.min(620,b.right-e.clientX));w.style.gridTemplateColumns=`minmax(560px,1fr) 6px ${right}px`};r.ondblclick=()=>w.style.gridTemplateColumns='minmax(560px,1fr) 6px 360px'}
}
render();
</script>
</body></html>
