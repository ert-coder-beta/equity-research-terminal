 <div class="grid two" style="margin-top:12px"><div class="card"><h3>Investment profile</h3>${ratingLine('Moat / competitive advantage',R.moat,'Wide moat potential')}${ratingLine('Business quality',R.quality,'Excellent')}${ratingLine('Growth',R.growth,'Strong')}${ratingLine('Financial health',R.fin,'Excellent')}${ratingLine('Capital allocation',R.capital,'Strong')}${ratingLine('Valuation',R.val,R.val<3?'Less attractive':'Attractive')}${ratingLine('Risk',R.risk,'Moderate')}<div class="finding find-pos" style="margin-top:10px"><h4>Overall interpretation</h4><p>High-quality, strong-moat business. Current valuation is the main constraint under the base DCF assumptions.</p></div></div>
 <div class="card"><h3>Market expectations</h3><div class="value purple">${pct(rev)}</div><div class="sub">Market-implied 5Y FCF growth (Reverse DCF)</div>${list([['Our base-case 5Y FCF CAGR',pct(fiveYCagrForecast())],['Historical 5Y FCF CAGR',pct(cagr(D.years.map((_,i)=>reportedFcf(i))))],['Market-implied growth',pct(rev)],['Market-required 5Y FCF multiple',(Math.pow(1+rev/100,5)).toFixed(2)+'×']])}<div class="finding find-risk"><h4>What does this mean?</h4><p>The current price requires materially faster FCF growth than our base forecast. This is the expectation gap to investigate.</p></div></div></div>
 <div class="grid two" style="margin-top:12px"><div class="card"><h3>What matters now</h3><div class="finding find-pos"><h4>Latest annual revenue growth</h4><p>${D.years.at(-1)} growth was ${pct(yy(by('income.revenue')[2],D.years.length-1))}. Source updates with live SEC annual data.</p></div><div class="finding find-pos"><h4>ROIC is strong</h4><p>ROIC ${pct(roic())} vs WACC ${pct(wacc().w)}. ROIC measures how efficiently operating capital generates after-tax operating profit.</p></div><div class="finding find-risk"><h4>CapEx is the key trade-off</h4><p>Latest annual CapEx growth was ${pct(yy(by('cashflow.capex')[2],D.years.length-1))}; it supports AI investment but reduces current FCF.</p></div></div>
 <div class="card"><h3>Valuation comparison</h3>${list([['Current price',money(D.market.price)],['DCF fair value',money(v)],['Consensus target',D.consensus&&D.consensus.status==='LIVE'&&D.consensus.targetMean!=null?money(D.consensus.targetMean):'Unavailable'],['Reverse DCF growth',pct(rev)],['ROIC',pct(roic())]])}<div class="sourcebox">Consensus: ${D.consensus&&D.consensus.status==='LIVE'?'LIVE · '+D.consensus.displaySource+' · '+(D.consensus.asof||''):'Unavailable — no demo target is used.'}</div></div></div>
 <div class="card" style="margin-top:12px"><h3>Historical valuation — compared with GOOG's own 5Y history</h3><div class="finding find-risk"><h4>Overall: MIXED</h4><p>Earnings measures look reasonable, while free-cash-flow valuation is stretched. Elevated CapEx is one reason these measures disagree.</p></div>${histTable(mults)}</div>`;
}
function card(a,b,c,cls=''){return `<div class="card"><div class="sub">${a}</div><div class="value ${cls}">${b}</div><div class="small">${c}</div></div>`}
function ratingLine(a,n,meaning){let tone=a==='Valuation'?'tone-neg':a==='Risk'?'tone-watch':'tone-pos';let why=a.startsWith('Moat')?'ROIC spread + brand/network strength':a==='Business quality'?'32.1% operating margin · strong cash generation':a==='Growth'?'Revenue +13.9% · 5Y CAGR 17.7%':a==='Financial health'?'Net cash balance · low debt weight':a==='Capital allocation'?'Buybacks + reinvestment; CapEx needs monitoring':a==='Valuation'?'Price above base DCF · high implied growth':'Moderate: regulation, AI competition, CapEx';return `<div class="ratingRow clickable" data-inspect="rating:${a}"><span>${a}<span class="metricDesc">${why}</span></span><span class="stars ${tone}">${star(n)}</span><strong class="${tone}">${n.toFixed(1)}</strong></div>`}
function list(a){return `<div>${a.map(x=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div>`}
function histTable(mults){return `<div class="tw" style="max-height:none"><table style="min-width:960px"><thead><tr><th>Metric</th><th>Current</th><th>Live-history average</th><th>Median</th><th>Observed range</th><th>vs average</th><th>Meaning</th></tr></thead><tbody>${mults.map(([m,cur,a])=>{a=(a||[]).filter(Number.isFinite);if(a.length<2||!Number.isFinite(cur))return `<tr><td><strong>${m}</strong></td><td>${Number.isFinite(cur)?cur.toFixed(2)+'x':'Unavailable'}</td><td colspan="5" class="tone-watch">Unavailable — insufficient live SEC/market history; no demo values used.</td></tr>`;let av=avg(a),lo=Math.min(...a),hi=Math.max(...a),pos=(cur-lo)/(hi-lo||1)*100,avpos=(av-lo)/(hi-lo||1)*100,d=(cur/av-1)*100,tone=d<-5?'tone-pos':d>5?'tone-neg':'tone-watch',interpret=d<-15?'Cheaper than observed history':d<-5?'Slightly cheaper':d>15?'Expensive vs observed history':d>5?'Slightly expensive':'Near observed average';return `<tr class="row clickable" data-inspect="multiple:${m}"><td><strong>${m}</strong><span class="metricDesc">${descr[m]}</span></td><td class="${tone}">${cur.toFixed(2)}x</td><td>${av.toFixed(2)}x</td><td>${med(a).toFixed(2)}x</td><td class="range"><div style="display:flex;justify-content:space-between"><span>${lo.toFixed(1)}x LOW</span><span>HIGH ${hi.toFixed(1)}x</span></div><div class="track"><i style="left:${Math.max(0,Math.min(100,pos))}%"></i><b style="position:absolute;left:${avpos}%;top:-3px;height:12px;border-left:2px solid var(--amber)"></b></div><span class="metricDesc">Live SEC annuals + market history</span></td><td class="${tone}">${d>=0?'+':''}${d.toFixed(0)}%</td><td class="${tone}">${interpret}</td></tr>`}).join('')}</tbody></table></div>`}

function financials(){let R=D[S.st];if(!R.find(x=>x[0]===S.sel))S.sel=R[0][0];return `<h1>Financial Statements</h1><div class="lead">Every year, every YoY change, 5Y CAGR and click-through context.</div><div class="tabs">${[['income','Income Statement'],['balance','Balance Sheet'],['cashflow','Cash Flow']].map(x=>`<button data-tab="${x[0]}" class="${S.st===x[0]?'active':''}">${x[1]}</button>`).join('')}</div><div class="tw"><table><thead><tr><th>Line item</th>${D.years.map((y,i)=>`<th>${y}</th>${i?'<th>YoY</th>':''}`).join('')}<th>5Y CAGR</th></tr></thead><tbody>${R.map(r=>`<tr class="row ${S.sel===r[0]?'sel':''}" data-row="${r[0]}"><td>${r[1]}</td>${r[2].map((v,i)=>`<td>${fmt(v,2)}</td>${i?`<td class="${yy(r[2],i)>=0?'pos':'neg'}">${yy(r[2],i)==null?'—':pct(yy(r[2],i))}</td>`:''}`).join('')}<td>${isFinite(cagr(r[2]))?pct(cagr(r[2])):'—'}</td></tr>`).join('')}</tbody></table></div>`}

function analysis(){
 let rev=by('income.revenue')[2],cap=by('cashflow.capex')[2],rec=by('balance.receivables')[2];
 return `<h1>Analysis</h1><div class="lead">What changed, why it matters, how it affects valuation — plus consensus and upcoming catalysts.</div>
 <div class="snap">${snap('Growth','STRONG','good','status:growth')}${snap('Margins','IMPROVING','good','status:margins')}${snap('ROIC','EXCELLENT','good','roic')}${snap('FCF quality','MIXED','watch','status:fcf')}${snap('CapEx','WATCH','watch','cashflow.capex')}${snap('Consensus','ABOVE OUR BASE','purple','status:consensus')}${snap('Valuation','HIGH EXPECTATIONS','bad','status:valuation')}</div>
 <div class="grid two"><div class="card"><h3 class="pos">Positive findings</h3><div class="finding find-pos"><h4>Revenue growth improved</h4><p>Growth rose from ${pct(yy(rev,3))} to ${pct(yy(rev,4))}. Higher sales support higher future FCF.</p></div><div class="finding find-pos"><h4>Operating margin expanded</h4><p>Margin reached ${pct(opm())}. More revenue is becoming operating profit.</p></div><div class="finding find-pos" data-inspect="roic"><h4>ROIC is strong</h4><p>${pct(roic())} vs WACC ${pct(wacc().w)}. Strong value-creation spread.</p></div></div>
 <div class="card"><h3 class="warn">Risks and questions</h3><div class="finding find-risk" data-row="cashflow.capex"><h4>CapEx jumped</h4><p>CapEx increased ${pct(yy(cap,4))}. It may support AI growth but weighs on near-term FCF.</p></div><div class="finding find-risk"><h4>FCF lagged earnings</h4><p>Net income grew faster than FCF because capital spending increased materially.</p></div><div class="finding find-risk" data-row="balance.receivables"><h4>Receivables need monitoring</h4><p>Receivables grew ${pct(yy(rec,4))}; compare with revenue growth to monitor collection quality.</p></div></div></div>
 <div class="card" style="margin-top:12px"><h3>ERT vs Analyst Consensus vs Market-implied expectations</h3><div class="compare head"><span>Metric</span><span>Actual</span><span>ERT base</span><span>Consensus</span><span>Market implied</span></div>${cmp('Revenue growth',pct(yy(rev,4)),'11.2%',pct(D.consensus.revenueGrowth),'—')}${cmp('EPS growth',pct(yy(by('income.eps')[2],4)),'13.8%',pct(D.consensus.epsGrowth),'—')}${cmp('FCF growth',pct(yy(D.years.map((_,i)=>reportedFcf(i)),4)),pct(fiveYCagrForecast()),pct(D.consensus.fcfGrowth),pct(reverse()))}${cmp('Operating margin',pct(opm()),'32.5%',pct(D.consensus.opMargin),'—')}${cmp('CapEx',fmt(last(cap))+'m','54,000m',fmt(D.consensus.capex_m)+'m','—')}<div class="finding find-risk" style="margin-top:10px"><h4>Expectation gap</h4><p>Current price implies FCF growth of ${pct(reverse())}, above the demo consensus ${pct(D.consensus.fcfGrowth)} and ERT base ${pct(fiveYCagrForecast())}. The market is pricing in a more demanding outcome.</p></div><div class="sourcebox"><strong>Consensus source:</strong> ${D.consensus.displaySource} · ${D.consensus.analysts} analysts · as of ${D.consensus.asof}. <br>${D.consensus.productionPlan}</div></div>
 <div class="grid two" style="margin-top:12px"><div class="card"><h3>Analyst consensus snapshot <span class="badge purple">${D.consensus.status}</span></h3>${list([['Rating',D.consensus.rating],['Buy / Hold / Sell',`${D.consensus.buy} / ${D.consensus.hold} / ${D.consensus.sell}`],['Target low',money(D.consensus.targetLow)],['Target median',money(D.consensus.targetMedian)],['Target mean',money(D.consensus.targetMean)],['Target high',money(D.consensus.targetHigh)],['30d estimate revision','+'+D.consensus.revision30+'%'],['90d estimate revision','+'+D.consensus.revision90+'%']])}</div>
 <div class="card"><h3>Upcoming catalysts & key dates</h3>${D.events.map(e=>`<div class="event"><div class="eventTop"><strong>${e.date} · ${e.title}</strong><span class="impact">${e.impact}</span></div><div class="small">${e.status}</div><p style="margin-bottom:5px">${e.watch}</p><div class="metricDesc">Source: ${e.source}</div></div>`).join('')}</div></div>`;
}
function snap(a,b,c,id=''){return `<div class="clickable" data-inspect="${id}"><span class="sub">${a}</span><b class="${c}">${b}</b></div>`}function cmp(a,b,c,d,e){return `<div class="compare"><span>${a}</span><strong>${b}</strong><strong>${c}</strong><strong class="purple">${d}</strong><strong class="warn">${e}</strong></div>`}

function valuation(){
 let W=wacc(),R=dcf(),mos=(R.ps/D.market.price-1)*100,fcfm=fcfMargins(),termRange=[1.5,2,2.5,3,3.5];
 let d=R.detail||[],y5=d[d.length-1]||{},revCagr=d.length&&d[0].revenue?((Math.pow(d[d.length-1].revenue/last(by('income.revenue')[2]),1/5)-1)*100):fiveYCagrForecast();
 return `<h1>Valuation Studio</h1><div class="lead">Every assumption is editable. Click any label/value for definition, benchmark, source and valuation impact.</div>
 <div class="grid two"><div class="card"><h3 class="clickable" data-inspect="wacc">WACC <span class="value tone-model">${pct(W.w)}</span></h3><div class="small">Weighted average cost of capital — the discount rate used to convert future cash flows into today's value.</div><div class="formgrid">
 ${waInput('Risk-free rate (%)','rf',S.rf,'wacc:rf')}${waInput('Beta','beta',S.beta,'wacc:beta')}${waInput('Equity risk premium (%)','erp',S.erp,'wacc:erp')}${waInput('Pre-tax cost of debt (%)','cod',S.cod,'wacc:debt')}${waInput('Tax rate (%)','tax',S.tax,'wacc:tax')}<label class="clickable" data-inspect="wacc:weights">Equity / debt weights<input value="${(W.ew*100).toFixed(2)}% / ${(W.dw*100).toFixed(2)}%" disabled></label></div>
 <div class="formula clickable" data-inspect="wacc">Cost of equity = ${pct(S.rf)} + ${S.beta.toFixed(2)} × ${pct(S.erp)} = ${pct(W.coe)}<br>After-tax cost of debt = ${pct(S.cod)} × (1-${pct(S.tax)}) = ${pct(W.after)}<br>Equity weight ${(W.ew*100).toFixed(2)}% · Debt weight ${(W.dw*100).toFixed(2)}%<br><strong>WACC = ${pct(W.w)}</strong></div></div>
 <div class="card"><h3>Terminal growth assumption</h3><label class="sub clickable" data-inspect="terminal">Selected long-run growth (%)<input id="terminal" value="${S.terminal}" style="width:100%;margin-top:5px;background:#0a121b;color:#fff;border:1px solid var(--line);padding:10px;border-radius:7px"></label><div class="value tone-model clickable" data-inspect="terminal">${pct(S.terminal)}</div><div class="small">Growth after the explicit 5-year forecast. Editable independently from WACC.</div>${list([['Conservative reference','2.0%'],['Base reference','2.5%'],['Optimistic reference','3.0%'],['WACC − g spread',pct(W.w-S.terminal)],['Terminal value share of PV',pct(R.tvshare)]])}<div class="finding ${R.tvshare>70?'find-risk':'find-pos'} clickable" data-inspect="terminal"><h4>Model dependency: ${R.tvshare>70?'HIGH':'MODERATE'}</h4><p>${pct(R.tvshare)} of present value comes from terminal value, so small WACC/g changes can materially move fair value.</p></div></div></div>
 <div class="card" style="margin-top:12px"><h3>FCF Forecast Engine — editable drivers</h3><p>Build the forecast from operating drivers. Changing any driver updates the DCF immediately.</p><div class="sourcebox"><b>Base scenario anchor:</b> after Live Refresh, Base is re-anchored to the latest SEC annual revenue growth, OCF margin and CapEx intensity, blended with recent history. Bear/Bull are spreads around that live Base; Custom preserves your manual inputs.</div>
 <div class="driverBtns"><button data-scenario="Bear" class="${S.drvScenario==='Bear'?'active':''}">Bear</button><button data-scenario="Base" class="${S.drvScenario==='Base'?'active':''}">Base</button><button data-scenario="Bull" class="${S.drvScenario==='Bull'?'active':''}">Bull</button><button data-scenario="Custom" class="${S.drvScenario==='Custom'?'active':''}">Custom</button><button id="resetDrivers">Reset to Base</button></div>
 <table class="driverTable"><thead><tr><th>Driver</th>${[1,2,3,4,5].map(x=>`<th>Y${x}</th>`).join('')}</tr></thead><tbody>
 <tr><td class="clickable" data-inspect="driver:revenue"><strong>Revenue growth %</strong></td>${S.drvRev.map((v,i)=>`<td><input inputmode="decimal" data-driver="rev" data-i="${i}" value="${v}"></td>`).join('')}</tr>
 <tr><td class="clickable" data-inspect="driver:ocf"><strong>OCF margin %</strong></td>${S.drvOcf.map((v,i)=>`<td><input inputmode="decimal" data-driver="ocf" data-i="${i}" value="${v}"></td>`).join('')}</tr>
 <tr><td class="clickable" data-inspect="driver:capex"><strong>CapEx / Revenue %</strong></td>${S.drvCap.map((v,i)=>`<td><input inputmode="decimal" data-driver="cap" data-i="${i}" value="${v}"></td>`).join('')}</tr>
 <tr><td><strong>→ FCF margin %</strong></td>${S.drvOcf.map((v,i)=>`<td><strong class="tone-pos">${(v-S.drvCap[i]).toFixed(1)}%</strong></td>`).join('')}</tr></tbody></table>
 <div class="driverResults">
 ${card('Scenario',S.drvScenario,'Bear / Base / Bull / Custom')}${card('5Y Revenue CAGR',pct(revCagr),'Driver-based forecast')}${card('Y5 FCF margin',y5.fcfMargin!=null?pct(y5.fcfMargin):'—','OCF margin − CapEx intensity')}${card('Y5 FCF',y5.fcf?fmt(y5.fcf)+'m':'—','Calculated from drivers')}
 </div>
 <div class="finding find-risk"><h4>CapEx classification</h4><p><strong>Maintenance / Growth / One-off / Unclassified:</strong> Alphabet does not separately disclose a precise split in this prototype. Do not invent precision. The Inspector explains how CapEx intensity affects FCF and fair value.</p></div></div>
 <div class="grid two" style="margin-top:12px"><div class="card"><h3>DCF Result</h3><div class="clickable" data-inspect="dcfresult">${list([['Equity value',fmt(R.equity)+' USD million'],['Shares outstanding',fmt(D.market.shares_m)+' million shares'],['Intrinsic value',money(R.ps)+' / share'],['Current price',money(D.market.price)+' / share'],['Margin of safety',pct(mos)]])}</div><div class="sourcebox"><strong>Data dates:</strong><br>Price: ${D.market.asof}<br>Shares / financial facts: latest SEC live refresh<br>Model recalculated: ${D.market.model_asof}</div></div>
 <div class="card"><h3>Historical FCF anchor</h3><div class="formula clickable" data-inspect="fcfmargin">${D.years.map((y,i)=>`${y}: ${pct(fcfm[i])}`).join('<br>')}<br><strong>5Y average = ${pct(avg(fcfm))}</strong><br>Median = ${pct(med(fcfm))}</div><p class="small">Use history as context, not as a substitute for a forward CapEx / cash-conversion thesis.</p></div></div>
 <div class="card" style="margin-top:12px"><h3>Sensitivity — WACC × terminal growth (USD/share)</h3>${sensitivity(termRange)}</div>`;
}
function waInput(label,key,val,id){return `<label class="clickable" data-inspect="${id}">${label}<input data-wa="${key}" value="${val}"></label>`}
function sensitivity(ts){let ws=[7.5,8,8.5,9,9.5,10],best=null,bd=1e9;ws.forEach(w=>ts.forEach(t=>{let v=dcf(S.g,w,t).ps,d=Math.abs(v-D.market.price);if(d<bd){bd=d;best=[w,t]}}));return `<div class="tw" style="max-height:none"><table style="min-width:700px"><thead><tr><th>WACC \ g</th>${ts.map(t=>`<th>${t}%</th>`).join('')}</tr></thead><tbody>${ws.map(w=>`<tr><td>${w}%</td>${ts.map(t=>{let v=dcf(S.g,w,t).ps,b=best[0]===w&&best[1]===t;return `<td style="${b?'outline:2px solid var(--amber);background:#28220c':''}">${money(v)}${b?'<span class="metricDesc">Closest to current price</span>':''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}

function market(){
 let ps=D.prices,dates=D.dates,s20s=smaSeries(ps,20),s50s=smaSeries(ps,50),s200s=smaSeries(ps,200),rsis=rsiSeries(ps),fv=dcf().ps;
 let s20=sma(ps,20),s50=sma(ps,50),s200=sma(ps,200),rs=rsi(ps),trend=D.market.price>s20&&s20>s50&&s50>s200?'Bullish alignment':'Mixed';
 let cm=D.consensus.targetMean||216,medt=D.consensus.targetMedian||214,cl=D.consensus.targetLow||165,ch=D.consensus.targetHigh||260;
 return `<h1>Market & Price Context</h1><div class="lead">Price trend, fair value, moving averages and momentum — translated into plain English.</div>
 <div class="grid market5">
 ${card('Current price',money(D.market.price),'Market close · '+D.market.asof)}
 ${card('DCF fair value',money(fv),'Base DCF · '+D.market.model_asof,D.market.price>fv?'neg':'pos')}
 <div class="card clickable" data-inspect="consensus"><div class="sub">Analyst consensus target <span class="badge purple">${D.consensus.status||'DEMO'}</span></div><div class="value purple">${money(cm)}</div><div class="small">Median ${money(medt)} · range ${money(cl)}–${money(ch)}</div></div>
 ${card('RSI (14)',rs.toFixed(1),rs>70?'Momentum · near overbought':rs<30?'Momentum · near oversold':'Momentum · neutral')}
 ${card('Trend',trend,`Price ${D.market.price>s20?'>':'<'} SMA20 ${s20>s50?'>':'<'} SMA50 ${s50>s200?'>':'<'} SMA200`,trend.includes('Bullish')?'pos':'warn')}
 </div>
 <div class="card" id="ertConsensus" style="margin-top:12px"><h3>Analyst consensus price context <span class="badge purple">${D.consensus.status||'DEMO'}</span></h3><div class="grid k4">
 ${card('Mean target',money(cm),`${((cm/D.market.price-1)*100)>=0?'+':''}${((cm/D.market.price-1)*100).toFixed(1)}% vs current price`,'purple')}
 ${card('Median target',money(medt),'External analyst reference','purple')}
 ${card('Low target',money(cl),'Lower end of target range')}
 ${card('High target',money(ch),'Upper end of target range')}
 </div><div class="sourcebox"><strong>Consensus source:</strong> ${D.consensus.displaySource}. Production version must show provider, analyst count, as-of date and historical revisions.</div></div>
 <div class="grid k3" style="margin-top:12px">${card('SMA20',money(s20),`Short-term (~1 month) · price ${(D.market.price/s20-1)*100>=0?'+':''}${((D.market.price/s20-1)*100).toFixed(1)}% vs SMA`)}${card('SMA50',money(s50),`Medium-term (~2–3 months) · price ${(D.market.price/s50-1)*100>=0?'+':''}${((D.market.price/s50-1)*100).toFixed(1)}% vs SMA`)}${card('SMA200',money(s200),`Long-term (~9–10 months) · price ${(D.market.price/s200-1)*100>=0?'+':''}${((D.market.price/s200-1)*100).toFixed(1)}% vs SMA`)}</div>
 <div class="card" style="margin-top:12px"><h3>Price, moving averages, DCF fair value and consensus</h3>${marketChart(dates,ps,s20s,s50s,s200s,fv,cm,cl,ch)}<div class="legend"><span><i style="background:var(--blue)"></i>Price</span><span><i style="background:var(--amber)"></i>SMA20</span><span><i style="background:var(--purple)"></i>SMA50</span><span><i style="background:var(--cyan)"></i>SMA200</span><span><i style="background:var(--green)"></i>DCF fair value</span><span><i style="background:#bd9cff"></i>Consensus mean</span><span><i style="background:rgba(189,156,255,.28)"></i>Consensus range</span></div></div>
 <div class="card" style="margin-top:12px"><h3>RSI (14) — momentum</h3>${rsiChart(dates,rsis)}<div class="finding ${rs>70?'find-risk':'find-pos'}"><h4>What does this mean?</h4><p>RSI compares recent gains with recent losses. Above 70 often means momentum is unusually strong / stretched; below 30 often means unusually weak. It is not a valuation measure or automatic buy/sell signal.</p></div></div>

function marketChart(ds,p,s20,s50,s200,fv,cm,cl,ch){
 let W=1000,H=390,pad=58,vals=[...p,...s20.filter(Boolean),...s50.filter(Boolean),...s200.filter(Boolean),fv,cm,cl,ch],
 mn=Math.floor(Math.min(...vals)/10)*10,mx=Math.ceil(Math.max(...vals)/10)*10,
 x=i=>pad+i*(W-2*pad)/(p.length-1),y=v=>H-pad-(v-mn)/(mx-mn)*(H-2*pad),
 path=(a,cls)=>{let d='',started=false;a.forEach((v,i)=>{if(v==null)return;d+=(started?'L':'M')+x(i)+','+y(v)+' ';started=true});return `<path class="${cls}" d="${d}"/>`};
 let end=p.length-1,idx=[0,Math.round(end*.25),Math.round(end*.5),Math.round(end*.75),end],ticks=[mn,mn+(mx-mn)*.25,mn+(mx-mn)*.5,mn+(mx-mn)*.75,mx];
 return `<div class="chart marketMainChart" style="height:390px"><svg viewBox="0 0 ${W} ${H}">
 <line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/><line class="axis" x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}"/>
 ${ticks.map(t=>`<text x="${pad-8}" y="${y(t)+4}" text-anchor="end" fill="#99adbf" font-size="11">$${t.toFixed(0)}</text><line class="axis" opacity=".22" x1="${pad}" y1="${y(t)}" x2="${W-pad}" y2="${y(t)}"/>`).join('')}
 <rect x="${pad}" y="${y(ch)}" width="${W-2*pad}" height="${Math.max(0,y(cl)-y(ch))}" fill="#bd9cff" opacity=".10"/>
 <line x1="${pad}" y1="${y(cm)}" x2="${W-pad}" y2="${y(cm)}" stroke="#bd9cff" stroke-width="2" stroke-dasharray="9 5"/>
 ${path(p,'priceLine')}${path(s20,'sma20')}${path(s50,'sma50')}${path(s200,'sma200')}<path class="fair" d="M${pad},${y(fv)} L${W-pad},${y(fv)}"/>
 ${idx.map(i=>`<text x="${x(i)}" y="${H-22}" text-anchor="middle" fill="#99adbf" font-size="10">${ds[i].slice(0,7)}</text>`).join('')}
 <circle cx="${x(end)}" cy="${y(p[end])}" r="5" fill="var(--blue)"/><text x="${x(end)-8}" y="${y(p[end])-9}" text-anchor="end" fill="#fff" font-size="10">${money(p[end])}</text>
 <text x="${W-pad-5}" y="${y(fv)-7}" text-anchor="end" fill="var(--green)" font-size="10">DCF ${money(fv)}</text>
 <text x="${W-pad-5}" y="${y(cm)-7}" text-anchor="end" fill="#c8a6ff" font-size="10">Consensus ${money(cm)} (DEMO)</text>
 <text x="${pad+5}" y="${y(ch)+14}" fill="#bda1ea" font-size="9">High ${money(ch)}</text><text x="${pad+5}" y="${y(cl)-5}" fill="#bda1ea" font-size="9">Low ${money(cl)}</text>
 </svg></div>`;
}
function rsiChart(ds,a){let W=900,H=220,pad=42,x=i=>pad+i*(W-2*pad)/(a.length-1),y=v=>H-pad-v/100*(H-2*pad),d='',s=false;a.forEach((v,i)=>{if(v==null)return;d+=(s?'L':'M')+x(i)+','+y(v)+' ';s=true});let idx=[0,65,130,195,259];return `<div class="chart" style="height:210px"><svg viewBox="0 0 ${W} ${H}"><line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/><line x1="${pad}" y1="${y(70)}" x2="${W-pad}" y2="${y(70)}" stroke="var(--amber)" stroke-dasharray="5 4"/><line x1="${pad}" y1="${y(30)}" x2="${W-pad}" y2="${y(30)}" stroke="var(--cyan)" stroke-dasharray="5 4"/><text x="${pad-7}" y="${y(70)+4}" text-anchor="end" fill="#f4c65f" font-size="10">70</text><text x="${pad-7}" y="${y(30)+4}" text-anchor="end" fill="#73d6f2" font-size="10">30</text><path class="rsiLine" d="${d}"/>${idx.map(i=>`<text x="${x(i)}" y="${H-15}" text-anchor="middle" fill="#99adbf" font-size="10">${ds[i].slice(0,7)}</text>`).join('')}</svg></div>`}

function report(){let R=rating(),fv=dcf().ps,mos=(fv/D.market.price-1)*100;return `<div class="noPrint actions"><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div><div class="report"><h1>Alphabet Inc. (GOOG)</h1><p><strong>Plain-language equity research summary</strong></p>
 <h2>Company & business overview</h2><div class="companyOverviewGrid"><div class="companyOverviewBox"><h3>What does Alphabet do?</h3><p>Alphabet is the parent company of Google. Its main economics come from Search and other advertising, YouTube, subscriptions/platforms/devices, Google Cloud and smaller Other Bets.</p><p><strong>Sector / industry:</strong> Interactive media / internet services<br><strong>Primary cash engine:</strong> Google advertising<br><strong>Major growth engine:</strong> Google Cloud / AI</p></div><div class="companyOverviewBox"><h3>Strengths vs weaknesses</h3><p class="positiveText"><strong>Strengths:</strong> Search distribution, YouTube scale, Cloud/AI opportunity, high cash generation and a strong balance sheet.</p><p class="negativeText"><strong>Risks:</strong> advertising dependence, AI/search disruption, regulation, heavy infrastructure CapEx, Cloud competition and uncertain returns from Other Bets.</p></div></div>
 <h2>Business / revenue mix</h2><table class="bizMix"><thead><tr><th>Business</th><th>Economic role</th><th>Contribution</th><th>Main opportunity</th><th>Main downside</th></tr></thead><tbody><tr><td><strong>Google Search & other</strong></td><td>Core advertising cash engine</td><td>Use filing-derived revenue</td><td>Commercial intent + AI monetisation</td><td>AI behaviour shift / antitrust</td></tr><tr><td><strong>YouTube</strong></td><td>Ads + subscriptions</td><td>Use disclosed categories</td><td>Video / creator ecosystem</td><td>Platform competition</td></tr><tr><td><strong>Subscriptions / platforms / devices</strong></td><td>Diversification</td><td>Use filing-derived revenue</td><td>Recurring subscriptions</td><td>Mixed hardware/platform economics</td></tr><tr><td><strong>Google Cloud</strong></td><td>Cloud + AI growth engine</td><td>Revenue + segment profit where disclosed</td><td>Enterprise AI / cloud</td><td>CapEx + AWS/Azure competition</td></tr><tr><td><strong>Other Bets</strong></td><td>Long-duration optionality</td><td>Segment disclosure where available</td><td>Waymo / new businesses</td><td>Losses / uncertain payoff</td></tr></tbody></table><p><small>Production build must populate exact contribution, 5Y trend and profitability from Alphabet filings. Items not separately disclosed must be labelled rather than estimated.</small></p>
 <div style="font-size:30px;color:#d9a500">${star(R.overall)} <span style="font-size:16px;color:#111">${R.overall.toFixed(1)}/5</span></div><h2>Investment scorecard</h2><div class="reportGrid">${[['Moat',R.moat],['Business quality',R.quality],['Growth',R.growth],['Financial health',R.fin],['Capital allocation',R.capital],['Valuation',R.val]].map(x=>`<div class="reportScore"><strong>${x[0]}</strong><span style="float:right">${x[1].toFixed(1)}/5</span><div class="bar"><i style="width:${x[1]/5*100}%"></i></div></div>`).join('')}</div><h2>Three-minute summary</h2><p>Alphabet is a high-quality, strong-moat business with improving operating profitability and high returns on invested capital. The central tension is valuation: recent AI-related CapEx reduces free cash flow while the market price implies substantially faster future FCF growth than the ERT base case.</p><h2>Valuation view</h2><p>Current price is <strong>${money(D.market.price)}</strong>; base DCF fair value is <strong>${money(fv)}</strong>, implying <strong>${pct(mos)}</strong> upside/downside. This result depends heavily on WACC, terminal growth, CapEx and the FCF definition.</p><h2>Market & consensus</h2><p>Analyst consensus target is <strong>${D.consensus&&D.consensus.status==='LIVE'?money(D.consensus.targetMean):'Unavailable'}</strong>. Market-implied FCF growth is <strong>${pct(reverse())}</strong>.</p><h2>What to watch next</h2><ul>${D.events.map(e=>`<li><strong>${e.date}</strong> — ${e.title}: ${e.watch}</li>`).join('')}</ul><h2>Disclaimer</h2><p>For research and educational reference only. Live-connected fields use the configured data sources; unavailable sources are labelled. Some research/event narrative fields may remain prototype content. Not investment advice.</p></div>`}

 if(String(special).startsWith('driver:')){let k=special.split(':')[1];if(k==='revenue')return specialInspector('Revenue growth driver',`<p><strong>What is it?</strong> The year-by-year growth assumption used to build forecast revenue.</p><div class="formula">Forecast Revenueₜ = Revenueₜ₋₁ × (1 + growthₜ)</div><p><strong>Why it matters:</strong> Revenue is the top-line driver. With OCF margin and CapEx intensity held constant, higher revenue creates more OCF and FCF.</p><div class="finding find-risk"><h4>How to use it</h4><p>Edit Y1–Y5 directly or use Bear/Base/Bull. Every change flows through the driver DCF immediately.</p></div>`);if(k==='ocf')return specialInspector('OCF margin driver',`<p><strong>What is it?</strong> Operating cash flow as a percentage of revenue.</p><div class="formula">OCF = Revenue × OCF margin</div><p>It captures cash conversion before capital expenditure. Higher OCF margin raises FCF if CapEx intensity is unchanged.</p>`);return specialInspector('CapEx / Revenue driver',`<p><strong>What is it?</strong> Capital expenditure as a percentage of revenue.</p><div class="formula">CapEx = Revenue × CapEx intensity<br>FCF margin = OCF margin − CapEx / Revenue</div><p><strong>Why it matters to GOOG:</strong> AI/data-centre investment can depress near-term FCF while potentially supporting future growth.</p><div class="finding find-risk"><h4>Classification limitation</h4><p>Maintenance, growth and one-off CapEx are not precisely separated here because Alphabet does not disclose a full split. Do not invent one.</p></div>`)}
 if(special==='dcfresult')return specialInspector('DCF result — how the answer is built',`<p><strong>What is it?</strong> Present value of forecast FCF plus terminal value, adjusted for net cash, divided by shares.</p>${list([['Enterprise value',fmt(dcf().ev)+' USD million'],['Net cash',fmt(D.market.net_cash_m)+' USD million'],['Equity value',fmt(dcf().equity)+' USD million'],['Shares',fmt(D.market.shares_m)+' million'],['Fair value',money(dcf().ps)+'/share']])}<div class="finding find-risk"><h4>Stress-test it</h4><p>Change WACC, terminal growth or yearly FCF growth on the left. The result and sensitivity table recalculate immediately.</p></div>`);

 return `<aside class="ins ${S.show?'mobileOpen':''}"><div class="ih"><strong>Evidence & Analysis Inspector</strong><div class="sp"></div><button class="btn" id="hide">Hide</button></div><div style="padding:12px"><h3>${r[1]}</h3><div class="sub">${unit}</div>${spark(r[2])}<div class="meta"><div><span>Cell ID</span><strong>${r[0]}.FY2024</strong></div><div><span>Latest value</span><strong>${fmt(last(r[2]),2)}</strong></div><div><span>5Y CAGR</span><strong>${isFinite(cagr(r[2]))?pct(cagr(r[2])):'—'}</strong></div><div><span>2024 YoY</span><strong>${yy(r[2],4)==null?'—':pct(yy(r[2],4))}</strong></div><div><span>Form</span><strong>10-K FY2024</strong></div><div><span>Report page</span><strong>${pg}</strong></div></div><div class="finding find-pos"><h4>So what?</h4><p>${soWhat(r[0])}</p></div><div class="actions"><a class="btn primary" target="_blank" href="${D.source.filing}">Open filing</a><a class="btn" target="_blank" href="${D.source.pdf}#page=${pg}">Open page</a></div></div></aside>`;

function waccInspector(k){let W=wacc(),common=`<div class="formula">WACC = E/(D+E) × Cost of Equity + D/(D+E) × After-tax Cost of Debt</div>`;if(k==='wacc:rf')return specialInspector('Risk-free rate — '+pct(S.rf),`<p><strong>What is it?</strong> Baseline return assumed for a near-default-free USD investment. USD DCFs commonly benchmark this to long-dated US Treasuries.</p>${list([['Selected assumption',pct(S.rf)],['Reference instrument','US 10Y Treasury'],['Why it matters','Higher risk-free → higher WACC → lower DCF value']])}<div class="finding find-risk"><h4>Benchmark / source</h4><p>Connect to the U.S. Treasury daily par yield curve in production and display the exact as-of date. Do not silently hard-code a live yield.</p></div>`);if(k==='wacc:beta')return specialInspector('Beta — '+S.beta.toFixed(2),`<p><strong>What is it?</strong> Sensitivity of GOOG equity returns to the broad market. 1.0 ≈ market-like; above 1 = historically more sensitive.</p>${list([['Selected beta',S.beta.toFixed(2)],['Used in','Cost of equity = Rf + Beta × ERP'],['Impact','Higher beta → higher WACC → lower fair value']])}<div class="finding find-risk"><p>Production version should show provider, lookback period and frequency (for example 2Y weekly / 5Y monthly) plus an industry benchmark.</p></div>`);if(k==='wacc:erp')return specialInspector('Equity risk premium — '+S.erp.toFixed(2)+'%',`
<p><strong>What is it?</strong> The extra return investors require for owning US equities rather than a near-default-free USD investment.</p>
<h3>Why exactly ${S.erp.toFixed(2)}%?</h3>
<p>The selected 4.18% is intended to represent Aswath Damodaran / NYU Stern's <strong>US implied equity risk premium</strong> benchmark. It is not supposed to be a round-number ERT guess.</p>
<div class="formula">
Observed S&amp;P 500 price<br>
= present value of expected future shareholder cash flows<br>
discounted at the market-required equity return (r)<br><br>
Solve the valuation equation for <strong>r</strong><br>
then: <strong>Implied ERP = r − risk-free rate</strong>
</div>
<h3>So where does the implied equity return come from?</h3>
<p>It is <strong>solved from the market price</strong>. The calculation asks: “Given today's S&amp;P 500 level and the cash flows investors expect to receive, what discount rate makes those future cash flows equal today's index price?” That solved discount rate is the market-implied expected equity return.</p>
<h3>What inputs are required to reproduce 4.18%?</h3>
${list([
['1. Market price','S&P 500 index level on the benchmark date'],
['2. Near-term cash flows','Expected dividends + buybacks / shareholder distributions'],
['3. Near-term growth','Forecast growth in earnings / cash returned to shareholders'],
['4. Terminal growth','Long-run mature growth assumption'],
['5. Risk-free rate','Matching USD Treasury benchmark'],
['6. Solve for r','Discount rate that equates PV of expected cash flows to the observed index price'],
['7. Subtract Rf','r − risk-free rate = implied ERP']
])}
<div class="finding find-risk"><h4>Why I am not showing invented intermediate numbers</h4>
<p>The current prototype stores the 4.18% benchmark but does not yet store the full dated Damodaran worksheet inputs needed to reproduce it line-by-line. Therefore it must <strong>not</strong> invent an “8.63% implied return” or any S&amp;P cash-flow assumptions merely to make the explanation look complete.</p></div>
<h3>Why implied ERP rather than historical ERP?</h3>
<p>Historical ERP tells you what equities earned over bonds in the past. Implied ERP is forward-looking: it extracts the return premium embedded in today's market price and expected cash flows. For a current DCF discount rate, that is usually the more relevant benchmark.</p>
<h3>Why can the number be 4.18% rather than 4%, 5% or 10%?</h3>
<p>Because it is the <strong>output of the market-implied valuation equation</strong>, not a rating scale. If index price, expected distributions, growth expectations or Treasury yields change, the solved ERP changes as well. There is no requirement for it to be a round number.</p>
${list([
['Selected ERP',S.erp.toFixed(2)+'%'],
['Risk-free assumption',pct(S.rf)],
['Beta',S.beta.toFixed(2)],
['GOOG cost of equity',pct(W.coe)],
['GOOG WACC',pct(W.w)],
['Valuation impact','Higher ERP → higher cost of equity/WACC → lower fair value']
])}

      const o1=0.60*latestOcf+0.40*histOcf, o5=0.45*latestOcf+0.55*histOcf;
      const c1=0.70*latestCap+0.30*histCap, c5=0.40*latestCap+0.60*histCap;
      const lerp=(a,b,i)=>a+(b-a)*(i/4);
      const base={rev:[0,1,2,3,4].map(i=>+lerp(r1,r5,i).toFixed(1)),ocf:[0,1,2,3,4].map(i=>+lerp(o1,o5,i).toFixed(1)),cap:[0,1,2,3,4].map(i=>+lerp(c1,c5,i).toFixed(1))};
      S.liveBaseDrivers=base;
      if(S.drvScenario!=='Custom'){S.drvRev=[...base.rev];S.drvOcf=[...base.ocf];S.drvCap=[...base.cap];S.drvScenario='Base';}
    }
  }
  function apply(d){
    const m=d.market||{}, s=d.sec||{}, t=d.treasury||{}, c=d.consensus||{};
    if(typeof D!=='undefined'){
      if(D.market){
        if(m.price!=null) D.market.price=m.price;
        if(m.asof) D.market.asof=m.asof;
        D.market.previous_close=m.previous_close??null; D.market.day_change=m.day_change??null; D.market.day_change_pct=m.day_change_pct??null;
        if(s.shares_m!=null) D.market.shares_m=s.shares_m;
        if(s.net_cash_m!=null) D.market.net_cash_m=s.net_cash_m;
        D.market.model_asof=new Date().toISOString().slice(0,10);
      }
      if(Array.isArray(m.history)&&m.history.length>30){
        D.dates=m.history.map(x=>x.date);
        D.prices=m.history.map(x=>x.close);
      }
      if(D.consensus && c.available){
        D.consensus.targetMean=c.mean;
        D.consensus.targetMedian=c.median;
        D.consensus.targetLow=c.low;
        D.consensus.targetHigh=c.high;
        D.consensus.analysts=c.analysts||null;
        D.consensus.rating=c.rating||'—';
        D.consensus.status='LIVE';
        D.consensus.displaySource=c.source;
        D.consensus.asof=c.asof;
      } else if(D.consensus){
        D.consensus.status='UNAVAILABLE';
        D.consensus.displaySource='No reliable live consensus returned by configured data source';
      }
      D.live = d;
      syncAnnualSEC(s);
    }
    if(typeof S!=='undefined'){
      if(t.ten_year!=null) S.rf=t.ten_year;
      if(d.erp && d.erp.value!=null) S.erp=d.erp.value;
    }
    setPill('ertStatus','ok','LIVE · updated '+(d.generated_at||'now'));
    setPill('ertPrice','ok','Price '+fmtMoney(m.price)+' · '+(m.asof||''));
    setPill('ertSEC','ok','SEC '+(s.latest_form||'')+' · '+(s.latest_period||''));
    setPill('ertTreasury',t.ten_year!=null?'ok':'warn','US 10Y '+(t.ten_year!=null?fmtPct(t.ten_year):'unavailable'));
    setPill('ertConsensus',c.available?'ok':'warn',c.available?'Consensus '+fmtMoney(c.mean):'Consensus unavailable');
  }

  function setPill(id,cls,text){
    const x=document.getElementById(id); if(!x)return;
    x.className='livepill '+cls;x.textContent=text;
  }

  function restoreStatus(d){
    if(!d)return;
    const m=d.market||{},s=d.sec||{},t=d.treasury||{},c=d.consensus||{};
    setPill('ertStatus','ok','LIVE · updated '+(d.generated_at||'now'));
    setPill('ertPrice','ok','Price '+fmtMoney(m.price)+' · '+(m.asof||''));
    setPill('ertSEC','ok','SEC '+(s.latest_form||'')+' · '+(s.latest_period||''));
    setPill('ertTreasury',t.ten_year!=null?'ok':'warn','US 10Y '+(t.ten_year!=null?fmtPct(t.ten_year):'unavailable'));
    setPill('ertConsensus',c.available?'ok':'warn',c.available?'Consensus '+fmtMoney(c.mean):'Consensus unavailable');
  }

  function ensureBar(){
    const a=document.getElementById('app');if(!a||document.getElementById('ertLiveBar'))return;
    const bar=document.createElement('div');bar.className='livebar';bar.id='ertLiveBar';
    bar.innerHTML='<span id="ertStatus" class="livepill warn">Live API not checked</span>'+
      '<span id="ertPrice" class="livepill">Price —</span>'+
      '<span id="ertSEC" class="livepill">SEC —</span>'+
      '<span id="ertTreasury" class="livepill">US 10Y —</span>'+
      '<span id="ertConsensus" class="livepill">Consensus —</span>'+
      '<button class="apiBtn" id="ertApi">⚙ API</button>'+
      '<button class="refreshBtn" id="ertLiveRefresh">↻ Refresh Live Data</button>';
    a.prepend(bar);
    document.getElementById('ertApi').onclick=configure;
    document.getElementById('ertLiveRefresh').onclick=refresh;
  }

  function financialPanel(){
    const a=document.getElementById('app'); if(!a||!live.data||document.getElementById('ertLiveFinancials'))return;
    const p=(typeof S!=='undefined'&&S.page)||'';
    if(!['overview','financials','valuation','report'].includes(p))return;
    const s=live.data.sec||{};
    const sec=document.createElement('section');sec.className='card liveDataPanel';sec.id='ertLiveFinancials';
    sec.innerHTML='<h3>Latest live financial anchor</h3><div class="liveDataGrid">'+
      '<div class="card"><div class="sub">Revenue TTM</div><div class="value">'+fmtBn(s.revenue_ttm_m)+'</div><div class="small">'+(s.latest_period||'')+'</div></div>'+
      '<div class="card"><div class="sub">Net income TTM</div><div class="value">'+fmtBn(s.net_income_ttm_m)+'</div><div class="small">SEC XBRL</div></div>'+
      '<div class="card"><div class="sub">Operating cash flow TTM</div><div class="value">'+fmtBn(s.ocf_ttm_m)+'</div><div class="small">SEC XBRL</div></div>'+
      '<div class="card"><div class="sub">CapEx TTM</div><div class="value">'+fmtBn(s.capex_ttm_m)+'</div><div class="small">FCF '+fmtBn(s.fcf_ttm_m)+'</div></div>'+
      '</div><div class="sourcebox"><b>Live valuation anchor:</b> DCF uses latest TTM FCF, latest shares and latest net-cash/debt values where available. Source: '+(s.source||'SEC EDGAR')+'.</div>';
    const bar=document.getElementById('ertLiveBar'); if(bar)bar.after(sec); else a.prepend(sec);
  }

  // Override DCF anchor functions only when live SEC data exists.
  const origBaseFcf = window.baseFcf;
  const origMarketCap = window.marketCap;
  const origWacc = window.wacc;
  const origDcf = window.dcf;

  if(typeof origBaseFcf==='function'){
    window.baseFcf=function(){
      const s=live.data&&live.data.sec;
      if(s && s.fcf_ttm_m!=null && S.basis==='reported') return s.fcf_ttm_m;
      if(s && s.revenue_ttm_m!=null && S.basis==='margin') return s.revenue_ttm_m * avg(fcfMargins())/100;
      return origBaseFcf();
    };
  }
  if(typeof origMarketCap==='function'){
    window.marketCap=function(){
      const s=live.data&&live.data.sec, m=live.data&&live.data.market;
      if(s&&s.shares_m!=null&&m&&m.price!=null) return s.shares_m*m.price;
      return origMarketCap();
    };
  }
  if(typeof origWacc==='function'){
    window.wacc=function(){
      const s=live.data&&live.data.sec;
      let W=origWacc();
      if(!s||s.debt_m==null)return W;
      let coe=S.rf+S.beta*S.erp, eq=marketCap(), debt=s.debt_m, ew=eq/(eq+debt),dw=1-ew,after=S.cod*(1-S.tax/100);
      return {w:coe*ew+after*dw,coe,after,ew,dw,debt,eq};
    };
  }
  if(typeof origDcf==='function'){
    window.dcf=function(g=S.g,w=wacc().w,t=S.terminal){
      const s=live.data&&live.data.sec;
      if(!s||s.net_cash_m==null||s.shares_m==null)return origDcf(g,w,t);
      let f=baseFcf(),pv=0,detail=[];
      g.forEach((x,i)=>{f*=1+x/100;let df=1/Math.pow(1+w/100,i+1);pv+=f*df;detail.push({g:x,fcf:f,df,pv:f*df})});
      let spread=w/100-t/100;if(spread<=0)return {ps:NaN,equity:NaN,ev:NaN,pv,pvt:NaN,detail,tvshare:NaN};
      let tv=f*(1+t/100)/spread,pvt=tv/Math.pow(1+w/100,5),ev=pv+pvt,equity=ev+s.net_cash_m;
      return {ps:equity/s.shares_m,equity,ev,pv,pvt,detail,tvshare:pvt/ev*100};
    };
  }

  
  function liveFinancialStatements(){
    const a=document.getElementById('app'); if(!a||!live.data||document.getElementById('ertLiveStatements'))return;
    const p=(typeof S!=='undefined'&&S.page)||'';
    if(p!=='financials')return;
    const s=live.data.sec||{}, I=s.income_ttm||{}, C=s.cashflow_ttm||{};
    const rows=[
      ['Revenues',I.revenue],
      ['Cost of revenues',I.cost_of_revenue],
      ['Research and development',I.research_and_development],
      ['Sales and marketing',I.sales_and_marketing],
      ['General and administrative',I.general_and_administrative],
      ['Income from operations',I.operating_income],
      ['Income before income taxes',I.pretax_income],
      ['Provision for income taxes',I.income_tax],
      ['Net income',I.net_income],
      ['Diluted EPS',I.diluted_eps,'eps']
    ];
    const sec=document.createElement('section');sec.className='card liveDataPanel';sec.id='ertLiveStatements';
    sec.innerHTML=`<h2>LIVE Financial Statements — latest SEC TTM</h2>
      <div class="sourcebox"><strong>Latest filing:</strong> ${s.latest_form||'—'} · period ${s.latest_period||'—'} · Source: ${s.source||'SEC EDGAR'}<br>
      <strong>Annual history:</strong> the table below is synchronised to the latest five complete SEC fiscal years when available. TTM remains a separate current valuation anchor.</div>
      <h3>Income statement — TTM</h3>
      <table class="ert-table"><thead><tr><th>Line item</th><th>TTM</th><th>Period</th><th>Status</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${r[0]}</td><td><strong>${r[1]==null?'Unavailable':(r[2]==='eps'?Number(r[1]).toFixed(2):fmtBn(r[1]))}</strong></td><td>${s.latest_period||'—'}</td><td>${r[1]==null?'Not mapped from SEC XBRL':'LIVE SEC'}</td></tr>`).join('')}
      </tbody></table>
      <h3 style="margin-top:16px">Cash flow — TTM</h3>
      <div class="liveDataGrid">
        <div class="card"><div class="sub">Operating cash flow</div><div class="value">${fmtBn(C.operating_cash_flow)}</div></div>
        <div class="card"><div class="sub">CapEx</div><div class="value">${fmtBn(C.capex)}</div></div>
        <div class="card"><div class="sub">Free cash flow</div><div class="value">${fmtBn(C.free_cash_flow)}</div></div>
        <div class="card"><div class="sub">Net cash</div><div class="value">${fmtBn(s.net_cash_m)}</div></div>
      </div>`;
    const lead=[...a.querySelectorAll('h1')].find(x=>/financial statements/i.test(x.textContent));
    if(lead) lead.parentNode.insertBefore(sec,lead.nextSibling.nextSibling); else a.prepend(sec);
  }

  function enhance(){ ensureBar(); financialPanel(); liveFinancialStatements(); }
  new MutationObserver(()=>setTimeout(enhance,0)).observe(document.getElementById('app'),{childList:true,subtree:true});
  setTimeout(()=>{
    enhance();
    if(configured()) refresh();
    else setPill('ertStatus','warn','Configure live API once: ⚙ API');
  },100);

  window.ERT_REFRESH_LIVE=refresh;
})();
</script>
</body></html>
